"366" y2="304" stroke="#E8EEEE" stroke-width="1"/><text x="24" y="344" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#8A9694" text-anchor="start">年级</text><text x="150" y="344" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#333333" text-anchor="start">大三</text><line x1="24" y1="362" x2="366" y2="362" stroke="#E8EEEE" stroke-width="1"/><text x="24" y="402" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#8A9694" text-anchor="start">地区</text><text x="150" y="402" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#333333" text-anchor="start">北京</text><line x1="24" y1="420" x2="366" y2="420" stroke="#E8EEEE" stroke-width="1"/><text x="24" y="472" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#8A9694" text-anchor="start">个人简介</text><rect x="24" y="490" width="342" height="90" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="40" y="518" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400" fill="#66716F" text-anchor="start">喜欢记录生活，也喜欢认识有趣的人。</text><text x="40" y="544" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400" fill="#66716F" text-anchor="start">摄影、音乐、旅行、电影都很喜欢。</text></svg>