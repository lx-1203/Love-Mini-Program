<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>寻觅 v3｜悄悄话弹层</title>
  <defs>
    <linearGradient id="heroGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ACB98"/><stop offset="1" stop-color="#B4F0D8"/>
    </linearGradient>
    <linearGradient id="heroPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B9D"/><stop offset="1" stop-color="#FFD0E1"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FAF9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B5B46" flood-opacity=".12"/>
    </filter>
    <filter id="shadowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#E84E83" flood-opacity=".18"/>
    </filter>
  </defs>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#000000" opacity="0.25"/>
<rect x="0" y="420" width="390" height="424" rx="24" fill="#FFFFFF"/>
<circle cx="195" cy="452" r="5" fill="#FF5D91"/>
<text x="22" y="485" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20px" fill="#1E1E1E" font-weight="800" text-anchor="start">送一条悄悄话</text>
<text x="368" y="485" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22px" fill="#7A7A7A" font-weight="500" text-anchor="end">×</text>
<text x="22" y="515" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="10px" fill="#7A7A7A" font-weight="400" text-anchor="start">最多 60 字 · 200 交友币 · 发送后进入对方收件箱</text>
<rect x="22" y="540" width="346" height="120" rx="16" fill="#FAFCFB" stroke="#E9E9E9" stroke-width="1"/>
<text x="38" y="570" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="12px" fill="#7A7A7A" font-weight="400" text-anchor="start">例如：看到了你的旅行动态，</text>
<text x="38" y="592" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="12px" fill="#7A7A7A" font-weight="400" text-anchor="start">感觉我们都很喜欢海边。</text>
<text x="340" y="642" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="10px" fill="#7A7A7A" font-weight="500" text-anchor="end">18/60</text>
<text x="22" y="690" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11px" fill="#1E1E1E" font-weight="600" text-anchor="start">余额 1,250 交友币</text>
<text x="368" y="690" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11px" fill="#FF5D91" font-weight="700" text-anchor="end">扣除 200</text>
<rect x="22" y="718" width="346" height="44" rx="22" fill="#34C38F"/>
<text x="195.0" y="746" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14px" fill="#FFFFFF" font-weight="700" text-anchor="middle">送出悄悄话</text>
</svg>