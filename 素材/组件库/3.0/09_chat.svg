xt-anchor="start">可以呀，你最近喜欢看什么？</text><circle cx="30" cy="394" r="17" fill="#E9F7F1" stroke="none" stroke-width="1"/><rect x="54" y="376" width="230" height="44" rx="14" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="68" y="403" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#333333" text-anchor="start">最近想看一部新上映的电影</text><rect x="0" y="776" width="390" height="68" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><rect x="16" y="792" width="34" height="34" rx="17" fill="#F3F6F5" stroke="none" stroke-width="1" opacity="1"/><text x="33" y="815" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="500" fill="#66716F" text-anchor="middle">☺</text><rect x="58" y="792" width="34" height="34" rx="17" fill="#F3F6F5" stroke="none" stroke-width="1" opacity="1"/><text x="75" y="814" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="500" fill="#66716F" text-anchor="middle">+</text><rect x="102" y="792" width="222" height="34" rx="17" fill="#F3F6F5" stroke="none" stroke-width="1" opacity="1"/><text x="116" y="814" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400" fill="#9AA5A3" text-anchor="start">输入消息…</text><rect x="330" y="792" width="44" height="34" rx="17" fill="#DDE7E5" stroke="none" stroke-width="1" opacity="1"/><text x="352" y="814" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">发送</text></svg>