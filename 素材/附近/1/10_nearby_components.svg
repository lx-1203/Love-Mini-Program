<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<title>寻觅 v3｜Nearby Components</title><rect width="1200" height="820" fill="#FFFFFF"/>
<text x="48" y="58" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="800" fill="#1E1E1E">Nearby Components / States</text>
<text x="48" y="88" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#78858A">CircleCard / CampusCard / PostCard / ActivityCard / Composer / Permission / Recognition CTA</text>
<rect x="48" y="120" width="520" height="122" rx="18" fill="#F9FCFB" stroke="#DDE8E3"/><text x="66" y="148" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#1E1E1E">CircleCard</text><text x="66" y="172" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#78858A">cover / 圈名 / 人数 / 加入</text><text x="66" y="200" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" font-weight="700" fill="#168B65">适用：开放兴趣圈</text><rect x="608" y="120" width="520" height="122" rx="18" fill="#F9FCFB" stroke="#DDE8E3"/><text x="626" y="148" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#1E1E1E">CampusCard</text><text x="626" y="172" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#78858A">学校 / 认证状态 / 成员 / 进入</text><text x="626" y="200" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" font-weight="700" fill="#168B65">适用：认证校园圈</text><rect x="48" y="270" width="520" height="122" rx="18" fill="#F9FCFB" stroke="#DDE8E3"/><text x="66" y="298" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#1E1E1E">PostCard</text><text x="66" y="322" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#78858A">头像 / 作者 / 内容 / 图片 / 点赞 / 评论 / 认识TA</text><text x="66" y="350" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" font-weight="700" fill="#168B65">适用：附近动态</text><rect x="608" y="270" width="520" height="122" rx="18" fill="#F9FCFB" stroke="#DDE8E3"/><text x="626" y="298" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#1E1E1E">ActivityCard</text><text x="626" y="322" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#78858A">封面 / 时间 / 距离 / 报名</text><text x="626" y="350" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" font-weight="700" fill="#168B65">适用：线下活动</text><rect x="48" y="420" width="520" height="122" rx="18" fill="#F9FCFB" stroke="#DDE8E3"/><text x="66" y="448" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#1E1E1E">Composer</text><text x="66" y="472" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#78858A">动态 / 找搭子 / 活动</text><text x="66" y="500" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" font-weight="700" fill="#168B65">适用：发布入口</text><rect x="608" y="420" width="520" height="122" rx="18" fill="#F9FCFB" stroke="#DDE8E3"/><text x="626" y="448" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#1E1E1E">Permission</text><text x="626" y="472" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#78858A">开放 / 未认证 / 认证中 / 已认证 / 非本校</text><text x="626" y="500" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" font-weight="700" fill="#168B65">适用：权限状态</text><rect x="48" y="570" width="520" height="122" rx="18" fill="#F9FCFB" stroke="#DDE8E3"/><text x="66" y="598" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#1E1E1E">Recognition</text><text x="66" y="622" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#78858A">认识TA → 他人主页 → 喜欢/悄悄话</text><text x="66" y="650" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" font-weight="700" fill="#168B65">适用：恋爱闭环</text><rect x="608" y="570" width="520" height="122" rx="18" fill="#F9FCFB" stroke="#DDE8E3"/><text x="626" y="598" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="800" fill="#1E1E1E">EmptyState</text><text x="626" y="622" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" fill="#78858A">无内容 / 无更多 / 未登录 / 网络异常</text><text x="626" y="650" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="11" font-weight="700" fill="#168B65">适用：统一状态</text><text x="48" y="790" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="12" fill="#78858A">Tokens：主绿 #34C38F / 心动粉 #FF5A91 / 圆角 16–20 / 间距 8·12·16·24·32。所有图片均为独立素材层，不依赖特定照片背景。</text></svg>