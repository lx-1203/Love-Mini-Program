name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

# ============================================================
# CI 完整门禁（Task 19 + Task 23 + Task 24 + P1.16 容器与部署加固 + Task 53 CI/CD 完善）
# 修复 REAUDIT-REPORT-100+.md 第 3.1 节编号 8 与第 3.5 节编号 105：
# - 补齐 Admin typecheck / Java compile / OpenAPI lint / E2E 等关键门禁
# - e2e 依赖所有前置 job 通过后才执行
# - Task 24：新增 security-scan job（Trivy 漏洞扫描），位于 api-test 通过后、e2e 之前
# - Task 19：Maven 命令统一加 -B（batch mode）避免交互式阻塞；为每个 job 配置 timeout-minutes
#   （client-test 30min、api-test 60min、e2e 45min、其他默认 30min）
# - P1.16（2026-07-28）：新增 phase01-verify job，运行 `npm run verify:phase01`
#   作为最终集成门禁，覆盖 9 项关键检查：mvn compile / mvn test /
#   admin typecheck / admin build / client typecheck / client build:mp-weixin /
#   test:structure / lint:openapi / verify:phase01。
# - Task 53（2026-07-28）：CI/CD 完善
#   1. 所有 pnpm install 改用 --frozen-lockfile（强制 lockfile 与 package.json 一致，
#      避免意外更新依赖；如需更新依赖请本地 pnpm install 后提交 lockfile）
#   2. 使用 actions/setup-node@v4 内置 cache: 'pnpm'（等价于显式 actions/cache@v4，
#      缓存 ~/.local/share/pnpm/store）
#   3. 使用 actions/setup-java@v4 内置 cache: 'maven'（等价于显式 actions/cache@v4，
#      缓存 ~/.m2/repository）
#   4. Trivy 安全扫描已存在（fs 扫描 apps/api 与 apps/admin），HIGH/CRITICAL 漏洞即失败
# - 9 个 job：lint-and-structure / client-typecheck-and-build /
#   client-test / admin-typecheck-and-build / api-compile /
#   api-test / security-scan / phase01-verify / e2e
# - 所有 job 默认 fail-fast：前序 job 失败时后续 job 不执行（通过 needs 依赖实现）
# - P3-D（2026-07-29）：部署加固
#   1. D.1 security-scan 新增 Trivy image 扫描：构建 campus-love-api/campus-love-admin
#      镜像（--target runtime 跳过 Dockerfile 内 trivy-scanner 阶段），扫描 HIGH/CRITICAL
#   2. D.2 security-scan 新增 cosign 镜像签名：使用 sigstore/cosign-installer@v3，
#      通过 COSIGN_PRIVATE_KEY / COSIGN_PASSWORD secrets 注入密钥；
#      仅在 secrets 配置时执行（PR 场景跳过避免无密钥报错）
# ============================================================

jobs:
  # ----------------------------------------------------------------
  # Job 1: 根目录 OpenAPI lint + 项目结构测试
  # ----------------------------------------------------------------
  lint-and-structure:
    name: Lint & Structure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenAPI lint
        run: npm run lint:openapi

      - name: Run Spectral lint
        run: npm run lint:openapi:spectral

      - name: Run structure tests
        run: npm run test:structure

  # ----------------------------------------------------------------
  # Job 2: 客户端类型检查 + H5 / mp-weixin 构建
  # ----------------------------------------------------------------
  client-typecheck-and-build:
    name: Client Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Client typecheck
        run: pnpm --filter @campus-love/client run typecheck

      - name: Client build (H5)
        run: pnpm --filter @campus-love/client run build:h5

      - name: Client build (mp-weixin)
        run: pnpm --filter @campus-love/client run build:mp-weixin

  # ----------------------------------------------------------------
  # Job 3: 客户端单元测试
  # ----------------------------------------------------------------
  client-test:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run client unit tests
        run: pnpm --filter @campus-love/client run test:unit

  # ----------------------------------------------------------------
  # Job 4: 管理后台类型检查 + 构建
  # ----------------------------------------------------------------
  admin-typecheck-and-build:
    name: Admin Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Admin typecheck
        run: pnpm --filter @campus-love/admin run typecheck

      - name: Admin build
        run: pnpm --filter @campus-love/admin run build

  # ----------------------------------------------------------------
  # Job 5: Java 后端编译
  # ----------------------------------------------------------------
  api-compile:
    name: API Compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven compile
        run: mvn -B -f apps/api/pom.xml compile

  # ----------------------------------------------------------------
  # Job 6: Java 后端单元测试（依赖 api-compile）
  # ----------------------------------------------------------------
  api-test:
    name: API Unit Tests
    runs-on: ubuntu-latest
    needs: api-compile
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven test
        run: mvn -B -f apps/api/pom.xml test

  # ----------------------------------------------------------------
  # Job 7: Trivy 安全扫描（Task 24 + P3-D.1/D.2）
  # 依赖 api-test 与 admin-typecheck-and-build 通过后执行
  # 扫描策略：
  #   1. fs 扫描：扫描 apps/api 与 apps/admin 仓库源码（Task 24）
  #   2. image 扫描：构建 Docker 镜像后扫描最终 runtime 镜像（P3-D.1）
  #   3. cosign 签名：对镜像进行签名，支持部署端验证（P3-D.2）
  # HIGH/CRITICAL 漏洞即失败
  # ----------------------------------------------------------------
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs:
      - api-test
      - admin-typecheck-and-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---------- 阶段 1：源码 fs 扫描（Task 24）----------
      - name: Trivy scan API (fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/api
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy scan Admin (fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/admin
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------- 阶段 2：构建 Docker 镜像（P3-D.1）----------
      # 使用 --target runtime 跳过 Dockerfile 中的 trivy-scanner 中间阶段
      # （该阶段会在构建期触发 fs 扫描，与 CI image 扫描重复）
      - name: Set image tag
        id: tag
        run: echo "TAG=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build API image
        run: |
          docker build \
            --target runtime \
            -t campus-love-api:${{ steps.tag.outputs.TAG }} \
            ./apps/api

      - name: Build Admin image
        run: |
          docker build \
            --target runtime \
            -t campus-love-admin:${{ steps.tag.outputs.TAG }} \
            ./apps/admin

      # ---------- 阶段 3：镜像漏洞扫描（P3-D.1）----------
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-love-api:${{ steps.tag.outputs.TAG }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy scan Admin image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-love-admin:${{ steps.tag.outputs.TAG }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      # ---------- 阶段 4：镜像签名（P3-D.2）----------
      # 仅当 COSIGN_PRIVATE_KEY secret 配置时执行（PR 场景跳过，避免无密钥报错）
      - name: Install cosign
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        uses: sigstore/cosign-installer@v3
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}

      - name: Sign images
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY campus-love-api:${{ steps.tag.outputs.TAG }}
          cosign sign --key env://COSIGN_PRIVATE_KEY campus-love-admin:${{ steps.tag.outputs.TAG }}

  # ----------------------------------------------------------------
  # Job 8: Phase 01 综合验证（P1.16 新增）
  # 运行 `npm run verify:phase01`，作为最终集成门禁，覆盖：
  #   1. mvn -f apps/api/pom.xml compile（通过 api:test 间接覆盖）
  #   2. mvn -f apps/api/pom.xml test
  #   3. npm --workspace apps/admin run typecheck（前置 job 已覆盖，本 job 不重复）
  #   4. npm --workspace apps/admin run build（前置 job 已覆盖，本 job 不重复）
  #   5. npm --workspace apps/client run typecheck
  #   6. npm --workspace apps/client run build:mp-weixin（通过 verify:client-builds 覆盖）
  #   7. npm run test:structure（通过 npm run test 覆盖）
  #   8. npm run lint:openapi
  #   9. npm run verify:phase01（本 job 主体）
  # 依赖 security-scan 通过后才执行；e2e 依赖本 job 通过后才执行
  # ----------------------------------------------------------------
  phase01-verify:
    name: Phase 01 Verify
    runs-on: ubuntu-latest
    needs:
      - security-scan
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify:phase01
        run: npm run verify:phase01

  # ----------------------------------------------------------------
  # Job 9: E2E 测试（依赖所有前置 job 通过，含安全扫描与 Phase 01 验证）
  # ----------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - lint-and-structure
      - client-typecheck-and-build
      - client-test
      - admin-typecheck-and-build
      - api-compile
      - api-test
      - security-scan
      - phase01-verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
