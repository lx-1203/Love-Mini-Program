name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # P3-D.2 + infra #46：security-scan 需要推送镜像到 GHCR（仅 push 事件）
  packages: write

# FIN-00866 / infra #51：并发控制——同一分支的新提交自动取消进行中的旧工作流
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# CI 完整门禁（Task 19 + Task 23 + Task 24 + P1.16 容器与部署加固 + Task 53 CI/CD 完善）
# 修复 REAUDIT-REPORT-100+.md 第 3.1 节编号 8 与第 3.5 节编号 105：
# - 补齐 Admin typecheck / Java compile / OpenAPI lint / E2E 等关键门禁
# - e2e 依赖所有前置 job 通过后才执行
# - Task 24：新增 security-scan job（Trivy 漏洞扫描），位于 api-test 通过后、e2e 之前
# - Task 19：Maven 命令统一加 -B（batch mode）避免交互式阻塞；为每个 job 配置 timeout-minutes
# - P1.16（2026-07-28）：新增 phase01-verify job，运行 `npm run verify:phase01`
#   作为最终集成门禁
# - Task 53（2026-07-28）：CI/CD 完善
#   1. 所有 pnpm install 改用 --frozen-lockfile
#   2. 使用 actions/setup-node@v4 内置 cache: 'pnpm'
#   3. 使用 actions/setup-java@v4 内置 cache: 'maven'
#   4. Trivy 安全扫描（fs + image），HIGH/CRITICAL 漏洞即失败
# - P3-D（2026-07-29）：部署加固
#   1. D.1 security-scan 新增 Trivy image 扫描
#   2. D.2 security-scan 新增 cosign 镜像签名
# - Infra 加固（2026-08-05，infra #45-#51 / FIN-00277/00278/00866/00867）：
#   1. cosign 签名条件改用 secrets.COSIGN_PRIVATE_KEY != ''（原 env.COSIGN_PRIVATE_KEY
#      恒为 false，签名永不执行）
#   2. trivy-action 由 @master 固定为 @v0.23.0（禁止未 pin 的 master 引用）
#   3. 新增 gitleaks job：密钥扫描门禁（infra #48）
#   4. lint-and-structure 新增 pnpm audit --prod（infra #49）
#   5. security-scan 使用 docker/build-push-action：镜像推送至 GHCR（infra #46），
#      并启用 gha 构建缓存（infra #51）；PR 场景只构建不推送
#   6. 新增 concurrency 与 workflow_dispatch 触发（infra #50/#51）
#   7. e2e 显式指定 --config=tests/e2e/playwright.config.ts（FIN-00278：
#      根目录无 playwright.config，原命令实际无法运行），并缓存 Playwright 浏览器
#   8. Playwright 报告 artifact 设置 retention-days（FIN-00867）
# - 供应链推送闸（2026-10-05）：未配置 secrets.COSIGN_PRIVATE_KEY 且仓库变量
#   vars.ALLOW_UNSIGNED_IMAGES 未显式设为 true 时，security-scan 跳过 GHCR 推送
#   并在显式步骤 fail（原实现 cosign 未配密钥时镜像照推不签名，属供应链缺口）；
#   决策原因写明在 security-scan 的 job 名中
# ============================================================

jobs:
  # ----------------------------------------------------------------
  # Job 0: 密钥扫描（gitleaks，infra #48）
  # ----------------------------------------------------------------
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # 版本固定（禁止 latest）：gitleaks v8.18.4
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/repo \
            gitleaks/gitleaks:v8.18.4 detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --no-banner \
            --redact \
            --verbose

  # ----------------------------------------------------------------
  # Job 1: 根目录 OpenAPI lint + 项目结构测试 + 依赖审计
  # ----------------------------------------------------------------
  lint-and-structure:
    name: Lint & Structure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # infra #49：依赖漏洞门禁（生产依赖）
      # S0-1b（2026-10-30）拆成两条，替代原先的 `pnpm audit --prod --audit-level high`：
      # 那条命令在本仓当前必然红（uni-app alpha 锁 vue 3.4 + vue-i18n 9.x 无补丁版 ⇒ 4 条 high
      # 无法用 overrides 干净解决），而一条常年红的门等于没有门——它的红会淹没其它所有信号。
      # 处置方式不是 continue-on-error（那是拆门），而是：
      #   ① critical 一律硬失败；
      #   ② high 按 advisory id 逐条钉在 tools/audit-prod-baseline.json，新增即红、
      #      修掉不收缩基线也红（豁免清单只能变短）。
      - name: Audit dependencies (critical must be zero)
        run: pnpm audit --prod --audit-level critical

      - name: Audit high ratchet
        run: npm run test:audit-ratchet

      # R4-00517：ESLint 门禁（产品代码：admin/client 源码 + 工具脚本；
      # 0 errors 即失败；warning 不阻塞——历史 style 债另项清理）
      - name: Run ESLint (product code)
        run: npm run lint

      - name: Run OpenAPI lint
        run: npm run lint:openapi

      - name: Run Spectral lint
        run: npm run lint:openapi:spectral

      - name: Run root contract gates
        # 根级契约门全量执行（结构/部署/CI/终验汇总/R16 台账/E2E 路由单源/
        # 后台只读角色写门禁/绑定核查件只读性/门禁接线自证）。
        # 此前 CI 只跑 test:structure 一条，其余八条仅本地执行 —— 等于「建了没人跑」。
        run: npm run test:contracts

      # 资产覆盖门的**盘上轴**（verify-app-assets-coverage --source-only）自证（2026-10-27）。
      # 为什么 CI 只能跑它的 --selftest 而不是真读数：本轴的两个盘上根在 CI 检出树里是残缺的 ——
      # .gitignore 全局挡掉 *.png/*.jpg/*.jpeg/*.gif/*.webp，只白名单 apps/client/src/static 那一棵，
      # 所以 apps/api/uploads/app-assets 只有 495/1354 个件进了 git、static-local-backup 只有
      # 613/1496（本机 git ls-files 实测）。真读数在 CI 跑出来必然是「分母=929 盘上=156 缺件=773」，
      # 那是检出面的缺口而不是产品缺陷 —— 挂上去就是一条永远红的门（本仓口径：假红的门等于没有门）。
      # 所以 CI 这一发跑 --source-only --selftest：夹具自己造两棵盘上根（tmp/qa/fixtures/assetcov），
      # 不依赖仓内素材、不依赖后端，判的是"这条轴能不能红"；真读数由
      # ① apps/client/scripts/release-chain.mjs 的 --source-only 步（构建期必然经过，素材在全机的仓里）
      # ② scripts/qa/run-final-verify-v33.sh 的 g verify-app-assets-coverage-source（人跑的终验）两处出。
      - name: Asset coverage source-axis self-test (no backend needed)
        run: node scripts/qa/verify-app-assets-coverage.mjs --source-only --selftest

  # ----------------------------------------------------------------
  # Job 2: 客户端类型检查 + H5 / mp-weixin 构建
  # ----------------------------------------------------------------
  client-typecheck-and-build:
    name: Client Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Client typecheck
        run: pnpm --filter @campus-love/client run typecheck

      - name: Client build (H5)
        run: pnpm --filter @campus-love/client run build:h5

      - name: Client build (mp-weixin)
        run: pnpm --filter @campus-love/client run build:mp-weixin

  # ----------------------------------------------------------------
  # Job 3: 客户端单元测试
  # ----------------------------------------------------------------
  client-test:
    name: Client Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run client unit tests with coverage thresholds
        run: pnpm --filter @campus-love/client run test:coverage

  # ----------------------------------------------------------------
  # Job 4: 管理后台类型检查 + 构建
  # ----------------------------------------------------------------
  admin-typecheck-and-build:
    name: Admin Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Admin typecheck
        run: pnpm --filter @campus-love/admin run typecheck

      - name: Admin unit tests
        run: pnpm --filter @campus-love/admin run test:unit

      - name: Admin build
        run: pnpm --filter @campus-love/admin run build

  # ----------------------------------------------------------------
  # Job 5: Java 后端编译
  # ----------------------------------------------------------------
  api-compile:
    name: API Compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven compile
        run: mvn -B -f apps/api/pom.xml compile

  # ----------------------------------------------------------------
  # Job 6: Java 后端单元测试（依赖 api-compile）
  # ----------------------------------------------------------------
  api-test:
    name: API Unit Tests
    runs-on: ubuntu-latest
    needs: api-compile
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven verify (tests + JaCoCo check)
        run: mvn -B -f apps/api/pom.xml verify

  # ----------------------------------------------------------------
  # Job 6b: DB 集成测试（2026-10-31 新增，修两条「门存在但从不执行」）
  #
  # 背景一：FlywayMigrationRepeatableTest 靠 -Dflyway.repeatable.test 开关，
  #         而全仓库没有任何地方设置过它 —— api-test 的 Maven 汇总里那 4 个
  #         判点恒为 skipped（"看起来有覆盖，实际是空的"）。更糟的是它标着
  #         @ActiveProfiles("mock")，而 application-mock.yml 排除了
  #         FlywayAutoConfiguration 与 HibernateJpaAutoConfiguration：
  #         没有数据源、一行迁移都不跑，打开开关也必然红。于是「迁移链能否
  #         从零建出一座库」这件事完全没有见证件。
  # 背景二：P0SecurityIntegrationTest 的 real profile 鉴权链原本是永久 @Disabled
  #         的空壳（三个方法体全是注释掉的断言），改为按属性启用后，
  #         若 CI 不设开关同样一秒钟都不跑。
  #
  # 本 job 提供 MySQL + Redis：先建一座【空 schema】并用 flyway-maven-plugin
  # 从零 migrate，再让两个属性开关打开的真实测试跑在上面。
  # 空 schema 是这一步的意义所在：V2026.10.13.0001（circle_layer / admin_layer）
  # 编号低于引用它们的 V2026.10.14.0005，在已建好表的老库上会被 Flyway 报
  # Ignored（out-of-order 默认关闭），判点会被历史遗留状态蒙过去；只有空库
  # 才能证明「新环境按迁移链建库」真的成立。
  #
  # tests/ci-contract.spec.mjs 校验：本 job 存在、两个属性确实被设置、
  # @Disabled 在 apps/api/src/test 里恒为 0。
  # ----------------------------------------------------------------
  db-integration:
    name: DB Integration (fresh-schema migrations + real-profile auth chain)
    runs-on: ubuntu-latest
    needs: api-compile
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0.39
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: campus_love
          MYSQL_USER: campus
          MYSQL_PASSWORD: ci-db-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    env:
      SPRING_PROFILES_ACTIVE: real
      DB_URL: jdbc:mysql://127.0.0.1:3306/campus_love?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: campus
      DB_PASSWORD: ci-db-pass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      JWT_SECRET: ci-only-jwt-secret-please-change-0123456789abcdef
      APP_AES_SECRET: ci-only-aes-secret-please-change-0123456789abcdef
      APP_GUEST_LOGIN_ENABLED: 'true'
      APP_ADMIN_STRICT_PASSWORD: 'false'
      APP_ADMIN_DB_PASSWORD_AUDIT: warn
      DEMO_SEED: 'false'
      APP_EVENTS_ENABLED: 'false'
      # real profile 下这两项没有默认值（application-real.yml:114/133 刻意去掉占位默认，
      # 漏配就拒绝启动）。2026-10-31 起凡是 boot real 上下文的 job 都必须显式提供，
      # 否则报 "Could not resolve placeholder 'ADMIN_OPENID'"，上下文起不来。
      # ADMIN_INITIAL_PASSWORD_HASH 对应明文写在下一行注释里：它是本轮临时生成、
      # 只给 CI 用的抛弃型口令（ci-only-throwaway-admin-password），不是任何环境的凭据；
      # 没有任何测试用口令登录，它存在的唯一目的是让 ${ADMIN_INITIAL_PASSWORD_HASH} 可解析。
      ADMIN_OPENID: ci-only-admin-openid
      ADMIN_INITIAL_PASSWORD_HASH: $2b$10$qyplgEcmpDLIcvuO9C3jOu46hDANxtAxaD5DTrfjbhgAmHl7h8yrS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create an EMPTY schema and hand it to the app user
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -pci-root-pass -e \
            "CREATE DATABASE IF NOT EXISTS campus_love_fresh CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
             GRANT ALL PRIVILEGES ON campus_love_fresh.* TO 'campus'@'%';
             FLUSH PRIVILEGES;"

      - name: Flyway migrate from zero (the chain alone must build a database)
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/campus_love_fresh?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        run: mvn -B -f apps/api/pom.xml flyway:migrate

      - name: Flyway repeatability + layer-table assertions
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/campus_love_fresh?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        run: >-
          mvn -B -f apps/api/pom.xml test
          -Dtest=FlywayMigrationRepeatableTest
          -Dspring-boot.repackage.skip=true
          -Dflyway.repeatable.test=true

      - name: Real-profile auth chain (401 / 403 / revoked token)
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/campus_love_fresh?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        run: >-
          mvn -B -f apps/api/pom.xml test
          -Dtest=RealProfileAuthChainIntegrationTest
          -Dspring-boot.repackage.skip=true
          -Dreal.it.test=true

  # ----------------------------------------------------------------
  # Job 7: Trivy 安全扫描 + GHCR 镜像推送 + cosign 签名
  # 依赖 api-test 与 admin-typecheck-and-build 通过后执行
  # 扫描策略：
  #   1. fs 扫描：扫描 apps/api 与 apps/admin 仓库源码（Task 24）
  #   2. image 扫描：构建 Docker 镜像后扫描最终 runtime 镜像（P3-D.1）
  #   3. 镜像推送：push 事件（main/develop/tag）推送到 GHCR，PR 仅构建（infra #46）
  #   4. cosign 签名：仅当 secrets.COSIGN_PRIVATE_KEY 配置时执行（infra #45）
  # HIGH/CRITICAL 漏洞即失败
  #
  # 2026-10-05 供应链推送闸（修复「cosign 未配密钥时镜像照推不签名」）：
  #   - 未配置 secrets.COSIGN_PRIVATE_KEY 且仓库变量 vars.ALLOW_UNSIGNED_IMAGES
  #     未显式设为 true 时：跳过 GHCR 推送并在显式步骤 fail（原因写在下方 job 名里）；
  #   - 配置了 COSIGN_PRIVATE_KEY → 推送并签名；
  #   - 未配置密钥但显式 ALLOW_UNSIGNED_IMAGES=true → 允许未签名推送（显式决策留痕）。
  #   本 job 名即决策说明：默认不允许未签名镜像出仓。
  # ----------------------------------------------------------------
  security-scan:
    name: Trivy Security Scan（默认拒绝未签名镜像出仓：未配 COSIGN_PRIVATE_KEY 时需显式设置 vars.ALLOW_UNSIGNED_IMAGES=true 才推送，否则本 job fail）
    runs-on: ubuntu-latest
    needs:
      - api-test
      - admin-typecheck-and-build
    timeout-minutes: 30
    # 镜像命名单一来源：本地 compose 默认 campus-love，CI 默认 ghcr.io/<repo>。
    # 仓库变量 IMAGE_PREFIX 可覆盖两者，避免再出现 ghcr.io/<repo>/api 与 campus-love-api 第三套写法。
    env:
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || format('ghcr.io/{0}', github.repository) }}
    steps:
      - uses: actions/checkout@v4

      # ---------- 阶段 0：镜像推送闸（2026-10-05）----------
      # 判定本次运行属哪一档：sign（配了密钥，推送并签名）/
      # allow-unsigned（未配密钥但 vars.ALLOW_UNSIGNED_IMAGES=true，显式接受未签名推送）/
      # refuse（未配密钥且未显式放行 → 下方步骤 fail，不推送）。
      # 注：密钥判断必须在 step 内经 env 中转——secrets 上下文不能直接用于 if 表达式。
      - name: 镜像推送闸判定（cosign 密钥 / ALLOW_UNSIGNED_IMAGES 变量）
        id: push-gate
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_IMAGES }}
        run: |
          if [ -n "$COSIGN_KEY" ]; then
            echo "mode=sign" >> "$GITHUB_OUTPUT"
            echo "推送闸：已配置 COSIGN_PRIVATE_KEY，将推送并签名"
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "mode=allow-unsigned" >> "$GITHUB_OUTPUT"
            echo "推送闸：COSIGN_PRIVATE_KEY 未配置，但 vars.ALLOW_UNSIGNED_IMAGES=true（显式决策），允许未签名推送"
          else
            echo "mode=refuse" >> "$GITHUB_OUTPUT"
            echo "推送闸：COSIGN_PRIVATE_KEY 未配置且 ALLOW_UNSIGNED_IMAGES 未显式放行 → 拒绝推送"
          fi

      # 显式 fail 步骤（决策：fail 而非 warning，让「未签名镜像可否出仓」成为显式门禁；
      # 原因同时写在 job 名里，便于在 UI 上直接看到为什么挂）
      - name: 拒绝推送未签名镜像（COSIGN_PRIVATE_KEY 未配置 且 vars.ALLOW_UNSIGNED_IMAGES 未显式设为 true）
        if: ${{ steps.push-gate.outputs.mode == 'refuse' && github.event_name != 'pull_request' }}
        run: |
          echo "::error::按供应链安全策略拒绝推送未签名镜像到 GHCR。"
          echo "::error::原因：secrets.COSIGN_PRIVATE_KEY 未配置，且仓库变量 ALLOW_UNSIGNED_IMAGES 未显式设为 true。"
          echo "::error::处置二选一："
          echo "::error::  1) Settings → Secrets and variables → Actions → Secrets 新增 COSIGN_PRIVATE_KEY / COSIGN_PASSWORD，启用 cosign 签名后推送；"
          echo "::error::  2) Settings → Secrets and variables → Actions → Variables 新增 ALLOW_UNSIGNED_IMAGES=true，显式接受未签名推送（会留痕于本日志）。"
          echo "::error::PR 场景只构建不推送，不受本闸影响。"
          exit 1

      # ---------- 阶段 1：源码 fs 扫描（Task 24）----------
      # trivy-action 固定版本（infra #47 / FIN-00277）：禁止 @master
      - name: Trivy scan API (fs)
        uses: aquasecurity/trivy-action@v0.23.0
        with:
          scan-type: fs
          scan-ref: apps/api
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy scan Admin (fs)
        uses: aquasecurity/trivy-action@v0.23.0
        with:
          scan-type: fs
          scan-ref: apps/admin
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------- 阶段 2：构建 Docker 镜像（P3-D.1 + infra #46/#51）----------
      # 使用 --target runtime 跳过 Dockerfile 中的 trivy-scanner 中间阶段
      # push 仅发生在 push 事件（PR 无 GHCR 写权限，只构建验证）
      - name: Set image tag
        id: tag
        run: echo "TAG=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=raw,value=${{ steps.tag.outputs.TAG }}

      - name: Docker meta (Admin)
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/admin
          tags: |
            type=raw,value=${{ steps.tag.outputs.TAG }}

      - name: Log in to GHCR
        # 2026-10-05 推送闸：refuse 档不登录 GHCR（PR 场景本就不推送）
        if: github.event_name != 'pull_request' && steps.push-gate.outputs.mode != 'refuse'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: runtime
          tags: ${{ steps.meta-api.outputs.tags }}
          # 2026-10-05 推送闸：refuse 档只构建不推送（配合上方显式 fail 步骤）
          push: ${{ github.event_name != 'pull_request' && steps.push-gate.outputs.mode != 'refuse' }}
          # PR/refuse 不推送时必须载入本地 daemon，后续 Trivy 才有真实镜像可扫；
          # 修复原链「PR push=false 且未 load，却按 GHCR 引用扫描」的断点。
          load: ${{ github.event_name == 'pull_request' || steps.push-gate.outputs.mode == 'refuse' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin image
        id: build-admin
        uses: docker/build-push-action@v6
        with:
          # Admin Dockerfile 需要仓库根的 pnpm-workspace.yaml/pnpm-lock.yaml，
          # 因此 context 必须是仓库根（与 docker-compose.yml 的 admin 服务一致）；
          # 指到 ./apps/admin 会让 COPY pnpm-workspace.yaml 直接失败。
          context: .
          file: apps/admin/Dockerfile
          target: runtime
          tags: ${{ steps.meta-admin.outputs.tags }}
          # 2026-10-05 推送闸：refuse 档只构建不推送（配合上方显式 fail 步骤）
          push: ${{ github.event_name != 'pull_request' && steps.push-gate.outputs.mode != 'refuse' }}
          load: ${{ github.event_name == 'pull_request' || steps.push-gate.outputs.mode == 'refuse' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 阶段 3：镜像漏洞扫描（P3-D.1）----------
      # GitHub Actions 表达式不支持 JS 的 .split()：metadata 固定只产出一个 raw tag。
      # PR/refuse 档扫刚 load 的本地镜像；push 档扫刚推送的 digest，两个目标都真实存在。
      - name: Trivy scan API image (local build)
        if: ${{ github.event_name == 'pull_request' || steps.push-gate.outputs.mode == 'refuse' }}
        uses: aquasecurity/trivy-action@v0.23.0
        with:
          image-ref: ${{ steps.meta-api.outputs.tags }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy scan Admin image (local build)
        if: ${{ github.event_name == 'pull_request' || steps.push-gate.outputs.mode == 'refuse' }}
        uses: aquasecurity/trivy-action@v0.23.0
        with:
          image-ref: ${{ steps.meta-admin.outputs.tags }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy scan API image (pushed digest)
        if: ${{ github.event_name != 'pull_request' && steps.push-gate.outputs.mode != 'refuse' }}
        uses: aquasecurity/trivy-action@v0.23.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/api@${{ steps.build-api.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy scan Admin image (pushed digest)
        if: ${{ github.event_name != 'pull_request' && steps.push-gate.outputs.mode != 'refuse' }}
        uses: aquasecurity/trivy-action@v0.23.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/admin@${{ steps.build-admin.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      # ---------- 阶段 4：镜像签名（P3-D.2，infra #45）----------
      # 修复：原 if 条件 env.COSIGN_PRIVATE_KEY 在 step 级不存在（仅 env 块内有效），
      # 恒为 false 导致签名永不执行；改为直接判断 secrets 是否配置
      - name: Install cosign
        if: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        uses: sigstore/cosign-installer@v3

      # R4-02098：metadata-action 的 outputs.tags 为逗号/换行分隔的多 tag 串，
      # cosign sign 只接受单镜像引用——逐 tag 拆分后分别签名，
      # 避免将整串误作单个镜像引用导致签名必失败
      - name: Sign images
        if: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          API_TAGS: ${{ steps.meta-api.outputs.tags }}
          ADMIN_TAGS: ${{ steps.meta-admin.outputs.tags }}
        run: |
          for tag in ${API_TAGS//,/ } ${ADMIN_TAGS//,/ }; do
            [ -z "$tag" ] && continue
            cosign sign --key env://COSIGN_PRIVATE_KEY "$tag"
          done

  # ----------------------------------------------------------------
  # Job 8: Phase 01 综合验证（P1.16 新增）
  # 运行 `npm run verify:phase01`，作为最终集成门禁
  # ----------------------------------------------------------------
  phase01-verify:
    name: Phase 01 Verify
    runs-on: ubuntu-latest
    needs:
      - security-scan
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI 专用 release 占位：只验证 real 构建可编译，产物 shippable=no。
      # 真实发布域名/AppID 走独立的 release-gate（缺 secret 即失败），不在这里伪造 PASS。
      - name: Prepare CI-only release placeholder env (non-shippable)
        run: |
          printf 'VITE_API_BASE_URL=https://ci.invalid/api\n' > apps/client/.env.real.local
          echo "ENVCHECK_CI_PLACEHOLDER=1 shippable=no"

      - name: Run verify:phase01
        run: npm run verify:phase01

  # ----------------------------------------------------------------
  # Job 8b: Release Gate（真实发布输入门；手动/打 tag 触发）
  # PR CI 用 ci.invalid 占位只证明 real 构建可编译；本 job 反向要求真实
  # HTTPS 域名、WX_APPID、服务端微信凭据与管理员初始哈希，缺一即失败。
  # 它只做门禁，不代替上传/审核，也不把占位产物冒充成可发布。
  # ----------------------------------------------------------------
  release-gate:
    name: Release Gate (real domain/secrets; manual/tag)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require real release inputs and run env guard
        env:
          RELEASE_API_BASE_URL: ${{ secrets.RELEASE_API_BASE_URL }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          ADMIN_INITIAL_PASSWORD_HASH: ${{ secrets.ADMIN_INITIAL_PASSWORD_HASH }}
        run: |
          missing=0
          for name in RELEASE_API_BASE_URL WX_APPID WECHAT_APPID WECHAT_SECRET ADMIN_INITIAL_PASSWORD_HASH; do
            if [ -z "${!name}" ]; then
              echo "RELEASE_GATE=FAIL missing=$name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          printf 'VITE_API_BASE_URL=%s\n' "$RELEASE_API_BASE_URL" > apps/client/.env.real.local
          node scripts/verify-env-release.mjs
          echo "RELEASE_GATE=OK env-guard passed; upload/review still requires the real build and manual steps"

  # ----------------------------------------------------------------
  # Job 9: E2E 测试（依赖所有前置 job 通过，含安全扫描与 Phase 01 验证）
  # ----------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - gitleaks-scan
      - lint-and-structure
      - client-typecheck-and-build
      - client-test
      - admin-typecheck-and-build
      - api-compile
      - api-test
      - security-scan
      - phase01-verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # infra #51：缓存 Playwright 浏览器，避免每次安装
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # FIN-00278：根目录无 playwright.config，必须显式指定配置（tests/e2e/）
      - name: Run Playwright tests
        run: pnpm exec playwright test --config=tests/e2e/playwright.config.ts

      # FIN-00867：报告 artifact 设置保留期限
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7

  # ----------------------------------------------------------------
  # Job 10: 真实栈冒烟（2026-10-25）
  # mock E2E 不触达后端；本 job 用 MySQL+Redis+API real+H5 real 跑
  # 游客登录 → 村口列表 → 上传 PNG → 签名 URL → 无凭据取回原字节 → 401 对照。
  # 这条链路专门抓「状态码 200 但响应 0 字节」这类只断言状态码会漏的缺陷。
  # ----------------------------------------------------------------
  e2e-real:
    name: E2E Real Stack (guest → upload → signed media)
    runs-on: ubuntu-latest
    needs:
      - api-compile
      - client-typecheck-and-build
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0.39
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: campus_love
          MYSQL_USER: campus
          MYSQL_PASSWORD: ci-db-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    env:
      SPRING_PROFILES_ACTIVE: real
      DB_URL: jdbc:mysql://127.0.0.1:3306/campus_love?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: campus
      DB_PASSWORD: ci-db-pass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      JWT_SECRET: ci-only-jwt-secret-please-change-0123456789abcdef
      APP_AES_SECRET: ci-only-aes-secret-please-change-0123456789abcdef
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: http://127.0.0.1:5173,http://localhost:5173
      APP_GUEST_LOGIN_ENABLED: 'true'
      APP_ADMIN_STRICT_PASSWORD: 'false'
      APP_ADMIN_DB_PASSWORD_AUDIT: warn
      DEMO_SEED: 'false'
      APP_MEDIA_QUERY_TOKEN_STRICT: 'true'
      APP_EVENTS_ENABLED: 'false'
      # 2026-10-31：application-real.yml 去掉了 admin_openid / admin_password_hash 的
      # 占位默认值（漏配即拒绝启动，见 AdminOpenidValidator），凡 boot real 上下文的
      # job 必须显式提供这两项，否则本 job 会在 "Could not resolve placeholder
      # 'ADMIN_OPENID'" 上挂掉。口令是明文写在注释里的 CI 抛弃值，不是凭据：
      # ADMIN_INITIAL_PASSWORD_HASH = bcrypt("ci-only-throwaway-admin-password")，
      # 且 APP_ADMIN_STRICT_PASSWORD=false / APP_ADMIN_DB_PASSWORD_AUDIT=warn
      # 已经让本 job 不做口令强度裁决，只是为了让占位符可解析。
      ADMIN_OPENID: ci-only-admin-openid
      ADMIN_INITIAL_PASSWORD_HASH: $2b$10$qyplgEcmpDLIcvuO9C3jOu46hDANxtAxaD5DTrfjbhgAmHl7h8yrS
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API (real profile)
        run: |
          nohup mvn -B -f apps/api/pom.xml spring-boot:run > api-real.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then
              echo "API_UP=OK"
              exit 0
            fi
            sleep 2
          done
          echo "API_UP=FAIL"
          tail -150 api-real.log
          exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start H5 real dev server
        run: |
          nohup pnpm --filter @campus-love/client run dev:h5:real > h5-real.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:5173 >/dev/null; then
              echo "H5_UP=OK"
              exit 0
            fi
            sleep 2
          done
          echo "H5_UP=FAIL"
          tail -150 h5-real.log
          exit 1

      - name: Run real-stack smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_BASE_URL: http://127.0.0.1:8080/api
          E2E_API_MODE: real
        run: pnpm exec playwright test --config=tests/e2e/playwright.config.ts real-stack-smoke.spec.ts

      - name: Upload real-stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-logs
          path: |
            api-real.log
            h5-real.log
            tests/e2e/report
          retention-days: 7
