# ============================================================
# Alertmanager 告警路由配置（Task 8.2.1）
# ============================================================
# 职责：
#   1. 接收 Prometheus 推送的告警
#   2. 按严重级 / 服务分组、去重、抑制
#   3. 路由到不同通知渠道（邮件 / 钉钉 / 飞书）
#
# 通知策略：
#   - critical：立即通知，1 小时重复提醒
#   - warning：聚合 5 分钟后通知，4 小时重复
#   - info：仅归档，不通知
# ============================================================
#
# ⚠️ 变量注入说明（infra #17）：
#   prom/alertmanager 官方镜像不含 envsubst，纯 YAML 不支持 ${VAR} 展开。
#   因此本文件使用「真实默认值 + 部署时替换」策略：
#   - 下方所有 SMTP / Webhook 地址均为占位默认值（指向 example.com / localhost，
#     仅保证配置语法有效，不会投递到真实渠道）
#   - 部署时必须按下表将对应值替换为真实地址，并将变量同步维护到根目录 .env.example
#     的「11. 告警通知配置」小节：
#       SMTP_HOST / SMTP_FROM / SMTP_USER / SMTP_PASSWORD  →  邮件 SMTP
#       CRITICAL_EMAIL                                     →  critical 收件人
#       DINGTALK_CRITICAL_WEBHOOK                          →  钉钉机器人
#       FEISHU_WARNING_WEBHOOK                             →  飞书机器人
#       DEFAULT_WEBHOOK_URL                                →  默认归档 webhook
#   未配置渠道时：critical 邮件发往 example.com 会失败并产生错误日志，
#   warning 走 webhook 失败重试；info 级别直接丢弃（见 null-pager）。
# ============================================================

global:
  # 发件人 SMTP 配置（邮件通知）：部署时替换为真实 SMTP 服务器与账号
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alert@example.com'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: true
  # 告警去重窗口：相同告警在该时间内只发一次
  resolve_timeout: 5m

# ---------- 告警模板 ----------
# infra R2-00380：移除 templates 引用。docker/alertmanager 无 templates 目录且 compose 未挂载，
# 原配置指向不存在的 /etc/alertmanager/templates/*.tmpl，自定义模板不生效。
# critical-email 的 html 使用 Alertmanager 内置 email.default.html 模板兜底，功能不受影响。

# ---------- 路由规则 ----------
route:
  # 顶层分组：按 alertname 与 service 分组，避免同类告警刷屏
  group_by: ['alertname', 'service', 'severity']
  # 分组等待：首次告警后等 30s，凑齐同组其他告警再发
  group_wait: 30s
  # 分组间隔：同一组后续告警的发送间隔
  group_interval: 5m
  # 重复间隔：相同告警再次发送的最小间隔
  repeat_interval: 4h
  # 默认接收者（infra R2-00381）：原为 default-webhook 指向容器内不存在的
  # http://localhost:9999，未配置渠道时所有告警反复投递失败。
  # 现默认接 null-pager 静默丢弃；部署配置真实 DEFAULT_WEBHOOK_URL 后改回 default-webhook。
  receiver: null-pager
  routes:
    # critical 级别：立即发送，1 小时重复
    - matchers:
        - severity = critical
      receiver: critical-email
      group_wait: 0s
      repeat_interval: 1h
      continue: true
    # warning 级别：聚合 5 分钟发送
    - matchers:
        - severity = warning
      receiver: warning-webhook
      group_wait: 30s
      repeat_interval: 4h
    # info 级别：仅归档，不通知
    - matchers:
        - severity = info
      receiver: null-pager

# ---------- 抑制规则 ----------
# 当高级别告警触发时，抑制低级别告警，避免噪音
inhibit_rules:
  # 服务下线时，抑制该服务的所有其他告警
  - source_matchers:
      - alertname = ApiDown
    target_matchers:
      - service = campuslove-api
    equal: ['service']
  # 主机磁盘满时，抑制该主机的其他磁盘相关告警
  - source_matchers:
      - alertname = HostDiskHigh
    target_matchers:
      - alertname =~ "Db.*|Jvm.*"
    equal: ['instance']

# ---------- 接收者定义 ----------
receivers:

  # 默认接收者：webhook（用于调试与归档）
  # 部署时替换 DEFAULT_WEBHOOK_URL 为真实归档接口
  - name: default-webhook
    webhook_configs:
      - url: 'http://localhost:9999/webhook'
        send_resolved: true
        max_alerts: 0

  # critical 级别：邮件 + 钉钉
  - name: critical-email
    email_configs:
      # 部署时替换 CRITICAL_EMAIL 为真实收件人
      - to: 'oncall@example.com'
        subject: '[CRITICAL] {{ .CommonLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'
        send_resolved: true
    webhook_configs:
      # 钉钉机器人 webhook：部署时替换 DINGTALK_CRITICAL_WEBHOOK；
      # 未配置时指向本地无效地址（投递失败会重试并记录日志），不影响配置加载
      - url: 'http://localhost:9999/dingtalk-unconfigured'
        send_resolved: true
        max_alerts: 0

  # warning 级别：飞书群机器人
  - name: warning-webhook
    webhook_configs:
      # 部署时替换 FEISHU_WARNING_WEBHOOK；
      # 未配置时指向本地无效地址（投递失败会重试并记录日志），不影响配置加载
      - url: 'http://localhost:9999/feishu-unconfigured'
        send_resolved: true
        max_alerts: 0

  # info 级别：丢弃（FIN-01333：无任何通知配置的 receiver 自动丢弃，
  # 不再向 localhost 无效 webhook 发送请求）
  - name: null-pager
