# ============================================================
# Grafana 数据源自动注入（Task 8.2.2）
# ============================================================
# 启动时自动加载以下数据源，无需手动在 UI 配置
# ============================================================

apiVersion: 1

datasources:

  # ---------- Prometheus 主数据源 ----------
  - name: Prometheus
    # infra R2-00003:显式固定 uid,与仪表板 JSON 中 "datasource.uid": "Prometheus" 绑定
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 30s

  # ---------- Alertmanager ----------
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
