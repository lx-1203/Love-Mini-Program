# ============================================================
# Client H5 预览 nginx 配置（Task 8.1.3）
# ============================================================
# 用于 docker-compose 中 client 服务的 H5 静态托管 + API 反代
#
# 2026-08-05 Infra 加固（infra #15/#19）：
#   - proxy_pass 上游固定为 api:8080（compose 网络内服务名，同一 app-net 网络）；
#     infra R2-00376：原注释写“同一 campus-net 网络”过时（网络已拆分为 data-net/app-net）
#     官方 nginx 镜像不执行 envsubst，${API_UPSTREAM} 不会被替换，已移除
#   - /api/ 反代增加 limit_req 限流，防登录/接口爆破
# ============================================================

# 限流：/api 每 IP 5 r/s，突发 10；zone 定义在 http 上下文由 conf.d 加载前生效
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /api 反向代理到后端 API 服务（上游固定为 compose 网络内的 api 服务名）
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    server_tokens off;
    client_max_body_size 50m;
}
