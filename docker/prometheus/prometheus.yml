# ============================================================
# Prometheus 抓取配置（Task 8.2.1）
# ============================================================
# 全局抓取间隔与超时：15s 抓取间隔，10s 抓取超时
# 评估间隔：每 30s 评估一次告警规则（与告警评估对齐）
# ============================================================

global:
  scrape_interval: 15s          # 全局抓取间隔
  evaluation_interval: 30s      # 告警规则评估间隔
  scrape_timeout: 10s           # 单次抓取超时
  external_labels:
    cluster: campus-love
    environment: production

# ---------- 告警规则文件 ----------
rule_files:
  - /etc/prometheus/rules/*.yml

# ---------- Alertmanager 配置 ----------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# ---------- 抓取任务 ----------
scrape_configs:

  # ---------- Prometheus 自身 ----------
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # ---------- Spring Boot API（/actuator/prometheus）----------
  - job_name: campuslove-api
    metrics_path: /actuator/prometheus
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['api:8080']
        labels:
          service: campuslove-api
          application: campus-love-api
    # 健康检查失败时仍尝试抓取，便于通过指标观察下线状态
    honor_labels: true

  # ---------- node-exporter 主机指标 ----------
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node-exporter

  # ---------- MySQL exporter（可选，部署后启用）----------
  - job_name: mysql-exporter
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: mysql
    scrape_interval: 30s

  # ---------- Redis exporter（可选，部署后启用）----------
  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis
    scrape_interval: 30s

  # ---------- Blackbox 探针（外部可用性）----------
  # 用于监控第三方依赖（微信 API、Agnes AI）的可用性
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.weixin.qq.com/sns/jscode2session
          - https://api.agnes-ai.com/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
