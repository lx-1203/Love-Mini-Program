# ============================================================
# Prometheus 抓取配置（Task 8.2.1）
# ============================================================
# 全局抓取间隔与超时：15s 抓取间隔，10s 抓取超时（timeout < interval，FIN-01334）
# 评估间隔：每 30s 评估一次告警规则（与告警评估对齐）
#
# 2026-08-05 Infra 加固：
#   - external_labels（cluster / environment）移至 docker-compose 的
#     --web.external-labels 启动参数，通过环境变量注入（infra #44 / FIN-01329），
#     prometheus.yml 不再硬编码 environment: production
#   - 移除 mysql-exporter / redis-exporter / blackbox-http 抓取任务
#     （compose 未部署对应服务，target 永久 DOWN 产生无效告警，infra #25/#18）；
#     如需启用，请先部署对应 exporter 容器再恢复本配置
# ============================================================

global:
  scrape_interval: 15s          # 全局抓取间隔
  evaluation_interval: 30s      # 告警规则评估间隔
  scrape_timeout: 10s           # 单次抓取超时（小于 scrape_interval，保证不重叠）

# ---------- 告警规则文件 ----------
rule_files:
  - /etc/prometheus/rules/*.yml

# ---------- Alertmanager 配置 ----------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# ---------- 抓取任务 ----------
scrape_configs:

  # ---------- Prometheus 自身 ----------
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # ---------- Spring Boot API（/actuator/prometheus）----------
  - job_name: campuslove-api
    metrics_path: /actuator/prometheus
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['api:8080']
        labels:
          service: campuslove-api
          application: campus-love-api
    # infra R2-00382：移除 honor_labels: true（仅对服务发现/relabel 场景有意义，
    # 静态 target 上无效果，属冗余配置）

  # ---------- node-exporter 主机指标 ----------
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node-exporter
