<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bodyGrad5" x1="60" y1="20" x2="60" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#36C99A"/>
    </linearGradient>
    <linearGradient id="leafGrad5" x1="50" y1="10" x2="50" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88D8B0"/>
      <stop offset="100%" stop-color="#36C99A"/>
    </linearGradient>
  </defs>
  <!-- Left leaf -->
  <path d="M45 20c-8-2-14 6-10 15 2 5 8 7 13 5 0-8 2-15-3-20z" fill="url(#leafGrad5)"/>
  <!-- Right leaf -->
  <path d="M75 20c8-2 14 6 10 15-2 5-8 7-13 5 0-8-2-15 3-20z" fill="url(#leafGrad5)"/>
  <!-- Stem -->
  <rect x="58" y="25" width="4" height="12" rx="2" fill="#36C99A"/>
  <!-- Body -->
  <ellipse cx="60" cy="70" rx="38" ry="35" fill="url(#bodyGrad5)"/>
