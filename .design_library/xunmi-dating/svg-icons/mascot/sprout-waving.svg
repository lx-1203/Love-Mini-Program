  <ellipse cx="48" cy="55" rx="12" ry="8" fill="#fff" opacity="0.25"/>
  <!-- Eyes - happy -->
  <path d="M44 68c2-4 8-4 10 0" stroke="#2D3748" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="72" cy="68" r="4" fill="#2D3748"/>
  <circle cx="73.5" cy="66.5" r="1.5" fill="#fff"/>
  <!-- Cheeks -->
  <circle cx="38" cy="78" r="5" fill="#FFB6C1" opacity="0.6"/>
  <circle cx="80" cy="78" r="5" fill="#FFB6C1" opacity="0.6"/>
  <!-- Smile -->
  <path d="M52 80c2.5 5 13.5 5 16 0" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Waving hand -->
  <g transform="translate(92, 45)">
    <ellipse cx="8" cy="10" rx="6" ry="12" fill="#36C99A"/>
    <ellipse cx="2" cy="2" rx="4" ry="6" fill="#36C99A" transform="rotate(-30 2 2)"/>
    <ellipse cx="8" cy="0" rx="3.5" ry="5.5" fill="#36C99A"/>
    <ellipse cx="14" cy="2" rx="3.5" ry="5.5" fill="#36C99A" transform="rotate(25 14 2)"/>
  </g>
