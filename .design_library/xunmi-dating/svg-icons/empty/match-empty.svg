<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="emptyMatchBody" x1="100" y1="70" x2="100" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#36C99A"/>
    </linearGradient>
    <linearGradient id="emptyMatchLeaf" x1="88" y1="50" x2="88" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88D8B0"/>
      <stop offset="100%" stop-color="#36C99A"/>
    </linearGradient>
    <linearGradient id="bigHeart" x1="100" y1="30" x2="100" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="100%" stop-color="#FF6B81"/>
    </linearGradient>
  </defs>
  <!-- Big heart outline above -->
  <path d="M100 30s-20-12-28 2a18 18 0 0 0 6 28c8 6 22 12 22 12s14-6 22-12a18 18 0 0 0 6-28c-8-14-28-2-28-2z" fill="none" stroke="#FF6B81" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <!-- Mascot with heart -->
  <!-- Leaves -->
  <path d="M78 65c-5-1-8 3-5 8 1 2.5 4 3.5 7 2.5 0-4 .5-8-2-10.5z" fill="url(#emptyMatchLeaf)"/>
  <path d="M92 65c5-1 8 3 5 8-1 2.5-4 3.5-7 2.5 0-4-.5-8 2-10.5z" fill="url(#emptyMatchLeaf)"/>
  <rect x="83" y="68" width="4" height="6" rx="2" fill="#36C99A"/>
  <!-- Body -->
  <ellipse cx="85" cy="125" rx="32" ry="30" fill="url(#emptyMatchBody)"/>
  <ellipse cx="75" cy="112" rx="10" ry="6" fill="#fff" opacity="0.25"/>
  <!-- Eyes - hopeful -->
  <path d="M73 122c2-3 7-3 9 0" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M89 122c2-3 7-3 9 0" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="66" cy="132" r="5" fill="#FFB6C1" opacity="0.7"/>
  <circle cx="104" cy="132" r="5" fill="#FFB6C1" opacity="0.7"/>
  <!-- Small hopeful smile -->
  <path d="M77 135c2 3 9 3 11 0" stroke="#2D3748" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Small heart in hand -->
  <path d="M120 138c-3-2-6-1-6 3 0 3 4 5 6 6 2-1 6-3 6-6 0-4-3-5-6-3z" fill="url(#bigHeart)"/>
  <!-- Floating tiny hearts -->
  <path d="M35 70c-2-1.5-4-.5-4 2 0 2 3 4 4 5 1-1 4-3 4-5 0-2.5-2-3.5-4-2z" fill="#FFB6C1" opacity="0.5"/>
  <path d="M160 90c-1.5-1-3-.5-3 1.5 0 1.5 2 3 3 3.5 1-.5 3-2 3-3.5 0-2-1.5-2.5-3-1.5z" fill="#FFB6C1" opacity="0.5"/>
  <path d="M150 50c-1.5-1-3-.5-3 1.5 0 1.5 2 3 3 3.5 1-.5 3-2 3-3.5 0-2-1.5-2.5-3-1.5z" fill="#FFB6C1" opacity="0.4"/>
</svg>
