<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>寻觅 Xunmi · UI Kit Showcase</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="../../components.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    /* ===== Page Layer — UI Kit Showcase Layout ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--color-background);
      color: var(--color-foreground);
      -webkit-font-smoothing: antialiased;
    }

    .uikit-shell {
      width: 100%;
      max-width: 1184px;
      margin: 0 auto;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
      padding: var(--space-8) var(--space-6);
      min-height: 100vh;
    }
    .uikit-main, .uikit-toolbar { min-width: 0; }

    /* Showcase header */
    .showcase-header {
      text-align: center;
      margin-bottom: var(--space-2);
    }
    .showcase-brand {
      font-family: var(--font-display);
      font-size: var(--font-size-h2);
      font-weight: var(--font-weight-display);
      letter-spacing: -0.01em;
      color: var(--color-on-surface);
      margin-bottom: var(--space-2);
    }
    .showcase-tagline {
      font-size: var(--font-size-body);
      color: var(--color-muted-foreground);
      margin-bottom: var(--space-6);
    }

    /* Phone stage */
    .phone-stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: var(--space-8);
      flex-wrap: wrap;
      padding: var(--space-6) 0;
    }

    .phone-frame {
      width: 320px;
      height: 680px;
      background: #1a1a17;
      border-radius: 42px;
      padding: 10px;
      box-shadow: 0 24px 60px -16px rgba(31, 31, 26, 0.22);
      position: relative;
      flex-shrink: 0;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--color-background);
      border-radius: 34px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Notch */
    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #1a1a17;
      border-radius: 0 0 18px 18px;
      z-index: 100;
    }

    /* Status bar */
    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-5);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-on-surface);
      flex-shrink: 0;
    }
    .status-bar-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-bar-right svg { width: 16px; height: 16px; }

    /* Screen content area */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }
    .screen-content::-webkit-scrollbar { display: none; }

    /* Screen label */
    .screen-label {
      text-align: center;
      margin-top: var(--space-4);
      font-size: var(--font-size-caption);
      color: var(--color-muted-foreground);
    }

    /* Page header inside phone */
    .page-header {
      padding: var(--space-4) var(--space-5) var(--space-3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title {
      font-family: var(--font-heading);
      font-size: var(--font-size-h2);
      font-weight: var(--font-weight-h2);
      color: var(--color-on-surface);
      word-break: keep-all;
    }

    /* Search area */
    .search-area {
      padding: 0 var(--space-5) var(--space-4);
    }

    /* Section header */
    .section-header {
      padding: var(--space-2) var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title {
      font-size: var(--font-size-h4);
      font-weight: var(--font-weight-h4);
      color: var(--color-on-surface);
    }
    .section-link {
      font-size: var(--font-size-caption);
      color: var(--color-primary);
      cursor: pointer;
    }

    /* Story row */
    .story-row {
      display: flex;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-5) var(--space-4);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .story-row::-webkit-scrollbar { display: none; }
    .story-item {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
      width: 60px;
    }
    .story-item-name {
      font-size: 11px;
      color: var(--color-muted-foreground);
      max-width: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Feed / card list */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: 0 var(--space-5) var(--space-6);
    }

    /* Match card special */
    .match-card-wrap {
      padding: 0 var(--space-5) var(--space-4);
    }

    /* Chat list */
    .chat-list {
      display: flex;
      flex-direction: column;
    }
    .chat-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-5);
      cursor: pointer;
      transition: background var(--duration-fast) var(--easing-standard);
    }
    .chat-item:hover {
      background: var(--interactive-hover);
    }
    .chat-item.active {
      background: var(--color-primary-container);
    }
    .chat-content {
      flex: 1;
      min-width: 0;
    }
    .chat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .chat-name {
      font-size: var(--font-size-body);
      font-weight: 500;
      color: var(--color-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .chat-time {
      font-size: 11px;
      color: var(--color-muted-foreground);
      flex-shrink: 0;
      margin-left: var(--space-2);
    }
    .chat-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-preview {
      font-size: var(--font-size-caption);
      color: var(--color-muted-foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .chat-badge {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      background: var(--color-accent);
      color: var(--color-on-accent);
      font-size: 10px;
      font-weight: 600;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: var(--space-2);
    }

    /* Profile header */
    .profile-header {
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, var(--color-primary-container) 0%, transparent 100%);
    }
    .profile-name {
      font-size: var(--font-size-h3);
      font-weight: var(--font-weight-h3);
      color: var(--color-on-surface);
      margin-top: var(--space-3);
    }
    .profile-meta {
      font-size: var(--font-size-caption);
      color: var(--color-muted-foreground);
      margin-top: var(--space-1);
    }
    .profile-bio {
      font-size: var(--font-size-body);
      color: var(--color-on-surface-variant);
      text-align: center;
      margin-top: var(--space-3);
      line-height: var(--line-height-body);
    }

    /* Tag row */
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-3);
      justify-content: center;
    }

    /* Profile stats */
    .profile-stats {
      display: flex;
      justify-content: space-around;
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--color-outline-variant);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: var(--font-size-h4);
      font-weight: 600;
      color: var(--color-on-surface);
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: var(--font-size-caption);
      color: var(--color-muted-foreground);
      margin-top: 2px;
    }

    /* Action row */
    .action-row {
      display: flex;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
    }

    /* Info list */
    .info-list {
      padding: var(--space-2) var(--space-5) var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    /* Match percentage */
    .match-percent {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .match-percent .num {
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--color-primary);
      font-variant-numeric: tabular-nums;
    }

    /* Screen switcher tabs */
    .uikit-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
      flex-wrap: wrap;
    }
    .screen-tab {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      font-size: var(--font-size-body);
      font-weight: 500;
      cursor: pointer;
      color: var(--color-muted-foreground);
      background: transparent;
      border: none;
      transition: all var(--duration-fast) var(--easing-standard);
      font-family: var(--font-body);
    }
    .screen-tab:hover {
      background: var(--interactive-hover);
      color: var(--color-primary);
    }
    .screen-tab.active {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .uikit-shell { grid-template-columns: minmax(0, 1fr); }
      .phone-stage { flex-direction: column; align-items: center; }
    }
    @media (max-width: 640px) {
      .uikit-toolbar { flex-wrap: wrap; justify-content: center; }
      .uikit-shell { padding: var(--space-4); }
    }

    /* Scrollbar hide utility */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { scrollbar-width: none; }

    /* uikit required utility classes */
    .uikit-truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .uikit-nowrap { white-space: nowrap; flex-shrink: 0; }
    .uikit-responsive-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .uikit-table-wrap { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }
    .uikit-action-cell { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 160px; overflow: hidden; }
    .uikit-action { min-width: 0; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    @media (max-width: 640px) {
      .uikit-responsive-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ========== Status Bar ==========
    function StatusBar() {
      return (
        <div className="status-bar">
          <span>9:41</span>
          <div className="status-bar-right">
            <i data-lucide="signal" style={{width:14,height:14}}></i>
            <i data-lucide="wifi" style={{width:14,height:14}}></i>
            <i data-lucide="battery-full" style={{width:18,height:18}}></i>
          </div>
        </div>
      );
    }

    // ========== Screen 1: 发现 Discovery ==========
    function DiscoveryScreen() {
      const stories = [
        { name: '林小雨', online: true },
        { name: '陈思远', online: true },
        { name: '王梓萱', online: false },
        { name: '李浩然', online: true },
        { name: '赵欣怡', online: false },
        { name: '刘子墨', online: true },
      ];

      return (
        <div className="phone-screen">
          <div className="phone-notch"></div>
          <StatusBar />
          <div className="screen-content">
            {/* Page header */}
            <div className="page-header">
              <h1 className="page-title">发现</h1>
              <div style={{display:'flex',gap:'var(--space-2)'}}>
                <button className="btn btn-sm btn-ghost">
                  <span className="btn-icon"><i data-lucide="bell" style={{width:16,height:16}}></i></span>
                </button>
              </div>
            </div>

            {/* Search */}
            <div className="search-area" data-component="input">
              <div className="input-wrapper search">
                <span className="prefix-icon">
                  <i data-lucide="search" style={{width:20,height:20}}></i>
                </span>
                <input className="input-field" placeholder="搜索感兴趣的人或话题" />
              </div>
            </div>

            {/* Filter chips */}
            <div className="section-header">
              <h2 className="section-title">今日推荐</h2>
              <span className="section-link uikit-truncate">筛选</span>
            </div>
            <div className="story-row scrollbar-hide" data-component="chip">
              <span className="chip md primary">全部</span>
              <span className="chip md default">附近</span>
              <span className="chip md default">校园圈</span>
              <span className="chip md default">兴趣圈</span>
              <span className="chip md accent">新人</span>
            </div>

            {/* Story avatars */}
            <div className="story-row scrollbar-hide" data-component="avatar">
              {stories.map((s, i) => (
                <div className="story-item" key={i}>
                  <div className={'avatar-ring ' + (i < 3 ? 'gradient' : 'solid')}>
                    <div className="avatar avatar-md">
                      <div className="avatar-img" style={{background:'linear-gradient(135deg,var(--color-primary),var(--xunmi-primary-300))'}}>
                        {s.name[0]}
                      </div>
                      {s.online && <span className="avatar-status online"></span>}
                    </div>
                  </div>
                  <span className="story-item-name uikit-truncate">{s.name}</span>
                </div>
              ))}
            </div>

            {/* User card */}
            <div className="match-card-wrap" data-component="card">
              <div className="card card-user">
                <div className="card-header">
                  <div className="avatar avatar-lg" style={{background:'linear-gradient(135deg,var(--color-primary),var(--color-accent))'}}>
                    <div className="avatar-img">雨</div>
                    <span className="avatar-status online"></span>
                  </div>
                  <div className="user-info">
                    <div className="user-name uikit-truncate">陈雨桐 · 22</div>
                    <div className="user-meta">
                      <span>大三年级</span>
                      <span className="dot"></span>
                      <span className="match-percent"><span className="num">95%</span>匹配</span>
                    </div>
                  </div>
                </div>
                <div className="card-body">
                  <p className="bio">喜欢摄影和旅行，周末喜欢去咖啡馆看书。希望遇见同样热爱生活的你。</p>
                </div>
                <div className="card-footer">
                  <button className="btn-like" data-component="button">喜欢</button>
                  <button className="btn-pass">
                    <i data-lucide="x" style={{width:18,height:18}}></i>
                  </button>
                </div>
              </div>
            </div>

            {/* Interest chips row */}
            <div className="section-header">
              <h2 className="section-title">兴趣标签</h2>
              <span className="section-link uikit-truncate">更多</span>
            </div>
            <div style={{padding:'0 var(--space-5) var(--space-6)',display:'flex',flexWrap:'wrap',gap:'var(--space-2)'}} data-component="chip">
              <span className="chip md primary">摄影</span>
              <span className="chip md primary">旅行</span>
              <span className="chip md accent">音乐</span>
              <span className="chip md default">美食</span>
              <span className="chip md default">电影</span>
              <span className="chip md success"><span className="chip-icon"><span className="chip-dot"></span></span>在线</span>
            </div>
          </div>

          {/* Bottom nav */}
          <nav className="bottom-nav center-elevated" data-component="bottom-nav">
            <button className="bottom-nav-item active">
              <i data-lucide="compass" className="nav-icon"></i>
              <span className="nav-label">发现</span>
            </button>
            <div className="bottom-nav-item-wrap">
              <button className="bottom-nav-item">
                <i data-lucide="message-circle" className="nav-icon"></i>
                <span className="nav-label">消息</span>
                <span className="nav-badge">3</span>
              </button>
            </div>
            <div className="center-fab-wrap">
              <button className="center-fab">
                <i data-lucide="heart" style={{width:26,height:26,fill:'currentColor'}}></i>
              </button>
            </div>
            <div className="bottom-nav-item-wrap">
              <button className="bottom-nav-item">
                <i data-lucide="users" className="nav-icon"></i>
                <span className="nav-label">圈子</span>
              </button>
            </div>
            <button className="bottom-nav-item">
              <i data-lucide="user" className="nav-icon"></i>
              <span className="nav-label">我的</span>
            </button>
          </nav>
        </div>
      );
    }

    // ========== Screen 2: 消息 Messages ==========
    function MessagesScreen() {
      const chats = [
        { name: '林小雨', preview: '明天一起去看电影吗？', time: '刚刚', badge: 2, online: true, active: true },
        { name: '陈思远', preview: '好的，那周末见~', time: '10:23', badge: 0, online: true },
        { name: '王梓萱', preview: '[图片]', time: '昨天', badge: 5, online: false },
        { name: '李浩然', preview: '你好，我也喜欢摄影', time: '昨天', badge: 0, online: false },
        { name: '赵欣怡', preview: '那家咖啡馆真的很不错', time: '周一', badge: 1, online: true },
        { name: '刘子墨', preview: '谢谢你的推荐！', time: '周日', badge: 0, online: false },
      ];

      return (
        <div className="phone-screen">
          <div className="phone-notch"></div>
          <StatusBar />
          <div className="screen-content">
            {/* Page header */}
            <div className="page-header">
              <h1 className="page-title">消息</h1>
              <button className="btn btn-sm btn-ghost">
                <span className="btn-icon"><i data-lucide="plus" style={{width:16,height:16}}></i></span>
              </button>
            </div>

            {/* Search */}
            <div className="search-area" data-component="input">
              <div className="input-wrapper search">
                <span className="prefix-icon">
                  <i data-lucide="search" style={{width:20,height:20}}></i>
                </span>
                <input className="input-field" placeholder="搜索聊天记录" />
              </div>
            </div>

            {/* New matches */}
            <div className="section-header">
              <h2 className="section-title">新的匹配</h2>
              <span className="section-link uikit-truncate">全部</span>
            </div>
            <div className="story-row scrollbar-hide" data-component="avatar">
              {['张','刘','周','吴','郑','孙'].map((n, i) => (
                <div className="story-item" key={i}>
                  <div className="avatar-ring gradient">
                    <div className="avatar avatar-md">
                      <div className="avatar-img" style={{background:'linear-gradient(135deg,var(--xunmi-accent-300),var(--color-accent))'}}>
                        {n}
                      </div>
                    </div>
                  </div>
                  <span className="story-item-name uikit-truncate">
                    {['张梦琪','刘子豪','周诗涵','吴俊杰','郑雨欣','孙逸凡'][i]}
                  </span>
                </div>
              ))}
            </div>

            {/* Chat list */}
            <div className="section-header">
              <h2 className="section-title">聊天</h2>
              <span className="section-link uikit-truncate">去回复</span>
            </div>
            <div className="chat-list" data-component="card">
              {chats.map((c, i) => (
                <div className={'chat-item ' + (c.active ? 'active' : '')} key={i}>
                  <div className="avatar avatar-md" data-component="avatar">
                    <div className="avatar-img" style={{background:'linear-gradient(135deg,var(--color-primary),var(--xunmi-primary-300))'}}>
                      {c.name[0]}
                    </div>
                    {c.online && <span className="avatar-status online"></span>}
                  </div>
                  <div className="chat-content">
                    <div className="chat-top">
                      <span className="chat-name uikit-truncate">{c.name}</span>
                      <span className="chat-time uikit-nowrap">{c.time}</span>
                    </div>
                    <div className="chat-bottom">
                      <span className="chat-preview uikit-truncate">{c.preview}</span>
                      {c.badge > 0 && <span className="chat-badge">{c.badge}</span>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Bottom nav */}
          <nav className="bottom-nav center-elevated" data-component="bottom-nav">
            <button className="bottom-nav-item">
              <i data-lucide="compass" className="nav-icon"></i>
              <span className="nav-label">发现</span>
            </button>
            <div className="bottom-nav-item-wrap">
              <button className="bottom-nav-item active">
                <i data-lucide="message-circle" className="nav-icon"></i>
                <span className="nav-label">消息</span>
                <span className="nav-badge">3</span>
              </button>
            </div>
            <div className="center-fab-wrap">
              <button className="center-fab">
                <i data-lucide="heart" style={{width:26,height:26,fill:'currentColor'}}></i>
              </button>
            </div>
            <div className="bottom-nav-item-wrap">
              <button className="bottom-nav-item">

            <button className="bottom-nav-item">
              <i data-lucide="user" className="nav-icon"></i>

          </nav>
        </div>

    }

    // ========== Screen 3: 个人资料 Profile ==========

          <div className="phone-notch"></div>

              <h2 className="profile-name">苏晚晴</h2>
              <div className="profile-meta">22岁 · 大四年级 · 1.2km</div>

                <span className="stat-value">48</span>
                <span className="stat-label">匹配</span>

              <div className="stat-item">
                <span className="stat-value">92%</span>
                <span className="stat-label">回复率</span>
              </div>
            </div>

            {/* Action buttons */}
            <div className="action-row" data-component="button">
              <button className="btn btn-md btn-primary" style={{flex:1}}>
                <span className="btn-icon"><i data-lucide="message-circle" style={{width:16,height:16}}></i></span>
                打招呼
              </button>
              <button className="btn btn-md btn-outline">
                <i data-lucide="heart" style={{width:16,height:16,fill:'var(--color-accent)',color:'var(--color-accent)'}}></i>
              </button>
              <button className="btn btn-md btn-outline" disabled>
                <i data-lucide="more-horizontal" style={{width:16,height:16}}></i>
              </button>
            </div>

            {/* Info cards */}
            <div className="section-header">
              <h2 className="section-title">个人信息</h2>
            </div>
            <div className="info-list" data-component="card">
              <div className="card card-info">
                <div className="card-header">
                  <div className="info-icon">
                    <i data-lucide="graduation-cap" style={{width:20,height:20}}></i>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="info-title uikit-truncate">教育经历</div>
                    <div className="info-sub uikit-truncate">某大学 · 摄影专业</div>
                  </div>
                </div>
                <div className="card-body">
                  <p className="info-desc">曾获全国大学生摄影大赛银奖，作品多次在校园展览中展出。</p>
                </div>
                <div className="card-footer">
                  <span className="info-link uikit-truncate">查看详情</span>
                  <span className="info-count uikit-nowrap">已认证</span>
                </div>
              </div>

              <div className="card card-info">
                <div className="card-header">
                  <div className="info-icon" style={{background:'var(--color-accent-container)',color:'var(--color-on-accent-container)'}}>
                    <i data-lucide="heart" style={{width:20,height:20}}></i>

                    <span className="chip sm primary">旅行</span>
                    <span className="chip sm accent">音乐</span>
                    <span className="chip sm default">电影</span>
                    <span className="chip sm default">美食</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Bottom nav */}
          <nav className="bottom-nav center-elevated" data-component="bottom-nav">
            <button className="bottom-nav-item">
              <i data-lucide="compass" className="nav-icon"></i>
              <span className="nav-label">发现</span>

                <i data-lucide="heart" style={{width:26,height:26,fill:'currentColor'}}></i>

    // ========== Main App ==========
    function App() {
      const [activeScreen, setActiveScreen] = useState('discovery');

      useEffect(() => {
        if (window.lucide) {
          lucide.createIcons();
        }
      }, [activeScreen]);

      const screens = [
        { id: 'discovery', label: '发现页' },
        { id: 'messages', label: '消息页' },
        { id: 'profile', label: '资料页' },
      ];

      const renderScreen = () => {
        switch (activeScreen) {
          case 'discovery': return <DiscoveryScreen />;
          case 'messages': return <MessagesScreen />;
          case 'profile': return <ProfileScreen />;
          default: return <DiscoveryScreen />;
        }
      };

      return (
        <div className="uikit-shell" data-layout-guard="uikit-v1">
          <div className="uikit-main">
            <div className="showcase-header">
              <h1 className="showcase-brand">寻觅 · UI Kit</h1>
              <p className="showcase-tagline">遇见同频的人，从一次聊天开始一段故事</p>
            </div>

            <div className="uikit-toolbar">
              {screens.map(s => (
                <button
                  key={s.id}
                  className={'screen-tab ' + (activeScreen === s.id ? 'active' : '')}
                  onClick={() => setActiveScreen(s.id)}
                >
                  {s.label}
                </button>
              ))}
            </div>

            <div className="phone-stage">
              <div className="phone-frame">
                {renderScreen()}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Initialize lucide icons after first render
    setTimeout(() => {
      if (window.lucide) {
        lucide.createIcons();
      }
    }, 100);
  </script>
</body>
</html>
