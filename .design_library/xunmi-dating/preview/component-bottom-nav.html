<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>底部导航 - 寻觅设计系统</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface-container-low); font-family: var(--font-body); color: var(--color-on-surface); }
.specimen { display: flex; flex-direction: column; gap: var(--space-4); max-width: 420px; margin: 0 auto; }
.story { display: flex; flex-direction: column; gap: var(--space-2); }
.story-label { font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted-foreground); }
.stage { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-4) var(--space-6); box-shadow: var(--shadow-1); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 0; }

/* @component-css-start */
.bottom-nav { display: flex; align-items: center; justify-content: space-around; height: var(--bottom-nav-height); background: var(--color-surface); border-top: 1px solid var(--color-border); position: relative; }
.bottom-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: 1; height: 100%; cursor: pointer; color: var(--color-muted-foreground); transition: color var(--duration-fast) var(--easing-standard); background: none; border: none; padding: 0; }
.bottom-nav-item:hover { color: var(--color-primary); }
.bottom-nav-item.active { color: var(--color-primary); }
.bottom-nav-item .nav-icon { width: 22px; height: 22px; flex-shrink: 0; }
.bottom-nav-item .nav-label { font-size: 11px; font-weight: 500; white-space: nowrap; line-height: 1.2; }
.bottom-nav-item .nav-badge { position: absolute; top: 4px; right: calc(50% - 18px); min-width: 16px; height: 16px; padding: 0 4px; background: var(--color-accent); color: var(--color-on-accent); font-size: 10px; font-weight: 600; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.bottom-nav-item-wrap { position: relative; flex: 1; display: flex; justify-content: center; }
.bottom-nav.center-elevated { padding-top: 12px; }
.bottom-nav.center-elevated .center-fab-wrap { position: absolute; left: 50%; top: -20px; transform: translateX(-50%); }
.bottom-nav.center-elevated .center-fab { width: 56px; height: 56px; border-radius: var(--radius-full); background: linear-gradient(135deg, var(--color-primary), var(--xunmi-primary-400)); color: var(--color-on-primary); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-3); transition: transform var(--duration-fast) var(--easing-standard), box-shadow var(--duration-fast) var(--easing-standard); }
.bottom-nav.center-elevated .center-fab:hover { transform: scale(1.06); box-shadow: var(--shadow-4); }
.bottom-nav.center-elevated .center-fab svg { width: 26px; height: 26px; }
.bottom-nav.center-elevated .bottom-nav-item:nth-child(3) { opacity: 0; pointer-events: none; }
/* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="story" data-evidence-sample="5-tab-standard">
    <span class="story-label">标准五栏</span>
    <div class="stage">
      <nav class="bottom-nav">
        <button class="bottom-nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="nav-label">首页</span>
        </button>
        <button class="bottom-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          <span class="nav-label">发现</span>
        </button>
        <button class="bottom-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span class="nav-label">心动</span>
        </button>
        <div class="bottom-nav-item-wrap">
          <button class="bottom-nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            <span class="nav-label">消息</span>
            <span class="nav-badge">3</span>
          </button>
        </div>
        <button class="bottom-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="nav-label">我的</span>
        </button>
      </nav>
    </div>
  </div>

  <hr class="divider">

  <div class="story" data-evidence-sample="center-elevated">
    <span class="story-label">中间凸起主导航</span>
    <div class="stage">
      <nav class="bottom-nav center-elevated">
        <button class="bottom-nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="nav-label">首页</span>
        </button>
        <button class="bottom-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          <span class="nav-label">发现</span>
        </button>
        <button class="bottom-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span class="nav-label">心动</span>
        </button>
        <div class="center-fab-wrap">
          <button class="center-fab" aria-label="发布心动">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          </button>
        </div>
        <div class="bottom-nav-item-wrap">
          <button class="bottom-nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            <span class="nav-label">消息</span>
            <span class="nav-badge">3</span>
          </button>
        </div>
        <button class="bottom-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="nav-label">我的</span>
        </button>
      </nav>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
