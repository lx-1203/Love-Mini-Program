<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按钮 Button - 寻觅设计系统</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-body); color: var(--color-on-surface); font-size: var(--font-size-body); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-4) 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: none; cursor: pointer; font-family: var(--font-body); font-weight: 500; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; border-radius: var(--radius-full); transition: background .15s, border-color .15s, opacity .15s; flex-shrink: 0; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:disabled:active { transform: none; }

/* Sizes */
.btn-sm { height: var(--size-button-sm); padding: 0 var(--space-4); font-size: 14px; min-width: var(--size-button-sm); }
.btn-md { height: var(--size-button-md); padding: 0 var(--space-6); font-size: var(--font-size-body); min-width: var(--size-button-md); }
.btn-lg { height: var(--size-button-lg); padding: 0 var(--space-8); font-size: var(--font-size-lead); min-width: var(--size-button-lg); }

/* Primary — 薄荷绿 */
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }

/* Secondary — 中性灰 */
.btn-secondary { background: var(--color-secondary); color: var(--color-on-secondary-container); }
.btn-secondary:hover:not(:disabled) { background: var(--color-surface-container-high); }

/* Outline — 描边 */
.btn-outline { background: transparent; color: var(--color-on-surface); border: 1px solid var(--color-border); }
.btn-outline:hover:not(:disabled) { background: var(--interactive-hover); border-color: var(--color-primary); }

/* Ghost — 文字按钮 */
.btn-ghost { background: transparent; color: var(--color-primary); padding: 0 var(--space-2); }
.btn-ghost:hover:not(:disabled) { background: var(--interactive-hover); }

/* Danger/Heart — 心动粉 */
.btn-danger { background: var(--color-accent); color: var(--color-on-accent); }
.btn-danger:hover:not(:disabled) { background: var(--color-accent-hover); }

/* Icon slot */
.btn-icon { width: 1em; height: 1em; display: inline-flex; align-items: center; justify-content: center; }
/* @component-css-end */
</style>
</head>
<body>

<!-- Group 1: 按钮类型 -->
<div class="row">
  <span class="label">主按钮</span>
  <button class="btn btn-md btn-primary">开始匹配</button>
  <button class="btn btn-md btn-primary">
    <span class="btn-icon">♡</span>
    立即邂逅
  </button>
</div>

<div class="row">
  <span class="label">次按钮</span>
  <button class="btn btn-md btn-secondary">换一个</button>
  <button class="btn btn-md btn-secondary">稍后再说</button>
</div>

<div class="row">
  <span class="label">描边</span>
  <button class="btn btn-md btn-outline">查看详情</button>
  <button class="btn btn-md btn-outline">分享给好友</button>
</div>

<div class="row">
  <span class="label">文字</span>
  <button class="btn btn-md btn-ghost">跳过</button>
  <button class="btn btn-md btn-ghost">了解更多 →</button>
</div>

<div class="row">
  <span class="label">心动</span>
  <button class="btn btn-md btn-danger">
    <span class="btn-icon">♥</span>
    心动一下
  </button>
  <button class="btn btn-md btn-danger">我喜欢</button>
</div>

<hr class="divider">

<!-- Group 2: 尺寸与状态 -->
<div class="row">
  <span class="label">尺寸</span>
  <button class="btn btn-sm btn-primary">小号 36px</button>
  <button class="btn btn-md btn-primary">中号 44px</button>
  <button class="btn btn-lg btn-primary">大号 52px</button>
</div>

<div class="row">
  <span class="label">禁用态</span>
  <button class="btn btn-md btn-primary" disabled>不可点击</button>
  <button class="btn btn-md btn-outline" disabled>禁用描边</button>
  <button class="btn btn-md btn-ghost" disabled>禁用文字</button>
</div>

<div class="row">
  <span class="label">心动尺寸</span>
  <button class="btn btn-sm btn-danger">
    <span class="btn-icon">♥</span>
    喜欢
  </button>
  <button class="btn btn-md btn-danger">
    <span class="btn-icon">♥</span>
    心动一下
  </button>
  <button class="btn btn-lg btn-danger">
    <span class="btn-icon">♥</span>
    发起约会
  </button>
</div>

</body>
</html>
