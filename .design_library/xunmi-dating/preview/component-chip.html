<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签 Chip/Tag - 寻觅设计系统</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { font-size: 11px; font-weight: 500; color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.08em; min-width: 92px; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-4) 0; }

/* @component-css-start */
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border-radius: var(--radius-full); font-family: var(--font-body); font-size: var(--font-size-caption); font-weight: 400; line-height: 1; white-space: nowrap; cursor: pointer; transition: filter .15s; flex-shrink: 0; user-select: none; border: none; }
.chip.sm { height: 20px; padding: 0 var(--space-2); min-width: 20px; }
.chip.md { height: 24px; padding: 0 10px; min-width: 24px; }
.chip.primary { background: var(--color-primary-container); color: var(--color-on-primary-container); }
.chip.primary:hover { filter: brightness(1.08); }
.chip.accent { background: var(--color-accent-container); color: var(--color-on-accent-container); }
.chip.accent:hover { filter: brightness(1.08); }
.chip.success { background: var(--color-success); color: var(--color-on-primary); }
.chip.success:hover { filter: brightness(1.08); }
.chip.warning { background: var(--color-warning); color: var(--color-on-primary); }
.chip.warning:hover { filter: brightness(1.08); }
.chip.default { background: var(--color-surface-container-high); color: var(--color-on-surface); }
.chip.default:hover { filter: brightness(1.05); }
.chip.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
.chip-icon { width: 12px; height: 12px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
/* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">语义色调</span>
  <span class="chip md primary">旅行</span>
  <span class="chip md accent">热门</span>
  <span class="chip md success"><span class="chip-icon"><span class="chip-dot"></span></span>在线</span>
  <span class="chip md warning">新用户</span>
  <span class="chip md default">500m</span>
</div>

<hr class="divider">

<div class="row">
  <span class="label">尺寸与状态</span>
  <span class="chip sm primary">小号</span>
  <span class="chip md primary">中号</span>
  <span class="chip md primary disabled">已禁用</span>
</div>

</body>
</html>
