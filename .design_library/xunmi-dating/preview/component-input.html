<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>输入框 Input - 寻觅设计系统</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-body); font-size: var(--font-size-body); color: var(--color-on-surface); }
.specimen { max-width: 100%; }
.stage { display: flex; flex-direction: column; gap: var(--space-4); }
.story { display: flex; flex-direction: column; gap: var(--space-2); }
.story-label { font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted-foreground); }
.rail { display: flex; flex-direction: column; gap: var(--space-3); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
.input-row { display: flex; flex-direction: column; gap: var(--space-1); }
.input-label { font-size: var(--font-size-caption); color: var(--color-muted-foreground); }

/* @component-css-start */
.input-wrapper { position: relative; display: flex; align-items: center; width: 100%; height: var(--size-input-height); padding: 0 var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color var(--duration-fast) var(--easing-standard); box-sizing: border-box; }
.input-wrapper:hover { border-color: var(--color-muted-foreground); }
.input-wrapper:focus-within { border-color: var(--color-primary); }
.input-wrapper .prefix-icon { flex-shrink: 0; width: var(--size-icon-md); height: var(--size-icon-md); color: var(--color-muted-foreground); margin-right: var(--space-2); display: flex; align-items: center; justify-content: center; }
.input-wrapper .suffix-icon { flex-shrink: 0; width: var(--size-icon-md); height: var(--size-icon-md); color: var(--color-muted-foreground); margin-left: var(--space-2); display: flex; align-items: center; justify-content: center; }
.input-field { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: var(--font-body); font-size: var(--font-size-body); color: var(--color-on-surface); padding: 0; }
.input-field::placeholder { color: var(--color-muted-foreground); }
.input-wrapper.size-sm { height: 40px; border-radius: var(--radius-sm); padding: 0 var(--space-3); }
.input-wrapper.size-sm .input-field { font-size: 14px; }
.input-wrapper.size-lg { height: 56px; border-radius: var(--radius-lg); padding: 0 var(--space-5); }
.input-wrapper.size-lg .input-field { font-size: 17px; }
.input-wrapper.disabled { opacity: 0.5; background: var(--color-surface-container-low); cursor: not-allowed; }
.input-wrapper.disabled .input-field { cursor: not-allowed; color: var(--color-muted-foreground); }
.input-wrapper.error { border-color: var(--color-error); }
.input-wrapper.error:focus-within { border-color: var(--color-error); }
.input-wrapper.search { background: var(--color-surface-container-low); border-color: transparent; }
.input-wrapper.search:hover { border-color: var(--color-border); }
.input-wrapper.search:focus-within { background: var(--color-surface); border-color: var(--color-primary); }
.input-wrapper.message { border-radius: var(--radius-full); padding-left: var(--space-5); padding-right: var(--space-2); }
.input-wrapper.message .action-btn { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 var(--space-4); border: none; border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-on-primary); font-family: var(--font-body); font-size: var(--font-size-body); font-weight: 500; cursor: pointer; transition: background var(--duration-fast) var(--easing-standard); }
.input-wrapper.message .action-btn:hover { background: var(--color-primary-hover); }
.input-wrapper.message .action-btn:active { filter: brightness(0.95); }
.error-text { font-size: var(--font-size-caption); color: var(--color-error); margin-top: var(--space-1); }
/* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="stage">

    <div class="story">
      <div class="story-label">基础输入框</div>
      <div class="rail">
        <div class="input-row">
          <div class="input-label">默认状态</div>
          <div class="input-wrapper" data-evidence-sample="default-md">
            <input type="text" class="input-field" placeholder="请输入昵称">
          </div>
        </div>
        <div class="input-row">
          <div class="input-label">禁用状态</div>
          <div class="input-wrapper disabled" data-evidence-sample="default-md-disabled">
            <input type="text" class="input-field" value="寻觅用户_8888" disabled>
          </div>
        </div>
        <div class="input-row">
          <div class="input-label">错误状态</div>
          <div class="input-wrapper error" data-evidence-sample="default-md-error">
            <input type="text" class="input-field" value="123">
            <span class="suffix-icon"><i data-lucide="alert-circle" style="width:20px;height:20px;color:var(--color-error)"></i></span>
          </div>
          <div class="error-text">昵称长度不足4位</div>
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="story">
      <div class="story-label">搜索与消息</div>
      <div class="rail">
        <div class="input-row">
          <div class="input-label">搜索框</div>
          <div class="input-wrapper search" data-evidence-sample="search-md">
            <span class="prefix-icon"><i data-lucide="search" style="width:20px;height:20px"></i></span>
            <input type="text" class="input-field" placeholder="搜索心动对象...">
          </div>
        </div>
        <div class="input-row">
          <div class="input-label">消息输入框</div>
          <div class="input-wrapper message size-lg" data-evidence-sample="message-lg">
            <input type="text" class="input-field" placeholder="说点什么...">
            <button class="action-btn">发送</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
