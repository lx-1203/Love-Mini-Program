# ============================================================
# Admin Console Nginx 配置（Task 8.1.2）
# ============================================================
# 功能：
#   1. SPA history 路由 fallback（vue-router history 模式）
#   2. gzip 压缩，减小传输体积
#   3. /api 反向代理到后端 API 服务
#   4. 静态资源缓存策略（hash 资源 1 年，index.html 不缓存）
#   5. 安全响应头（X-Content-Type-Options / X-Frame-Options 等）
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-javascript
        application/x-font-ttf
        application/vnd.ms-fontobject
        image/svg+xml
        font/woff
        font/woff2
        application/wasm;

    # 安全响应头
    # CSP 是 XSS 读取 localStorage 中 JWT 的核心缓解手段（R4-00484）：
    # - script-src 'self'：禁止内联/远程脚本执行（管理后台 JWT 存 localStorage，XSS 可窃取）
    # - style-src 保留 'unsafe-inline'：Vue 运行时大量使用内联 style 绑定（:style 等）
    # - img-src 允许 data:/blob:/https:：用户头像等可能来自外部存储，图片不可执行脚本
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 静态资源缓存策略：
    # - 带 hash 的资源（js/css/字体/图片）缓存 1 年
    # - index.html 不缓存，确保用户拿到最新版本
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # index.html 不缓存
    # 注意：nginx add_header 不跨 location 继承（本块已有 add_header），
    # 因此文档入口在此重复声明安全响应头，保证直接访问 /index.html 时 CSP 同样生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        expires 0;
    }

    # /api 反向代理到后端 API 服务
    # 上游固定为 api:8080（compose 网络内服务名）；不走 ${API_UPSTREAM} 环境变量展开
    # （官方 nginx 镜像未启用 envsubst，占位符会以字面值充当上游主机名导致启动失败）
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持（如未来需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA 路由 fallback：所有未匹配的路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点（nginx 自身可用性）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 隐藏 nginx 版本号
    server_tokens off;

    # 上传文件大小限制（与后端 multipart.max-file-size=50MB 对齐）
    client_max_body_size 50m;
}
