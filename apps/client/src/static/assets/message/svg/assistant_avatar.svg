<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
	<!-- 浅绿背景 -->
	<circle cx="60" cy="60" r="60" fill="#E8F8F1"/>
	<!-- 两片叶子 -->
	<ellipse cx="48" cy="30" rx="10" ry="18" fill="#5ADBA6" transform="rotate(-20 48 30)"/>
	<ellipse cx="72" cy="30" rx="10" ry="18" fill="#3CC99A" transform="rotate(20 72 30)"/>
	<!-- 叶脉 -->
	<line x1="48" y1="18" x2="48" y2="38" stroke="#3CC99A" stroke-width="2" stroke-linecap="round"/>
	<line x1="72" y1="18" x2="72" y2="38" stroke="#2AAE80" stroke-width="2" stroke-linecap="round"/>
	<!-- 茎 -->
	<line x1="60" y1="32" x2="60" y2="48" stroke="#3CC99A" stroke-width="4" stroke-linecap="round"/>
	<!-- 小圆脸 -->
	<circle cx="60" cy="68" r="30" fill="#3CC99A"/>
	<!-- 眼睛 -->
	<circle cx="50" cy="65" r="4" fill="#fff"/>
	<circle cx="70" cy="65" r="4" fill="#fff"/>
	<circle cx="51" cy="64" r="2" fill="#222"/>
	<circle cx="71" cy="64" r="2" fill="#222"/>
	<!-- 微笑 -->
	<path d="M50 78Q60 86 70 78" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
	<!-- 腮红 -->
	<ellipse cx="42" cy="74" rx="5" ry="3" fill="#FFB3B3" opacity="0.5"/>
	<ellipse cx="78" cy="74" rx="5" ry="3" fill="#FFB3B3" opacity="0.5"/>
</svg>