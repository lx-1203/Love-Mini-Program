  <path d="M100 140l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#FFD700" opacity="0.6"/>
  <path d="M105 60l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" fill="#FFD700" opacity="0.5"/>
