<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <defs>
    <linearGradient id="sprout-float-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4F5E4"/>
      <stop offset="100%" stop-color="#7DDEBB"/>
