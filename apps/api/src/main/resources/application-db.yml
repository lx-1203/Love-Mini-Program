spring:
  profiles:
    include: real
  datasource:
    # 数据库连接配置：通过 DB_URL / DB_USERNAME / DB_PASSWORD 环境变量外部化。
    # 启动时由 DatabaseConfigValidator 校验非空，未配置将拒绝启动。
    # 本地开发可通过 .env 文件或 start-server 脚本配置。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/qihang_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # 修复：HikariCP 连接池配置，避免默认配置在高并发下连接不足或泄漏。
    # 最大连接数 20 适合中小规模应用，生产环境可通过 DB_POOL_MAX 调整。
    hikari:
      # 最大连接数：默认 20，生产环境建议 (CPU 核心数 * 2) + 磁盘数
      maximum-pool-size: ${DB_POOL_MAX:20}
      # 最小空闲连接数：默认 10，与 maximum-pool-size 一致以避免抖动
      minimum-idle: ${DB_POOL_MIN:10}
      # 连接超时（毫秒）：默认 30s，超时抛出 SQLTransientConnectionException
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      # 连接最大生命周期（毫秒）：默认 30min，建议小于数据库 wait_timeout
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      # 连接空闲超时（毫秒）：默认 10min
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      # 连接泄漏检测阈值（毫秒）：默认 0（禁用），开启 60s 帮助定位泄漏
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION:60000}
      # 连接测试查询（MySQL 推荐 SELECT 1）
      connection-test-query: SELECT 1
      # 连接池名称（便于监控与日志识别）
      pool-name: CampusLoveHikariPool
  # Redis 配置：所有连接参数通过环境变量外部化，便于不同部署环境切换。
  # real profile 下启用 RedisAutoConfiguration，配合 RedisConfig 中自定义的
  # LettuceConnectionFactory / RedisTemplate / CacheManager Bean。
  # mock profile 下不依赖 Redis，由 application-mock.yml 覆盖。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 连接超时（毫秒）：默认 3s，超时抛 RedisConnectionFailureException
      timeout: ${REDIS_TIMEOUT:3000}
      # Lettuce 连接池配置（基于 commons-pool2，需引入对应依赖）
      lettuce:
        pool:
          # 连接池最大活跃连接数：默认 8，生产环境建议根据并发量调整
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          # 连接池最大空闲连接数：默认 8
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          # 连接池最小空闲连接数：默认 0
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          # 连接池最大等待时间（毫秒）：默认 -1（无限等待），生产建议设置为正数避免线程阻塞
          max-wait: ${REDIS_POOL_MAX_WAIT:-1}
  flyway:
    enabled: true
    # 默认扫描两个位置：
    #   1. filesystem:../../database/flyway/sql —— 既有迁移脚本目录（与项目早期保持一致）
    #   2. classpath:db/migration —— Spring Boot 默认迁移目录，用于 Phase A 起新增的迁移
    # 可通过环境变量 APP_FLYWAY_LOCATIONS 覆盖（如需禁用某个位置）。
    locations: ${APP_FLYWAY_LOCATIONS:filesystem:../../database/flyway/sql,classpath:db/migration}
    baseline-on-migrate: false
    # 使用双下划线占位符，避免与 MySQL 单行注释 # 以及 Spring ${...} 冲突。
    # 用于 V2026.06.25.0001__add_user_role_and_init_admin.sql 初始化管理员账号。
    placeholders:
      admin_openid: ${ADMIN_OPENID:admin-default-openid-change-me}
      admin_nickname: ${ADMIN_NICKNAME:系统管理员}
      # 管理员密码 BCrypt 哈希。
      # ⚠️ 生产环境必须通过环境变量 ADMIN_PASSWORD_HASH 设置，不留默认值。
      # 生成方法：调用 PasswordEncoderConfig.encodePassword("Admin@2026")
      # 首次登录后必须立即修改密码。
      admin_password_hash: ${ADMIN_PASSWORD_HASH:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  # ============ RabbitMQ 消息队列配置 ============
  # 通过环境变量外部化：RABBITMQ_HOST / RABBITMQ_PORT / RABBITMQ_USERNAME / RABBITMQ_PASSWORD / RABBITMQ_VIRTUAL_HOST
  # 默认值适配本地开发环境（127.0.0.1:5672, guest/guest, virtual-host=/）。
  # RabbitMQ 不可用时不影响应用启动：RabbitConfig 仅在 real profile 激活，
  # MessagingFallback 会在启动时检测连接可用性并降级为日志记录模式。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # 监听器（消费者）重试配置：消费失败时自动重试，避免瞬时故障导致消息丢失
    listener:
      simple:
        retry:
          # 是否启用消费者重试（默认 true，显式声明便于维护）
          enabled: true
          # 首次重试间隔（毫秒）：默认 1000ms
          initial-interval: ${RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
          # 最大重试次数：默认 3 次（含首次消费，共尝试 4 次）
          max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
          # 重试间隔乘数：每次重试间隔 = initial-interval * multiplier^(n-1)
          # 默认 1.0（等间隔），1.5 表示指数退避
          multiplier: ${RABBITMQ_RETRY_MULTIPLIER:1.5}