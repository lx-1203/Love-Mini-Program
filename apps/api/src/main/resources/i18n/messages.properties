# ============================================================
# 校园恋爱小程序 - 后端国际化文案资源（默认兜底）
# Task 3.2.3 - Java 后端 MessageSource 国际化
# ------------------------------------------------------------
# 本文件为默认 locale 文案（无 locale 后缀），与 messages_zh_CN.properties
# 内容保持一致，作为 fallback 兜底。当请求 Accept-Language 无匹配资源时使用。
#
# 编码：UTF-8（I18nConfig.messageSource() 已配置）
# 命名规范：模块.操作.状态 / 模块.资源.字段
# 参数插值：使用 {0} {1} ... 占位符，对应 messageSource.getMessage(key, args, locale)
# ============================================================

# ========== 通用文案（common.*） ==========
common.success=操作成功
common.failed=操作失败
common.loading=加载中
common.networkError=网络错误，请稍后重试
common.unauthorized=未认证的用户请求，请先登录
common.forbidden=无权访问该资源
common.notFound=资源不存在
common.serverError=服务器内部错误
common.badRequest=请求参数错误
common.tooManyRequests=请求过于频繁，请稍后再试
common.validationFailed=请求参数校验失败
common.mediaSizeExceeded=媒体文件大小超限
common.idempotentConflict=重复请求已被拦截
common.internalError=系统繁忙，请稍后重试
common.maintenance=系统维护中，请稍后再试
common.rateLimited=操作过于频繁，请稍后再试
common.unknownError=未知错误

