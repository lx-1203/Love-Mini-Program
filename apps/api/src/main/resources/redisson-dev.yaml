# 本地开发用 Redisson 配置(infra 启动修复)
# Redis 3.0.504(Windows)不支持 RESP3/HELLO,强制 RESP2 协议
# R4-00431：本文件仅限本地开发（单机 127.0.0.1:6379），
# 随 jar 分发仅供联调使用，生产环境走 Redisson 自动配置（spring.data.redis.*），
# 本文件不参与生产加载（需显式指定 --redisson.config 才会被读取）。
protocol: RESP2
singleServerConfig:
  address: "redis://127.0.0.1:6379"
  database: 0
  connectionMinimumIdleSize: 1
  connectionPoolSize: 4
  timeout: 3000
  connectTimeout: 5000
  retryAttempts: 1
  retryInterval: 1000
  subscriptionConnectionMinimumIdleSize: 1
  subscriptionConnectionPoolSize: 2
