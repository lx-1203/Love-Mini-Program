spring:
  application:
    name: campus-love-api
  profiles:
    # R4-00368：spring.profiles.default=mock 仅对「测试引导」生效——
    # 本地单元/集成测试（@SpringBootTest 未显式指定 profile）依赖该默认值加载 mock 配置。
    # 生产/联调启动一律走 CampusLoveApplication.main()：main() 在 Spring 启动前
    # 强制校验激活 profile（SPRING_PROFILES_ACTIVE / --spring.profiles.active /
    # -Dspring.profiles.active），为空或非法时明确报错退出（fail-fast），
    # 从源头杜绝「漏配 profile 以 mock 数据模式启动」：
    #   - mock 数据为内存态，重启即丢；
    #   - MockSecurityConfig 免真实认证（仅本地联调用），生产环境属严重安全风险。
    # 部署规范：生产/联调显式指定 real（SPRING_PROFILES_ACTIVE=real），
    # 本地开发显式指定 mock（如 --spring.profiles.active=mock）。
    default: mock
  # Multipart 文件上传配置：允许上传最大 50MB 的单文件、50MB 的整体请求
  # 与媒体上传校验逻辑（视频 ≤50MB）保持一致
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # Redis 配置：所有连接参数通过环境变量外部化，便于不同部署环境切换。
  # mock profile 下不依赖 Redis，仅 real profile 启用 RedisAutoConfiguration。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1}
  # RabbitMQ 配置：所有敏感信息（用户名/密码）必须通过环境变量配置。
  # 当 RabbitMQ 不可用时，MessagingFallback 会捕获异常并降级（不阻塞主流程）。
  # R4-01777：密码无默认值（生产必须显式注入 RABBITMQ_PASSWORD；本地 docker-compose
  # 显式配置 guest/guest 仅供开发环境，禁止默认凭据进生产）。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 连接超时（毫秒）：默认 5s，超时抛 AmqpIOException
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5000}
    # 启动时连接失败不阻塞容器启动（由 MessagingFallback 兜底）
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

server:
  port: ${APP_PORT:8080}
  # Tomcat 配置（Task 8.2.3 访问日志 + 容器化线程池优化）
  # 访问日志与 logback-spring.xml 中 ACCESS_FILE appender 协同工作：
  # - AccessLogValve 由 Tomcat 内置实现，将访问日志输出到 logger org.apache.catalina.accesslog
  # - logback 中该 logger 路由到 ACCESS_FILE，按日 + 100MB 滚动
  tomcat:
    accesslog:
      enabled: ${APP_ACCESS_LOG_ENABLED:true}
      # 自定义 pattern（combined 扩展）：
      # R4-00407：不再记录请求首行 %r（含完整 URL query）——query 中可能携带
      # JWT/token 等敏感参数（如 /api/v1/media/{id}?token=xxx），明文落访问日志
      # 等于会话泄露。改用 %m（请求方法）+ %U（仅路径，不含 query）+ %s（状态码）。
      # - %h: 远程 IP（X-Forwarded-For 由 RemoteIpValve 处理后注入）
      # - %l: 远程逻辑用户名（通常 -）
      # - %u: 认证用户（JWT userId，未认证 -）
      # - %t: 时间戳 [dd/MMM/yyyy:HH:mm:ss Z]
      # - %m: 请求方法（GET/POST/...）
      # - %U: 请求路径（不含 query 串，query 不记录以防 JWT/token 泄漏）
      # - %s: HTTP 状态码
      # - %b: 响应字节数（无 Body 时 -）
      # - %D: 请求耗时（毫秒）
      # - %{Referer}i / %{User-Agent}i / %{X-Trace-Id}i: 关键请求头
      pattern: '%h %l %u %t "%m %U %s" %b %D "%{Referer}i" "%{User-Agent}i" "%{X-Trace-Id}i"'
      # 日志输出到 logger（而非直接文件），由 logback 接管滚动策略
      condition-unless: ${APP_ACCESS_LOG_DISABLED:false}
    # 线程与连接配置（容器化部署优化）
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN:10}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:20s}

# Actuator 监控端点配置
# 暴露 health/info/metrics/prometheus 端点供 Prometheus 抓取与运维监控
management:
  endpoints:
    web:
      exposure:
        # 暴露 health/info/prometheus/metrics 四个端点：
        # - health: 健康检查（含数据库连通性等自定义指标）
        # - info: 应用元信息
        # - prometheus: Prometheus 抓取端点（micrometer-registry-prometheus 提供）
        # - metrics: Spring Boot Actuator 指标查询端点
        include: health,info,prometheus,metrics
  # 所有指标统一打上 application 标签，便于 Prometheus 区分多服务
  metrics:
    tags:
      application: campus-love-api
    # 开启 HTTP 服务端请求耗时的百分位直方图，便于统计 p95/p99 延迟
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  # health 端点详情仅授权用户可见，避免泄露内部组件状态
  endpoint:
    health:
      show-details: when_authorized
    # 显式启用 Prometheus 端点
    prometheus:
      enabled: true

# springdoc-openapi 配置（Task 8.4.1）
# 文档地址：
#   - Swagger UI: http://localhost:8080/swagger-ui.html
#   - OpenAPI JSON: http://localhost:8080/v3/api-docs
#   - OpenAPI YAML: http://localhost:8080/v3/api-docs.yaml
# 安全策略：
#   - real profile 下 /swagger-ui/** 与 /v3/api-docs/** 仅 ADMIN 可访问（详见 SecurityConfig）
#   - 生产部署可通过 SWAGGER_UI_ENABLED=false 关闭 Swagger UI
#   - OPENAPI_SERVER_URL 配置后会在 Swagger UI 顶部显示生产服务器地址
springdoc:
  # OpenAPI 文档端点路径
  api-docs:
    path: /v3/api-docs
    # FIN-00063：默认关闭（原默认 true）。生产环境默认不暴露接口文档，
    # 需要时显式设置 SWAGGER_UI_ENABLED=true（且 SecurityConfig 中 /v3/api-docs/** 仅 ADMIN 可访问）
    enabled: ${SWAGGER_UI_ENABLED:false}
  # Swagger UI 配置
  swagger-ui:
    path: /swagger-ui.html
    # FIN-00063：默认关闭，与 api-docs 保持同步
    enabled: ${SWAGGER_UI_ENABLED:false}
    # 启用 Try it out 按钮默认展开
    try-it-out-enabled: true
    # 接口排序按 HTTP method 顺序（GET → POST → PUT → DELETE）
    operations-sorter: method
    # Tag 排序按字母顺序
    tags-sorter: alpha
    # 持久化授权信息（避免刷新页面后丢失 token）
    persist-authorization: true
    # 禁用 Springdoc 的默认 petstore 示例
    disable-swagger-default-url: true
  # 默认对所有 Controller 生成文档
  # Controller 分布在 admin/ai/auth/campus/chat/clientconfig/discover/feedback/growth/home/match/media/profile/report 等多个包
  packages-to-scan: com.campuslove.api
  # 默认包含的路径（与 SecurityConfig 鉴权规则保持一致）
  paths-to-match: /api/v1/**,/api/ai/**

app:
  # 媒体存储配置（Phase A - Task A3）
  # storageRoot: 本地存储根目录，相对路径基于应用工作目录
  # URL 访问路径前缀 /uploads/** 由 WebConfig 静态资源映射
  media:
    storage-root: ${APP_MEDIA_STORAGE_ROOT:./uploads}
  # OpenAPI 文档元信息配置（Task 8）
  # - license-url：API 许可证地址，默认空（Swagger UI 不显示许可证链接）；
  #   生产环境通过 OPENAPI_LICENSE_URL 显式配置实际许可证地址。
  # - local-server-url：始终添加到 Swagger UI 服务器列表的本地开发地址，
  #   默认 http://localhost:8080；生产部署若 Swagger UI 暴露在内网，可通过
  #   OPENAPI_LOCAL_SERVER_URL 配置为内网地址。
  # - server-url / server-description：可选的主服务器地址，未配置时不添加主服务器。
  openapi:
    license-url: ${OPENAPI_LICENSE_URL:}
    local-server-url: ${OPENAPI_LOCAL_SERVER_URL:http://localhost:8080}
    server-url: ${OPENAPI_SERVER_URL:}
    server-description: ${OPENAPI_SERVER_DESCRIPTION:Campus Love API Server}
  # CORS 允许的源列表（Task 0.6.2）
  # - 逗号分隔字符串形式，便于 WebConfig/SecurityConfig 通过 split(',') 解析为 List<String>
  # - 兼容环境变量 CORS_ALLOWED_ORIGINS（逗号分隔字符串）直接覆盖
  # - 生产环境必须配置具体域名（如 https://example.com），禁止使用通配符 *
  # - 当 allowCredentials=true 时，Spring 6 严格模式禁止 *，必须使用 allowedOriginPatterns
  # - 也支持 YAML 列表形式覆盖：app.cors.allowed-origins[0], [1], ...
  #   Spring 自动将列表绑定结果转换为逗号分隔字符串供 @Value("${app.cors.allowed-origins}") 使用
  cors:
    # 默认值清空：生产环境必须显式配置 CORS_ALLOWED_ORIGINS，
    # mock profile 在 application-mock.yml 中提供 localhost 默认值供本地开发使用。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # WebSocket 允许的 Origin 模式列表（逗号分隔）。
  # - 默认值清空：生产环境必须显式配置具体域名/模式，避免硬编码 localhost。
  # - mock profile 在 application-mock.yml 中提供 http://localhost:*,http://127.0.0.1:* 默认值。
  # - 支持环境变量 WEBSOCKET_ALLOWED_ORIGIN_PATTERNS 直接覆盖。
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:}
  jwt:
    # JWT 签名密钥：必须通过环境变量 JWT_SECRET 设置，不允许使用默认值。
    # 启动时若未设置或使用了不安全的默认值，应用将拒绝启动。
    # 生成安全密钥示例：openssl rand -base64 48
    secret: ${JWT_SECRET:}
    # JWT 令牌有效期（毫秒），默认 86400000 = 24 小时
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # 密钥版本号（SubTask 10.2 安全加固）：用于支持密钥轮换。
    # 签发 token 时写入 JWT header kid（Key ID），验证时按 kid 选择对应版本密钥。
    # 轮换时递增版本号并配套更新 KMS/Vault 中的密钥。
    key-version: ${JWT_KEY_VERSION:1}
  # P0-14：体验账号一键登录入口开关。
  # 商业化默认关闭（false）；本地演示/联调可通过 APP_GUEST_LOGIN_ENABLED=true
  # 或启动参数 --app.guest-login.enabled=true 覆盖开启（mock profile 默认开启）。
  guest-login:
    enabled: ${APP_GUEST_LOGIN_ENABLED:false}
  # P0-15：演示充值风控。
  # enabled：演示充值开关，【默认关闭】（R4-00312）——演示充值直接入账、无支付网关
  #   验签，默认开启时任意用户可无限次免费充值（资金/账务风险）。
  #   ⚠️ 生产环境严禁开启直接入账，必须接入支付网关（微信支付/支付宝）+ 回调验签后入账。
  #   mock（本地演示）profile 在 application-mock.yml 中默认开启，保留本地演示能力。
  # daily-limit：每用户每日演示充值次数上限。
  demo-recharge:
    enabled: ${APP_DEMO_RECHARGE_ENABLED:false}
    daily-limit: ${APP_DEMO_RECHARGE_DAILY_LIMIT:5}
  # P0-17：商业化解锁单价（单位：分）。liked-me=喜欢我列表解锁，visitor=访客列表解锁。
  unlock-price:
    liked-me: ${APP_UNLOCK_PRICE_LIKED_ME:300}
    visitor: ${APP_UNLOCK_PRICE_VISITOR:300}
  wechat:
    # Task 0.6.3：微信小程序 AppID/AppSecret 通过环境变量注入
    # 环境变量命名规范：全大写 + 下划线（与 .env.example 保持一致）
    # - WECHAT_APPID：微信小程序 AppID（wx + 16 位十六进制字符）
    # - WECHAT_SECRET：微信小程序 AppSecret（16 位字符串，与 AppID 配套申请）
    # 申请地址：https://mp.weixin.qq.com/
    app-id: ${WECHAT_APPID:}
    app-secret: ${WECHAT_SECRET:}
    # P0-33 修复（2026-08-08）：本地联调降级开关（WECHAT_DEV_FALLBACK_ENABLED=true 时
    # 微信登录按 code 派生 dev-wechat-{code} 走正常链路；生产必须保持关闭）
    dev-fallback-enabled: ${WECHAT_DEV_FALLBACK_ENABLED:false}
    # Task 9：微信 jscode2session 接口 base URL，原在 WeChatClient.java 硬编码。
    # 默认值为官方文档地址，可通过环境变量 WECHAT_JSCODE2SESSION_URL 覆盖
    # （如需走内网代理或切换微信 API 域名）。
    jscode2session-url: ${WECHAT_JSCODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
  # infra R2-00010：Apple Sign in with Apple identityToken 验签配置
  # - bundle-id：本应用的 Bundle ID / App ID（Apple Developer 后台创建，如 com.campuslove.app）
  # - nonce：可选防重放随机数（前端生成并传入 identityToken，与后端配置一致才通过）
  apple:
    bundle-id: ${APPLE_BUNDLE_ID:}
    nonce: ${APPLE_NONCE:}
  # SubTask 1.4.5：Agnes AI 视频/图片生成服务配置
  # - API Key 必须通过环境变量 AGNES_API_KEY 配置，禁止硬编码
  # - 缺失时调用 /api/ai/** 端点会返回 401 AI_API_UNAUTHORIZED，提示运营方补全
  # - 申请地址：https://agnes-ai.com/dashboard/api-keys
  # - Task 9：api-base 默认值已移除，未配置时启动失败（避免硬编码外部 URL）；
  #   生产环境必须通过 AGNES_API_BASE 显式配置；mock profile 在 application-mock.yml
  #   中提供默认值供本地开发使用。
  ai:
    agnes:
      api-base: ${AGNES_API_BASE:}
      api-key: ${AGNES_API_KEY:}
      timeout-ms: ${AGNES_TIMEOUT_MS:30000}
  recommendation:
    daily-limit: ${APP_RECOMMENDATION_DAILY_LIMIT:30}
    discussion-limit: 10
    candidate-page-size: 200
    campus-weight: 50
    city-weight: 20
    interest-weight: 10
    schedule-weight: 15
  match:
    heart-signal-expire-hours: 48
    candidate-page-size: 50
    default-chat-duration: 20
    campus-weight: 50
    city-weight: 20
    interest-weight: 10
    schedule-weight: 15
  chat:
    session-expire-hours: 24
  checkin:
    extra-quota-per-check-in: 3
    # P0-23：每次签到奖励的交友币金额（单位：分，默认 50 分 = 0.5 元）
    reward-cents-per-check-in: ${CHECKIN_REWARD_CENTS:50}
  content-filter:
    enabled: true
    keywords:
      - 赌博
      - 色情
      - 违法
      - 毒品
      - 枪支
      - 暴力
      - 诈骗
      - 传销
      - 裸聊
      - 约炮
      - 嫖娼
      - 卖淫
      - 赌博网站
      - 六合彩
      - 博彩

# Resilience4j 配置（Task 2.3.3）。
# 为外部依赖（微信 API / 短信 / 对象存储）提供熔断 / 重试 / 限流 / 降级能力。
#
# 设计原则：
# - 熔断器（CircuitBreaker）：保护下游服务，连续失败时快速熔断，避免雪崩；
#   半开状态试探性放行请求，恢复后自动闭合。
# - 重试（Retry）：对瞬时故障（网络抖动、临时 5xx）自动重试，
#   指数退避避免加剧下游压力；对业务异常（4xx）不重试。
# - 限流器（RateLimiter）：限制对下游的调用速率，防止突发流量打垮下游。
#
# 配置项命名：backend 名称对齐 {@link com.campuslove.api.config.Resilience4jConfig} 中
# 各 @CircuitBreaker/@Retry/@RateLimiter 注解的 name 属性。
resilience4j:
  circuitbreaker:
    instances:
      # 微信 API（jscode2session、access_token、订阅消息）
      wechatApi:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 业务异常（如 WeChatAuthException 中的 4xx 错误码）不应触发熔断
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.campuslove.api.auth.WeChatClient.WeChatAuthException
      # 对象存储（媒体上传 / 下载）
      objectStorage:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 60
        slow-call-rate-threshold: 70
        slow-call-duration-threshold: 10s
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - org.springframework.web.multipart.MultipartException
      # 短信服务（如未来集成阿里云/腾讯云 SMS）
      sms:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.RestClientException
  retry:
    instances:
      # 微信 API 重试：最多 2 次（共 3 次请求），指数退避 500ms→1s→2s
      wechatApi:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 5s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.campuslove.api.auth.WeChatClient.WeChatAuthException
      # 对象存储重试：最多 2 次（共 3 次请求），固定 200ms 间隔
      objectStorage:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: false
        retry-exceptions:
          - java.io.IOException
      # 短信重试：最多 2 次（共 3 次请求），指数退避 1s→2s→4s
      sms:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 10s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.RestClientException
  ratelimiter:
    instances:
      # 微信 API 限流：每 1s 最多 10 次调用（微信侧也有 QPS 限制，避免触发限流）
      wechatApi:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
        register-health-indicator: true
      # 短信限流：每 1s 最多 5 次调用（SMS 服务商通常按 QPS 计费）
      sms:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 0
        register-health-indicator: true
  # 暴露 resilience4j 健康指标到 /actuator/health
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

# 文件存储配置（Task 9）
# - upload-prefix：上传文件 URL 访问前缀，与 MediaAccessController 鉴权代理路由一致
#   （infra R2-00013/security_review：原 /uploads/ 已被 SecurityConfig denyAll，
#   语音 URL 改为 /api/v1/media/ 使上传即走鉴权代理，不再依赖前端重写兜底）
# - base-dir：本地存储根目录，与 LocalMediaStorageService 共享语义。
#   原 VoiceMessageService 使用 app.media.storage-root，已统一为本配置项。
# 两者可通过环境变量 FILE_STORAGE_PREFIX / FILE_STORAGE_BASE_DIR 覆盖。
file-storage:
  upload-prefix: ${FILE_STORAGE_PREFIX:/api/v1/media/}
  base-dir: ${FILE_STORAGE_BASE_DIR:uploads}
