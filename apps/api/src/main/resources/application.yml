spring:
  application:
    name: campus-love-api
  profiles:
    default: mock
  # Multipart 文件上传配置：允许上传最大 50MB 的单文件、50MB 的整体请求
  # 与媒体上传校验逻辑（视频 ≤50MB）保持一致
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # Redis 配置：所有连接参数通过环境变量外部化，便于不同部署环境切换。
  # mock profile 下不依赖 Redis，仅 real profile 启用 RedisAutoConfiguration。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1}
  # RabbitMQ 配置：所有敏感信息（用户名/密码）必须通过环境变量配置。
  # 当 RabbitMQ 不可用时，MessagingFallback 会捕获异常并降级（不阻塞主流程）。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 连接超时（毫秒）：默认 5s，超时抛 AmqpIOException
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5000}
    # 启动时连接失败不阻塞容器启动（由 MessagingFallback 兜底）
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

server:
  port: ${APP_PORT:8080}

# Actuator 监控端点配置
# 暴露 health/info/metrics/prometheus 端点供 Prometheus 抓取与运维监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # 所有指标统一打上 application 标签，便于 Prometheus 区分多服务
  metrics:
    tags:
      application: campus-love-api
  # health 端点详情仅授权用户可见，避免泄露内部组件状态
  endpoint:
    health:
      show-details: when_authorized

app:
  # 媒体存储配置（Phase A - Task A3）
  # storageRoot: 本地存储根目录，相对路径基于应用工作目录
  # URL 访问路径前缀 /uploads/** 由 WebConfig 静态资源映射
  media:
    storage-root: ${APP_MEDIA_STORAGE_ROOT:./uploads}
  jwt:
    # JWT 签名密钥：必须通过环境变量 JWT_SECRET 设置，不允许使用默认值。
    # 启动时若未设置或使用了不安全的默认值，应用将拒绝启动。
    # 生成安全密钥示例：openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  recommendation:
    daily-limit: 10
    discussion-limit: 10
    candidate-page-size: 200
    campus-weight: 50
    city-weight: 20
    interest-weight: 10
    schedule-weight: 15
  match:
    heart-signal-expire-hours: 48
    candidate-page-size: 50
    default-chat-duration: 20
    campus-weight: 50
    city-weight: 20
    interest-weight: 10
    schedule-weight: 15
  chat:
    session-expire-hours: 24
  checkin:
    extra-quota-per-check-in: 3
  content-filter:
    enabled: true
    keywords:
      - 赌博
      - 色情
      - 违法
      - 毒品
      - 枪支
      - 暴力
      - 诈骗
      - 传销
      - 裸聊
      - 约炮
      - 嫖娼
      - 卖淫
      - 赌博网站
      - 六合彩
      - 博彩
