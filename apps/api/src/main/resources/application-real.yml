# ============================================================
# real profile 配置（P3 联调 K1）
# 原文件名 application-db.yml 与激活的 profile 名（real）不一致：
# Spring 仅加载 application-{active-profile}.yml，激活 real 时该文件
# 不会被加载，导致生产部署拿不到数据库/Redis/Flyway 配置。
# 已重命名为 application-real.yml 并对齐文档（DEPLOYMENT.md 激活 real）。
# ============================================================
spring:
  datasource:
    # 数据库连接配置：通过 DB_URL / DB_USERNAME / DB_PASSWORD 环境变量外部化。
    # 启动时由 DatabaseConfigValidator 校验非空，未配置将拒绝启动。
    # 本地开发可通过 .env 文件或 start-server 脚本配置。
    # 安全说明：password 不带任何明文默认值（空字符串仅占位），生产环境必须通过 DB_PASSWORD 注入强密码。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_love?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # 修复：HikariCP 连接池配置，避免默认配置在高并发下连接不足或泄漏。
    # 最大连接数 20 适合中小规模应用，生产环境可通过 DB_POOL_MAX 调整。
    hikari:
      # 最大连接数：默认 20，生产环境建议 (CPU 核心数 * 2) + 磁盘数
      maximum-pool-size: ${DB_POOL_MAX:20}
      # 最小空闲连接数：默认 10，与 maximum-pool-size 一致以避免抖动
      minimum-idle: ${DB_POOL_MIN:10}
      # 连接超时（毫秒）：默认 30s，超时抛出 SQLTransientConnectionException
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      # 连接最大生命周期（毫秒）：默认 30min，建议小于数据库 wait_timeout
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      # 连接空闲超时（毫秒）：默认 10min
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      # 连接泄漏检测阈值（毫秒）：默认 0（禁用），开启 60s 帮助定位泄漏
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION:60000}
      # 连接测试查询（MySQL 推荐 SELECT 1）
      connection-test-query: SELECT 1
      # 连接池名称（便于监控与日志识别）
      pool-name: CampusLoveHikariPool
  # Redis 配置：所有连接参数通过环境变量外部化，便于不同部署环境切换。
  # real profile 下启用 RedisAutoConfiguration，配合 RedisConfig 中自定义的
  # LettuceConnectionFactory / RedisTemplate / CacheManager Bean。
  # mock profile 下不依赖 Redis，由 application-mock.yml 覆盖。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 连接超时（毫秒）：默认 3s，超时抛 RedisConnectionFailureException
      timeout: ${REDIS_TIMEOUT:3000}
      # Lettuce 连接池配置（基于 commons-pool2，需引入对应依赖）
      lettuce:
        pool:
          # 连接池最大活跃连接数：默认 8，生产环境建议根据并发量调整
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          # 连接池最大空闲连接数：默认 8
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          # 连接池最小空闲连接数：默认 0
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          # 连接池最大等待时间（毫秒）：默认 -1（无限等待），生产建议设置为正数避免线程阻塞
          max-wait: ${REDIS_POOL_MAX_WAIT:-1}
  # ============ 演示/体验相关开关（real profile，显式默认值见文件末尾 app: 段） ============
  # R4-00312：演示充值【默认关闭】——直接入账端点无支付网关验签，生产开启等于
  # 任意用户免费无限充值（资金/账务风险）。
  # ⚠️ 生产必须接入支付网关（微信支付/支付宝）+ 回调验签后再入账，
  #    严禁在未接入支付网关的情况下通过 APP_DEMO_RECHARGE_ENABLED=true 开启直接入账。
  # P0-14 ⚠️ 生产警告：体验账号入口（app.guest-login.enabled）默认关闭，
  # 本地联调可通过 APP_GUEST_LOGIN_ENABLED=true 临时开启，上线前确认关闭。
  flyway:
    enabled: true
    # 默认扫描 filesystem 迁移目录（单源）：
    #   filesystem:../../database/flyway/sql —— 全部迁移脚本（含原 classpath 的 4 个 Phase A
    #   迁移，已并入主链并重编号为 V2026.07.24.0001~0004，保证 media_asset 等表在引用前创建）。
    #   注意：相对路径基于进程工作目录（apps/api），../../database 即仓库根的 database 目录
    #   （与 .env.example 中 APP_FLYWAY_LOCATIONS 的默认值保持一致）；
    #   docker 环境通过 APP_FLYWAY_LOCATIONS 覆盖为 filesystem:/app/db/migration。
    locations: ${APP_FLYWAY_LOCATIONS:filesystem:../../database/flyway/sql}
    baseline-on-migrate: false
    # 使用 Flyway 默认 ${...} 占位符语法（Spring 属性风格），
    # 迁移脚本中引用（见 V2026.06.25.0002）：${admin_password_hash} ← admin_password_hash，
    # 由 ADMIN_INITIAL_PASSWORD_HASH 环境变量注入，注入路径核对无误。
    # 注意：不能使用双下划线 __xxx__ 语法——Flyway 会将迁移文件名中的 __ 也当作
    # 占位符解析导致启动失败；双下划线语法是历史遗留，已统一改为 ${...}。
    placeholders:
      admin_openid: ${ADMIN_OPENID:admin-default-openid-change-me}
      admin_nickname: ${ADMIN_NICKNAME:系统管理员}
      #
      # R4-00366/R4-01776：默认值已移除——不再内置任何 BCrypt 哈希默认值（含强随机哈希），
      # 内置哈希默认值均存在口令猜测风险（已知哈希可被逆向/字典攻击）。
      #
      # ⚠️ 首次部署必须通过环境变量 ADMIN_INITIAL_PASSWORD_HASH 覆盖为运营已知明文对应的哈希：
      #   - 生成明文：openssl rand -base64 24（生成 24 字节随机明文）
      #   - 生成哈希：调用 PasswordEncoderConfig.encodePassword(plaintext) 或
      #     python -c "import bcrypt; print(bcrypt.hashpw(b'YOUR-PASSWORD', bcrypt.gensalt(10)).decode())"
      #   - 设置环境变量：ADMIN_INITIAL_PASSWORD_HASH=$2a$10$<your-generated-hash>
      #   - 首次登录后必须立即修改密码为运营人已知的安全密码
      #
      # 未配置时占位符注入空字符串：管理员账号无法登录（安全锁定），
      # 且 AdminPasswordValidator（real profile）检测到空哈希直接拒绝启动（fail-fast）。
      admin_password_hash: ${ADMIN_INITIAL_PASSWORD_HASH:}
      # R4-00420/00422/00423：演示种子数据环境守卫——虚拟用户/演示私信/画像随机种子
      # 迁移仅在 demo_seed=true 时写入（默认 false，生产不灌入虚拟用户与演示数据）。
      # 演示/验收环境通过 DEMO_SEED=true 环境变量开启。
      demo_seed: ${DEMO_SEED:false}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  # ============ RabbitMQ 消息队列配置 ============
  # 通过环境变量外部化：RABBITMQ_HOST / RABBITMQ_PORT / RABBITMQ_USERNAME / RABBITMQ_PASSWORD / RABBITMQ_VIRTUAL_HOST
  # R4-01777：密码无默认值（生产必须显式注入 RABBITMQ_PASSWORD；本地开发如需
  # 连接本地 RabbitMQ 请显式设置 RABBITMQ_USERNAME/RABBITMQ_PASSWORD=guest）。
  # RabbitMQ 不可用时不影响应用启动：RabbitConfig 仅在 real profile 激活，
  # MessagingFallback 会在启动时检测连接可用性并降级为日志记录模式。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # 监听器（消费者）重试配置：消费失败时自动重试，避免瞬时故障导致消息丢失
    listener:
      simple:
        retry:
          # 是否启用消费者重试（默认 true，显式声明便于维护）
          enabled: true
          # 首次重试间隔（毫秒）：默认 1000ms
          initial-interval: ${RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
          # 最大重试次数：默认 3 次（含首次消费，共尝试 4 次）
          max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
          # 重试间隔乘数：每次重试间隔 = initial-interval * multiplier^(n-1)
          # 默认 1.0（等间隔），1.5 表示指数退避
          multiplier: ${RABBITMQ_RETRY_MULTIPLIER:1.5}

# RabbitMQ 为可选降级依赖（未安装时 MessagingFallback 兜底为日志模式），
# 禁用其健康指示器，避免可选组件不可用导致 /actuator/health 整体 DOWN。
# 关键依赖（MySQL/Redis）仍正常参与健康检查。
management:
  health:
    rabbit:
      enabled: ${RABBITMQ_HEALTH_ENABLED:false}

# ============ 演示/体验相关开关（real profile 显式默认值） ============
# R4-00312：演示充值【默认关闭】——直接入账端点无支付网关验签，生产开启等于
# 任意用户免费无限充值（资金/账务风险）。
# ⚠️ 生产必须接入支付网关（微信支付/支付宝）+ 回调验签后再入账，严禁直接入账。
# P0-14：体验账号入口默认关闭（与 application.yml 默认 false 保持一致并显式声明）。
app:
  demo-recharge:
    enabled: ${APP_DEMO_RECHARGE_ENABLED:false}
    daily-limit: ${APP_DEMO_RECHARGE_DAILY_LIMIT:5}
  guest-login:
    enabled: ${APP_GUEST_LOGIN_ENABLED:false}