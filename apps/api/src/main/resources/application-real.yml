# ============================================================
# real profile 配置（P3 联调 K1）
# 原文件名 application-db.yml 与激活的 profile 名（real）不一致：
# Spring 仅加载 application-{active-profile}.yml，激活 real 时该文件
# 不会被加载，导致生产部署拿不到数据库/Redis/Flyway 配置。
# 已重命名为 application-real.yml 并对齐文档（DEPLOYMENT.md 激活 real）。
# ============================================================
spring:
  datasource:
    # 数据库连接配置：通过 DB_URL / DB_USERNAME / DB_PASSWORD 环境变量外部化。
    # 启动时由 DatabaseConfigValidator 校验非空，未配置将拒绝启动。
    # 本地开发可通过 .env 文件或 start-server 脚本配置。
    # 安全说明（R4-00408）：username 不再带 root 默认值——漏配 DB_USERNAME 时
    # 以空密码 root 连库的本地默认值会沿用至错误环境；password 同样不带任何
    # 明文默认值（空字符串仅占位），生产环境必须通过 DB_PASSWORD 注入强密码。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_love?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    # 修复：HikariCP 连接池配置，避免默认配置在高并发下连接不足或泄漏。
    # 最大连接数 20 适合中小规模应用，生产环境可通过 DB_POOL_MAX 调整。
    hikari:
      # 最大连接数：默认 20，生产环境建议 (CPU 核心数 * 2) + 磁盘数
      maximum-pool-size: ${DB_POOL_MAX:20}
      # 最小空闲连接数：默认 10，与 maximum-pool-size 一致以避免抖动
      minimum-idle: ${DB_POOL_MIN:10}
      # 连接超时（毫秒）：默认 30s，超时抛出 SQLTransientConnectionException
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      # 连接最大生命周期（毫秒）：默认 30min，建议小于数据库 wait_timeout
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      # 连接空闲超时（毫秒）：默认 10min
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      # 连接泄漏检测阈值（毫秒）：默认 0（禁用），开启 60s 帮助定位泄漏
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION:60000}
      # 连接测试查询（MySQL 推荐 SELECT 1）
      connection-test-query: SELECT 1
      # 连接池名称（便于监控与日志识别）
      pool-name: CampusLoveHikariPool
  # Redis 配置：所有连接参数通过环境变量外部化，便于不同部署环境切换。
  # real profile 下启用 RedisAutoConfiguration，配合 RedisConfig 中自定义的
  # LettuceConnectionFactory / RedisTemplate / CacheManager Bean。
  # mock profile 下不依赖 Redis，由 application-mock.yml 覆盖。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 连接超时（毫秒）：默认 3s，超时抛 RedisConnectionFailureException
      timeout: ${REDIS_TIMEOUT:3000}
      # Lettuce 连接池配置（基于 commons-pool2，需引入对应依赖）
      lettuce:
        pool:
          # 连接池最大活跃连接数：默认 8，生产环境建议根据并发量调整
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          # 连接池最大空闲连接数：默认 8
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          # 连接池最小空闲连接数：默认 0
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          # 连接池最大等待时间（毫秒）：默认 -1（无限等待），生产建议设置为正数避免线程阻塞
          max-wait: ${REDIS_POOL_MAX_WAIT:-1}
  # ============ 演示/体验相关开关（real profile，显式默认值见文件末尾 app: 段） ============
  # R4-00312：演示充值【默认关闭】——直接入账端点无支付网关验签，生产开启等于
  # 任意用户免费无限充值（资金/账务风险）。
  # ⚠️ 生产必须接入支付网关（微信支付/支付宝）+ 回调验签后再入账，
  #    严禁在未接入支付网关的情况下通过 APP_DEMO_RECHARGE_ENABLED=true 开启直接入账。
  # P0-14 ⚠️ 生产警告：体验账号入口（app.guest-login.enabled）默认关闭，
  # 本地联调可通过 APP_GUEST_LOGIN_ENABLED=true 临时开启，上线前确认关闭。
  flyway:
    # S3-2（2026-10-30）single-writer：迁移不再默认在 api 启动时执行——多副本（N 个 api
    # 容器同时 boot）会并发抢跑同一批 DDL，产生 schema_history 竞态/重复执行。
    # 生产/compose 由一次性 `migrate` 服务（官方 Flyway CLI）跑完，api 通过
    # depends_on.condition: service_completed_successfully 等它成功后再启动，
    # compose 给 api 注入 FLYWAY_ENABLED=false 关闭本启动时迁移。
    # 单容器/本地 real 直跑（`./mvnw spring-boot:run -Dspring.profiles.active=real`）
    # 不经过 compose，仍按下面 true 的默认值自动迁移，保持旧开发体验。
    # 回退开关：把环境变量 FLYWAY_ENABLED 置为 true（或在 compose .env 覆盖）即可
    # 重新打开 api 启动时迁移（详见 doc/DEPLOYMENT.md「数据库初始化」）。
    enabled: ${FLYWAY_ENABLED:true}
    # 默认扫描 filesystem 迁移目录（单源）：
    #   filesystem:../../database/flyway/sql —— 全部迁移脚本（含原 classpath 的 4 个 Phase A
    #   迁移，已并入主链并重编号为 V2026.07.24.0001~0004，保证 media_asset 等表在引用前创建）。
    #   注意：相对路径基于进程工作目录（apps/api），../../database 即仓库根的 database 目录
    #   （与 .env.example 中 APP_FLYWAY_LOCATIONS 的默认值保持一致）；
    #   docker 环境通过 APP_FLYWAY_LOCATIONS 覆盖为 filesystem:/app/db/migration。
    locations: ${APP_FLYWAY_LOCATIONS:filesystem:../../database/flyway/sql}
    baseline-on-migrate: false
    # ============ 2026-10-31：validate 与"补建缺表的低版本迁移"的冲突（我自己引入的回归） ============
    # V2026.10.13.0001__create_circle_layer_and_admin_layer.sql 的编号【必须】低于
    # 引用这两张表的 V2026.10.14.0005/.0006/.0007，否则空库按链建库仍然炸在 0005。
    # 代价是：在已经迁移过的库上，它是"低于 head 且未应用"的迁移 ⇒ 状态为 Ignored。
    # `flyway:info` 只列出状态，看着无害（Ignored 一行）；但 `migrate` 会先 validate，
    # validateOnMigrate 默认为 true，于是直接抛
    #   FlywayValidateException: Detected resolved migration not applied to database: 2026.10.13.0001
    # 也就是说：本机 dev 库、以及任何【已经部署过】的库，api 一起来就死。
    # CI 的两个真实栈 job 都碰不到这件事——它们用的是一座【新空库】，
    # 在那里 0013 按序执行、没有 out-of-order 状态。这是"fresh-schema 证明不了
    # 升级路径"的实例，判点补在下面第 6 步的 db-integration 注释之外，另记台账。
    # 选择 `*:ignored` 而不是 out-of-order=true：
    #   * out-of-order=true 会真的把 0013 在老库上补跑一遍（CREATE TABLE IF NOT EXISTS，
    #     结果为 no-op 并写入 history），代价是把"允许乱序执行"变成全局长期策略，
    #     以后任何人插错编号都会被静默吞掉——正是本轮想根治的那类债；
    #   * `*:ignored` 只让 validate 放过 Ignored 状态，绝不乱序执行；
    #     在前的 0002/0003/0004 照常按序应用，未来把新迁移插错位置依旧会红。
    # 残留风险如实写下：放过 Ignored 意味着"某个低于 head 的迁移在老库上永远不会执行"，
    # 若哪天有人往这种低版本迁移里塞【必须生效的 DML】，老库会漏掉它。
    # 静态判点 tests/entity-ddl-drift.spec.mjs 已经盯住"引用先于创建"这一类，
    # 但盯不住"低版本迁移里的 DML 在老库不生效"，所以本轮所有补数据动作都写成
    # 前向迁移（V2026.10.31.0003 一类），不依赖 out-of-order。
    ignore-migration-patterns: "*:ignored"
    # 使用 Flyway 默认 ${...} 占位符语法（Spring 属性风格），
    # 迁移脚本中引用（见 V2026.06.25.0002）：${admin_password_hash} ← admin_password_hash，
    # 由 ADMIN_INITIAL_PASSWORD_HASH 环境变量注入。
    # 注意：不能使用双下划线 __xxx__ 语法——Flyway 会将迁移文件名中的 __ 也当作
    # 占位符解析导致启动失败；双下划线语法是历史遗留，已统一改为 ${...}。
    #
    # ============ 2026-10-31 复审（P1）：凭据类占位符一律【不带默认值】 ============
    # 原写法 `admin_openid: ${ADMIN_OPENID:admin-default-openid-change-me}` 与
    # `admin_password_hash: ${ADMIN_INITIAL_PASSWORD_HASH:}` 的注释都声称"无默认值、fail-fast"，
    # 实际是 fail-open，两种失效方式各不相同：
    #   * 带默认值：漏配时迁移照常执行，落库一个 openid 完全可预测（admin-default-openid-change-me）
    #     的 ADMIN 行，第三方登录链路可冒用；
    #   * 冒号后为空：空字符串也是"有值"——users.openid / users.password 均为 NOT NULL
    #     （V2026.05.18.0001:5），'' 恰好满足约束，于是照样插入一行"空凭据管理员"。
    # 单靠 AdminOpenidValidator / AdminPasswordValidator 兜不住：它们只在 api 进程里拒绝启动，
    # 而 Flyway 初始化器与这两个校验器的 bean 创建顺序没有保证，拒绝得再早也撤回不了
    # 已经落库的那一行（compose 编排里 migrate 服务还会先于 api 独立跑完迁移）。
    # 现在写成不带 `:默认值` 的 ${VAR}：环境变量缺失 → Spring 解析占位符直接抛
    # "Could not resolve placeholder 'ADMIN_OPENID'"，上下文启动失败，Flyway 一行都不跑。
    # 三条迁移路径口径统一（详见 database/flyway/flyway.toml 顶部注释）：
    #   1) 本文件（api 启动时迁移，单容器/本地 real 直跑）：缺失 → 启动失败；
    #   2) docker-compose 一次性 migrate 服务 + api 服务：${ADMIN_OPENID:?...} → compose 层中止；
    #   3) 独立 CLI（flyway.toml + scripts/launcher/run-flyway.ps1）：该文件【不定义】这些
    #      占位符，Flyway 遇到未替换的 ${...} → migrate 失败。
    placeholders:
      # 运营真实微信 openid：必须由环境变量 ADMIN_OPENID 注入（AdminOpenidValidator 还会
      # 校验长度与 o+27 位格式）。无默认值——缺失即启动失败。
      admin_openid: ${ADMIN_OPENID}
      # 管理员昵称是展示字段、不是凭据，因此保留默认值；关键是三条路径取值必须一致，
      # 本文件与 docker-compose 都用同一个"系统管理员"，独立 CLI 则要求显式注入
      # FLYWAY_PLACEHOLDERS_ADMIN_NICKNAME（flyway.toml 刻意不给，属严格度差异，不产生凭据风险）。
      admin_nickname: ${ADMIN_NICKNAME:系统管理员}
      #
      # R4-00366/R4-01776：不内置任何 BCrypt 哈希默认值（含强随机哈希）——
      # 内置哈希默认值均存在口令猜测风险（已知哈希可被逆向/字典攻击）。
      #
      # ⚠️ 首次部署必须通过环境变量 ADMIN_INITIAL_PASSWORD_HASH 注入运营已知明文对应的哈希：
      #   - 生成明文：openssl rand -base64 24（生成 24 字节随机明文）
      #   - 生成哈希：调用 PasswordEncoderConfig.encodePassword(plaintext) 或
      #     python -c "import bcrypt; print(bcrypt.hashpw(b'YOUR-PASSWORD', bcrypt.gensalt(10)).decode())"
      #   - 设置环境变量：ADMIN_INITIAL_PASSWORD_HASH=$2a$10$<your-generated-hash>
      #   - 首次登录后必须立即修改密码为运营人已知的安全密码
      #
      # 未配置时【不再注入空字符串】（那是原注释的 fail-open 漏洞）：占位符解析失败即拒绝启动，
      # 迁移脚本根本不会执行，因此不会插入 password='' 的管理员行；即使运营显式注入了空串/弱值，
      # AdminPasswordValidator（real profile 严格模式）仍会二次拒绝启动。
      admin_password_hash: ${ADMIN_INITIAL_PASSWORD_HASH}
      # R4-00420/00422/00423：演示种子数据环境守卫——虚拟用户/演示私信/画像随机种子
      # 迁移仅在 demo_seed=true 时写入（默认 false）。这里 false 不是"空默认值冒充已配置"，
      # 而是 fail-closed 的安全侧：漏配时生产不灌入虚拟用户与演示数据，只有显式
      # DEMO_SEED=true 才放开——保留默认值。
      demo_seed: ${DEMO_SEED:false}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # S3-4（2026-10-30）批量写。三件事缺一不可：
        # * jdbc.batch_size：Hibernate 攒够 N 条再发一次 JDBC 调用；
        # * order_inserts / order_updates：一个事务里混写多种实体时，默认按调用顺序发送会
        #   把批次切碎（写一条 A、一条 B 就 flush 一次），排序后同表语句才能真的成批；
        # * 连接串上的 rewriteBatchedStatements=true（见上方 datasource / DB_URL）：
        #   MySQL 驱动默认把 addBatch 展开成逐条发送，不加这个参数前两项等于白设。
        # 典型受益路径：热榜分数批量刷新、点赞/未读数回写、后台批量审核。
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  # ============ RabbitMQ 消息队列配置 ============
  # 通过环境变量外部化：RABBITMQ_HOST / RABBITMQ_PORT / RABBITMQ_USERNAME / RABBITMQ_PASSWORD / RABBITMQ_VIRTUAL_HOST
  # R4-01777：密码无默认值（生产必须显式注入 RABBITMQ_PASSWORD；本地开发如需
  # 连接本地 RabbitMQ 请显式设置 RABBITMQ_USERNAME/RABBITMQ_PASSWORD=guest）。
  # RabbitMQ 不可用时不影响应用启动：RabbitConfig 仅在 real profile 激活，
  # MessagingFallback 会在启动时检测连接可用性并降级为日志记录模式。
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # 监听器（消费者）重试配置：消费失败时自动重试，避免瞬时故障导致消息丢失
    listener:
      simple:
        # R4-00430：监听器自动启动开关（报告 P1-3）。缺省 false——未部署 RabbitMQ 时
        # 避免每秒重试刷日志噪音；生产环境部署 RabbitMQ 后通过 .env 设为 true 即可激活。
        auto-startup: ${APP_EVENTS_ENABLED:false}
        retry:
          # 是否启用消费者重试（默认 true，显式声明便于维护）
          enabled: true
          # 首次重试间隔（毫秒）：默认 1000ms
          initial-interval: ${RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
          # 最大重试次数：默认 3 次（含首次消费，共尝试 4 次）
          max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
          # 重试间隔乘数：每次重试间隔 = initial-interval * multiplier^(n-1)
          # 默认 1.0（等间隔），1.5 表示指数退避
          multiplier: ${RABBITMQ_RETRY_MULTIPLIER:1.5}

# RabbitMQ 为可选降级依赖（未安装时 MessagingFallback 兜底为日志模式），
# 禁用其健康指示器，避免可选组件不可用导致 /actuator/health 整体 DOWN。
# 关键依赖（MySQL/Redis）仍正常参与健康检查。
management:
  health:
    rabbit:
      enabled: ${RABBITMQ_HEALTH_ENABLED:false}

# ============ 演示/体验相关开关（real profile 显式默认值） ============
# R4-00312：演示充值【默认关闭】——直接入账端点无支付网关验签，生产开启等于
# 任意用户免费无限充值（资金/账务风险）。
# ⚠️ 生产必须接入支付网关（微信支付/支付宝）+ 回调验签后再入账，严禁直接入账。
# P0-14：体验账号入口默认关闭（与 application.yml 默认 false 保持一致并显式声明）。
app:
  # 2026-10-25 P0：管理员口令启动审计——active 后台账号必须为 BCrypt 且非已知泄露值。
  # fail（默认）= 不合规即拒绝启动；warn = 只记错误日志；off = 关闭（仅限本地开发）。
  admin:
    db-password-audit: ${APP_ADMIN_DB_PASSWORD_AUDIT:fail}
  # R4-00358：模拟校园认证端点【默认关闭】——生产 API 面不暴露演示残留端点
  # （DemoCertificationSimulateController 仅在开启时注册映射）。
  # 本地 real 联调需要演示一键认证时，可设 APP_CAMPUS_CERT_SIMULATE_ENABLED=true。
  campus:
    certification-simulate-enabled: ${APP_CAMPUS_CERT_SIMULATE_ENABLED:false}
  demo-recharge:
    enabled: ${APP_DEMO_RECHARGE_ENABLED:false}
    daily-limit: ${APP_DEMO_RECHARGE_DAILY_LIMIT:5}
  guest-login:
    enabled: ${APP_GUEST_LOGIN_ENABLED:false}
    # R4-00250：体验账号黑名单手机号（仅体验入口可登录），可通过 APP_GUEST_LOGIN_BLACKLIST_PHONE 覆盖。
    blacklist-phone: ${APP_GUEST_LOGIN_BLACKLIST_PHONE:13900000000}
  security:
    # R4-00246/R4-01775 接线修复（2026-08-09）：real profile 此前未定义本属性，
    # 而 AesEncryptor 读取 app.security.aes-secret，导致文档所述的 APP_AES_SECRET
    # 环境变量在 real 环境不生效（启动 fail-fast「APP_AES_SECRET 未配置」）。
    # 此处补占位符接线（默认空 → 未配置仍 fail-fast，不引入公开兜底密钥）：
    # 通过 env APP_AES_SECRET（≥32 字符）或 --app.security.aes-secret=xxx 注入。
    aes-secret: ${APP_AES_SECRET:}
  ai:
    agnes:
      api-base: ${AGNES_API_BASE:}
  # ============ 微信支付 APIv3（2026-10-05 微信支付工程补齐） ============
  # 缺省安全：enabled 默认 false（封存态）——下单/支付回调/退款回调端点直接 404。
  # enabled=true 但缺任一必填项时启动 fail-fast（WxPayBootstrapChecker），拒绝半可用态。
  # 全部敏感项由环境变量注入，禁止硬编码；merchant-private-key / platform-cert
  # 支持「PEM 内容」或「PEM 文件路径」两种取值。
  wechat-pay:
    enabled: ${APP_WXPAY_ENABLED:false}
    app-id: ${APP_WXPAY_APPID:}
