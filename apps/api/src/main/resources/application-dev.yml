spring:
  profiles:
    # 引入 real 和 db profile，激活所有真实服务 + 数据库 + Flyway + Redis
    include: real,db
  # 以下为 dev profile 独有覆盖
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

# 日志级别调整为 DEBUG，便于开发调试
logging:
  level:
    com.campuslove: DEBUG
    org.springframework.security: DEBUG

# 开发模式下 CORS 全放行（本地调试用）
app:
  cors:
    allowed-origins: "*"
