spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      # mock 模式下不连接 Redis / RabbitMQ，避免开发环境依赖外部服务
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      # Redisson（redisson-spring-boot-starter 引入）：mock profile 下不连接 Redis，
      # 必须排除 RedissonAutoConfigurationV2，否则 healthEndpoint 链路尝试创建 RedissonClient
      # 并连接 127.0.0.1:6379，导致 ApplicationContext 加载失败。
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

app:
  # P0-14：mock（本地演示）profile 下体验账号入口默认开启，保证本地演示可用；
  # 商业化/生产环境默认关闭（application.yml 默认 false），可通过 APP_GUEST_LOGIN_ENABLED 覆盖。
  guest-login:
    enabled: ${APP_GUEST_LOGIN_ENABLED:true}
  # R4-00340：IP 归属演示网段表——mock（本地演示）profile 开启，
  # 生产（real）默认 false（演示数据不得冒充真实 IP 归属）。
  location:
    default-city: ${APP_LOCATION_DEFAULT_CITY:南京}
    demo-city-nets-enabled: ${APP_LOCATION_DEMO_CITY_NETS_ENABLED:true}
  jwt:
    # JWT 密钥由环境变量 JWT_SECRET 提供，启动时校验非空且长度 >= 32。
    # 本地开发可通过 start-server.bat 或 .env 文件配置 JWT_SECRET。
    # 生成安全密钥示例：openssl rand -base64 48
    secret: ${JWT_SECRET:}
  # CORS 允许的源列表：mock profile 下提供 localhost 默认值，
    # 便于本地开发（前端 dev server 通常运行在 5173/5174/5177 端口）。
    # 生产环境（real profile）由 application.yml 默认空，需通过 CORS_ALLOWED_ORIGINS 显式配置。
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5177,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5177}
  # WebSocket 允许的 Origin 模式：mock profile 下提供 localhost 默认值，
    # 便于本地开发联调；生产环境需通过 WEBSOCKET_ALLOWED_ORIGIN_PATTERNS 显式配置。
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  # OpenAPI 文档配置：mock profile 下提供 localhost 默认值，便于本地开发联调 Swagger UI。
  openapi:
    local-server-url: ${OPENAPI_LOCAL_SERVER_URL:http://localhost:8080}
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
  # Agnes AI 服务配置：mock profile 下提供默认 base URL（官方文档地址），
    # 避免 application.yml 中 api-base 默认值清空导致启动失败；
    # mock profile 下不会真正调用 AI 服务（RealAiVideoService 仅 real profile 激活）。
    # R4-01787：此默认值仅为 mock 启动兜底——mock 模式不发起真实 AI 调用，
    # 不会产生真实第三方请求；如需本地联调真实链路请显式配置 AGNES_API_BASE。
  ai:
    agnes:
      api-base: ${AGNES_API_BASE:https://api.agnes-ai.com/api}
      api-key: ${AGNES_API_KEY:}
  # R4-00246/R4-01775：AES 密钥——mock（本地演示）profile 提供开发用默认密钥，
  # 保证本地启动不依赖 APP_AES_SECRET。此密钥仅限本地演示（mock 数据为内存态，
  # 不存储真实用户数据），严禁用于生产；real（生产）profile 无任何默认值，
  # 未配置 APP_AES_SECRET 时启动直接拒绝（fail-fast，见 AesEncryptor.init()）。
  security:
    aes-secret: ${APP_AES_SECRET:mock-dev-aes-key-not-for-production-0123456789abcdef}
  # R4-00358：模拟校园认证端点开关——mock（本地演示）profile 默认开启
  # （DemoCertificationSimulateController 注册 /campus/certification/simulate）；
  # 生产（real）默认关闭，不在生产 API 面暴露演示残留端点。
  campus:
    certification-simulate-enabled: ${APP_CAMPUS_CERT_SIMULATE_ENABLED:true}
  # P0-15：演示充值开关——mock（本地演示）profile 下默认开启，保留本地演示充值能力；
  # 商业化/生产环境默认关闭（application.yml 默认 false，R4-00312），
  # 生产必须接入支付网关（微信支付/支付宝）+ 回调验签后入账。
  demo-recharge:
    enabled: ${APP_DEMO_RECHARGE_ENABLED:true}
    daily-limit: ${APP_DEMO_RECHARGE_DAILY_LIMIT:5}
