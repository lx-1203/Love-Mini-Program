openapi: 3.0.3
info:
  title: Campus Love - Check-in API
  version: 1.0.0
  description: |
    Daily check-in related endpoints exposed by `CheckInController`
    (`/api/v1/check-in`). All endpoints require a valid JWT bearer token
    unless explicitly marked as anonymous.
servers:
  - url: /api/v1
    description: Versioned API gateway prefix
tags:
  - name: check-in
    description: Daily check-in and make-up check-in operations
paths:
  /check-in:
    post:
      tags: [check-in]
      summary: Daily check-in
      description: Records today's check-in for the authenticated user. Idempotent.
      operationId: checkIn
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Check-in result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInViewApiResponse'
              example:
                code: 0
                message: ok
                data:
                  success: true
                  consecutiveDays: 5
                  extraQuota: 1
                  extraRecommendQuota: 3
                  hotTopicsUnlocked: true
                  newUsersUnlocked: true
                  hotTopicCount: 5
                  newUserCount: 10
                traceId: 'e2f4a1b0-0000-4000-8000-000000000006'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /check-in/status:
    get:
      tags: [check-in]
      summary: Get today's check-in status
      description: Returns whether the current user has checked in today and the consecutive day count.
      operationId: getCheckInStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Check-in status for today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInStatusViewApiResponse'
              example:
                code: 0
                message: ok
                data:
                  checkedInToday: true
                  consecutiveDays: 5
                  extraQuota: 1
                traceId: 'e2f4a1b0-0000-4000-8000-000000000007'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /check-in/make-up:
    post:
      tags: [check-in]
      summary: Make up a missed check-in
      description: |
        Allows the authenticated user to make up a missed check-in for a past
        date within the last 7 days. Limited to 3 make-ups per calendar month;
        first make-up is free, subsequent ones cost 50 growth points.
      operationId: makeUpCheckIn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeUpCheckInRequest'
            example:
              date: '2026-07-28'
      responses:
        '200':
          description: Make-up check-in result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MakeUpCheckInResultViewApiResponse'
              example:
                code: 0
                message: ok
                data:
                  success: true
                  checkInDate: '2026-07-28'
                  consecutiveDays: 5
                  usedMakeUpCount: 2
                  makeUpLimit: 3
                  costPoints: 50
                traceId: 'e2f4a1b0-0000-4000-8000-000000000008'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token issued by `/auth/wechat-login` or `/auth/refresh`.
  schemas:
    CheckInView:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the check-in operation succeeded
        consecutiveDays:
          type: integer
          minimum: 0
          description: Consecutive check-in days
        extraQuota:
          type: integer
          minimum: 0
          description: Extra swipe quota granted for checking in
        extraRecommendQuota:
          type: integer
          minimum: 0
          description: Extra daily recommendations granted for checking in
        hotTopicsUnlocked:
          type: boolean
          description: Whether hot topics were unlocked by this check-in
        newUsersUnlocked:
          type: boolean
          description: Whether new users were unlocked by this check-in
        hotTopicCount:
          type: integer
          minimum: 0
          description: Number of hot topics unlocked
        newUserCount:
          type: integer
          minimum: 0
          description: Number of new users unlocked
      required:
        - success
        - consecutiveDays
        - extraQuota
        - extraRecommendQuota
        - hotTopicsUnlocked
        - newUsersUnlocked
        - hotTopicCount
        - newUserCount
    CheckInStatusView:
      type: object
      properties:
        checkedInToday:
          type: boolean
          description: Whether user has checked in today
        consecutiveDays:
          type: integer
          minimum: 0
          description: Consecutive check-in days (0 if not checked in today)
        extraQuota:
          type: integer
          minimum: 0
          description: Extra swipe quota granted by today's check-in
      required:
        - checkedInToday
        - consecutiveDays
        - extraQuota
    MakeUpCheckInRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Target make-up date (yyyy-MM-dd), must be within the past 7 days (excluding today).
      required:
        - date
    MakeUpCheckInResultView:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the make-up operation succeeded
        checkInDate:
          type: string
          format: date
          description: Date that was successfully made up
        consecutiveDays:
          type: integer
          minimum: 0
          description: Updated consecutive check-in day count
        usedMakeUpCount:
          type: integer
          minimum: 0
          description: Make-up operations used in the current calendar month
        makeUpLimit:
          type: integer
          minimum: 0
          description: Maximum make-up operations allowed per calendar month
        costPoints:
          type: integer
          minimum: 0
          description: Growth points consumed for this make-up (0 if first free make-up)
      required:
        - success
        - checkInDate
        - consecutiveDays
        - usedMakeUpCount
        - makeUpLimit
        - costPoints
    # ---- R17 契约对齐：CheckInController 三端点均返回 ApiResponse.ok(...) 统一信封
    # （CheckInController.java:38/48/82，common/ApiResponse.java:34），原 yaml 把响应
    # 体建模为裸载荷；信封写法对齐 feedback-growth-and-auth.yaml 的
    # EmptyApiResponse / UserDeviceSessionListApiResponse。
    CheckInViewApiResponse:
      type: object
      description: '`ApiResponse<CheckInView>` 统一信封（POST /check-in）。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/CheckInView'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    CheckInStatusViewApiResponse:
      type: object
      description: '`ApiResponse<CheckInStatusView>` 统一信封（GET /check-in/status）。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/CheckInStatusView'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    MakeUpCheckInResultViewApiResponse:
      type: object
      description: '`ApiResponse<MakeUpCheckInResultView>` 统一信封（POST /check-in/make-up）。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/MakeUpCheckInResultView'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code (e.g., `BAD_REQUEST`, `UNAUTHORIZED`).
        message:
          type: string
          description: Human-readable error message.
      required:
        - error
        - message
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: BAD_REQUEST
            message: 'Invalid make-up date: date must be within the past 7 days.'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: UNAUTHORIZED
            message: 'Missing or invalid bearer token.'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: INTERNAL_ERROR
            message: 'Unexpected server error.'
