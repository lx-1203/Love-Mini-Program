openapi: 3.0.3
info:
  title: Campus Love - Recommendations API
  version: 1.0.0
servers:
  # RecommendationController 的 @RequestMapping 是 /api/v1
  - url: /api/v1
    description: Versioned API gateway prefix
paths:
  /daily-question/today:
    get:
      summary: Get today's daily question
      operationId: getTodayQuestion
      responses:
        '200':
          description: Today's question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyQuestionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /daily-question/answer:
    post:
      summary: Submit an answer to the daily question
      operationId: submitDailyAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyAnswerRequest'
      responses:
        '200':
          description: Answer submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAnswerView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /daily-question/answers:
    get:
      summary: Get answers for a daily question
      operationId: getDailyAnswers
      parameters:
        - in: query
          name: questionId
          required: true
          schema:
            type: integer
            format: int64
          description: The question ID
      responses:
        '200':
          description: List of answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyAnswerView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ---- 修复（R4-00163 / R4-00344）：契约对齐真实 RecommendationController ----
  # 历史文档化的 /recommendations/cards、/cards/{id}/pass、/cards/{id}/like、
  # /cards/history 端点在实现中不存在（按契约接入的前端全部 404），已移除。
  # 实际端点见下（apps/api/.../discover/RecommendationController.java）。
  /recommendations:
    get:
      summary: Get recommended people list (with filters)
      description: |
        Alias of /recommendations/people. Returns the current user's
        recommendation candidates filtered by the optional query params.
        Whisper text is intentionally NOT included in list responses
        (server-side paid content is served by /recommendations/{userId}/whisper).
      operationId: getRecommendations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: heightMin
          required: false
          schema:
            type: integer
        - in: query
          name: heightMax
          required: false
          schema:
            type: integer
        - in: query
          name: educationLevel
          required: false
          schema:
            type: string
        - in: query
          name: relationshipStatus
          required: false
          schema:
            type: string
        - in: query
          name: hometownProvince
          required: false
          schema:
            type: string
        - in: query
          name: hometownCity
          required: false
          schema:
            type: string
        - in: query
          name: futureCity
          required: false
          schema:
            type: string
        - in: query
          name: keyword
          required: false
          schema:
            type: string
        - in: query
          name: ageMin
          required: false
          schema:
            type: integer
          description: Minimum age filter (R4-00163)
        - in: query
          name: ageMax
          required: false
          schema:
            type: integer
          description: Maximum age filter (R4-00163)
        - in: query
          name: onlineOnly
          required: false
          schema:
            type: boolean
          description: v3.1 online quick-match — keep only candidates active right now
      responses:
        '200':
          description: List of recommended people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendedPersonView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recommendations/quota:
    get:
      summary: Get today's recommendation quota usage
      description: |
        Returns {dailyLimit, used, remaining} so the client can distinguish
        "quota exhausted today" from "no recommendations available".
        Mock / service-missing mode returns -1 (unlimited semantics).
      operationId: getRecommendationQuota
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quota usage
          content:
            application/json:
              schema:
                type: object
              example:
                dailyLimit: 10
                used: 3
                remaining: 7
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recommendations/discussions:
    get:
      summary: Get discussion recommendations
      description: Hot/interest-matched discussions for the home "discussions" module.
      operationId: getDiscussions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Discussion recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscussionRecommendationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recommendations/activities:
    get:
      summary: Get activity recommendations
      description: Recommended activities for the home "activity" module.
      operationId: getActivities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Activity recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityRecommendationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recommendations/history:
    get:
      summary: Get recommendation history
      description: |
        People the current user has already swiped (liked / passed), returned as
        RecommendedPersonView list (JWT-scoped, no query params).
      operationId: getHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recommendation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendedPersonView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recommendations/preferences/me:
    get:
      summary: Get current user recommendation preferences
      operationId: getPreferencesByUserId
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User recommendation preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Save current user recommendation preferences
      operationId: savePreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationPreferences'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recommendations/preferences:
    get:
      summary: Get recommendation preferences
      operationId: getRecommendationPreferences
      responses:
        '200':
          description: User recommendation preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update recommendation preferences
      operationId: updateRecommendationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationPreferences'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /activities/{id}/enroll:
    post:
      # ---- R17 契约对齐：后端不收 body（ActivityController.java:85-91，无
      # @RequestBody 参数），原「必填 body {enrolled:bool}」是文档臆造，删除。 ----
      summary: Enroll in an activity
      operationId: enrollActivity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Activity ID
      responses:
        '200':
          description: Enrollment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEnrollmentApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    # ---- R17 契约对齐：取消报名端点补记（ActivityController.java:100-106 已存在，
    # POST / DELETE 成对出现；此前 yaml 只记了带 body 的 POST——三重漂移） ----
    delete:
      summary: Cancel enrollment for an activity
      operationId: cancelActivityEnrollment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Activity ID
      responses:
        '200':
          description: Cancel-enrollment result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEnrollmentApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /activities/{id}:
    get:
      summary: Get activity detail
      operationId: getActivityDetail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Activity ID
      responses:
        '200':
          description: Activity detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDetailView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ---- R4-00314：悄悄话解锁链路（付费可见内容服务端保护） ----
  # 悄悄话文案不再随推荐列表下发（列表 whisper 恒为 null），
  # 由以下端点按解锁状态返回。
  /recommendations/{userId}/whisper:
    get:
      summary: Get whisper (paid content) for a user
      description: |
        Returns the whisper opening line for the target user only when the
        current user has unlocked messaging/whisper for them (a MESSAGE_UNLOCK
        or WHISPER_UNLOCK wallet transaction exists). Otherwise returns
        `unlocked=false` with `whispers=[]` — paid content is never leaked.
      operationId: getWhisper
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Target user ID.
      responses:
        '200':
          description: Whisper view (unlocked=false when not unlocked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperUnlockView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Unlock and get whisper for a user
      description: |
        Idempotently unlocks the whisper for the target user (server-side price
        `app.unlock-price.whisper`, default 200 cents; orderId
        `UNLOCK-WHISPER-{userId}` deduped by the wallet order_id unique index)
        and returns the whisper content.
      operationId: unlockWhisper
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Target user ID.
      responses:
        '200':
          description: Whisper view (unlocked=true with content after charge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperUnlockView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Insufficient wallet balance (INSUFFICIENT_BALANCE)
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WhisperUnlockView:
      type: object
      description: |
        Whisper view (R4-00314, 2026-08-14 改为多条文案). `whispers` is only
        populated when `unlocked=true` — the list mirrors
        RecommendationController.java `record WhisperUnlockView(unlocked,
        whispers, balanceCents)`.
      properties:
        unlocked:
          type: boolean
        # ---- R17 契约对齐：字段名漂移修复——后端 record 与客户端
        # services/api.ts:1215 均为 whispers（复数 List<String>），原 yaml
        # 写成 whisper（单数 string）。 ----
        whispers:
          type: array
          description: Whisper copy lines (empty list when not unlocked — paid content never leaks)
          items:
            type: string
        balanceCents:
          type: integer
          format: int64
          nullable: true
      required:
        - unlocked
    # ---- 修复（R4-00163 / R4-00344）：schema 对齐真实 RecommendedPersonView ----
    RecommendedPersonView:
      type: object
      description: |
        Recommendation candidate view (apps/api/.../discover/RecommendedPersonView.java).
        `whisper` is only populated via the dedicated unlock endpoint, never in list payloads.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        initials:
          type: string
        headline:
          type: string
        commonGround:
          type: string
        availability:
          type: string
        campusName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        bio:
          type: string
        images:
          type: array
          items:
            type: string
        isSameSchool:
          type: boolean
        isSameMajor:
          type: boolean
        commonCircleCount:
          type: integer
        height:
          type: integer
          nullable: true
        educationLevel:
          type: string
        photoGallery:
          type: array
          items:
            type: string
        halfBodyPhotoUrl:
          type: string
          nullable: true
        gradeLabel:
          type: string
          nullable: true
        verificationBadgeLevel:
          type: string
        displayId:
          type: string
        distanceText:
          type: string
        activeStatusText:
          type: string
        machineVerified:
          type: boolean
        humanVerified:
          type: boolean
        personality:
          type: array
          items:
            type: string
        mbti:
          type: string
        whisper:
          type: string
          nullable: true
          description: Always null in list responses (paid content, see whisper unlock endpoints)
        whisperSent:
          type: boolean
        recentPosts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              content:
                type: string
              likes:
                type: integer
              comments:
                type: integer
              isLiked:
                type: boolean
              createdAt:
                type: string
                format: date-time
        expectedPartner:
          type: string
        allowMessage:
          type: boolean
        ipLocation:
          type: string
        occupation:
          type: string
        age:
          type: integer
          nullable: true
        registeredAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - headline
        - campusName
    DiscussionRecommendationView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        heatLabel:
          type: string
      required:
        - id
        - title
        - summary
        - heatLabel
    ActivityRecommendationView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        location:
          type: string
        scheduleText:
          type: string
        description:
          type: string
        enrollmentCount:
          type: integer
        participantAvatars:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - location
        - scheduleText
        - description
        - enrollmentCount
        - participantAvatars
    RecommendationPreferences:
      type: object
      properties:
        dailyNotifyTime:
          type: string
          description: Daily recommendation notification time (e.g., "10:00", "12:00", "14:00", "18:00")
          default: "12:00"
        scope:
          type: string
          description: Recommendation scope
          enum:
            - campus_first
            - city
            - unlimited
          default: campus_first
        campusPriority:
          type: boolean
          description: Campus-first sorting flag (same-school users ranked first)
      required:
        - dailyNotifyTime
        - scope
    DailyQuestionView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        questionText:
          type: string
        answerCount:
          type: integer
          minimum: 0
        answered:
          type: boolean
      required:
        - id
        - questionText
        - answerCount
        - answered
    DailyAnswerRequest:
      type: object
      properties:
        questionId:
          type: integer
          format: int64
        content:
          type: string
        isAnonymous:
          type: boolean
          default: false
      required:
        - questionId
        - content
    DailyAnswerAuthor:
      type: object
      properties:
        displayName:
          type: string
        campusName:
          type: string
      required:
        - displayName
        - campusName
    DailyAnswerView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        questionId:
          type: integer
          format: int64
        content:
          type: string
        isAnonymous:
          type: boolean
        createdAt:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/DailyAnswerAuthor'
      required:
        - id
        - questionId
        - content
        - isAnonymous
        - createdAt
        - author
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
    # EnrollRequest 已删除（R17）：后端报名接口不收请求体
    # （ActivityController.java:85-91 无 @RequestBody 参数），该 schema 是文档臆造的死契约。
    ActivityEnrollmentResultView:
      type: object
      description: |
        报名/取消报名操作结果（镜像 ActivityEnrollmentResultView.java：
        activityId 为 int64，非原 yaml 臆造的 string）。
      properties:
        activityId:
          type: integer
          format: int64
        enrolled:
          type: boolean
        enrollmentCount:
          type: integer
          minimum: 0
      required:
        - activityId
        - enrolled
        - enrollmentCount
    ActivityEnrollmentApiResponse:
      type: object
      description: |
        `ApiResponse<ActivityEnrollmentResultView>` 统一信封（ActivityController
        返回 `ApiResponse.ok(...)`）：`code` 为 0 表示成功，`traceId` 与
        `X-Trace-Id` 响应头一致。
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/ActivityEnrollmentResultView'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    ActivityDetailView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        location:
          type: string
        scheduleText:
          type: string
        description:
          type: string
        enrollmentCount:
          type: integer
          minimum: 0
        participantAvatars:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - location
        - scheduleText
        - description
        - enrollmentCount
        - participantAvatars
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'