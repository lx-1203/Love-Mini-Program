openapi: 3.0.1
info:
  title: Whispers API (v3.1 付费悄悄话)
  version: v1
  description: |
    悄悄话（付费留言）模块。同一对用户 A↔B 最多 1 条有效；发送者每日 ≤5 条；
    幂等 clientRequestId；钱包扣费与创建同事务，创建失败自动退款（REFUNDED）。
    文案承诺：优先送达 / 直接进入 TA 的悄悄话。
servers:
  # WhisperController 的 @RequestMapping 是 /api/v1/whispers，本文件此前没有 servers。
  - url: /api/v1
    description: Versioned API gateway prefix
paths:
  /whispers/send:
    post:
      summary: Send a paid whisper
      operationId: sendWhisper
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhisperSendRequest'
      responses:
        '200':
          description: Whisper sent (idempotent by clientRequestId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperMessageViewApiResponse'
        '400':
          description: Validation / business rule violation (balance, daily limit, pair limit)
  /whispers/inbox:
    get:
      summary: List received whispers
      operationId: getWhisperInbox
      security:
        - bearerAuth: []
      parameters:
        # R8（2026-11-04）可选分页：size 缺省全量（向后兼容）；size 有值 clamp 到 [1,100]
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Received whispers (sender profile fields filled, nullable when missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperMessageListApiResponse'
  /whispers/sent:
    get:
      summary: List sent whispers
      operationId: getWhisperSent
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Sent whispers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperMessageListApiResponse'
  /whispers/unread-count:
    get:
      summary: Count unread received whispers
      description: |
        R9-b（2026-11-05）：收件人未读数（消息页「悄悄话」入口徽标数据源）。
        口径与收件箱可见性一致：SENT/DELIVERED 计未读；PAY_FAILED/REFUNDED
        审计行不计（R5-1 起不进入收件人视角）。
      operationId: getWhisperUnreadCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperUnreadCountApiResponse'
  /whispers/{id}/read:
    post:
      summary: Mark a received whisper as read
      operationId: readWhisper
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated whisper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperMessageViewApiResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WhisperSendRequest:
      type: object
      required:
        - receiverId
        - content
        - clientRequestId
      properties:
        receiverId:
          type: integer
          format: int64
        content:
          type: string
          maxLength: 60
        clientRequestId:
          type: string
          maxLength: 64
    WhisperMessageView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
        content:
          type: string
        status:
          type: string
          enum: [SENT, DELIVERED, READ, PAY_FAILED, REFUNDED]
        priceCents:
          type: integer
          format: int64
        createdAt:
          type: string
        readAt:
          type: string
          nullable: true
        # R8（2026-11-04）：发送者资料（inbox/sent 批量填充；注销/缺失为 null，客户端兜底「神秘访客」）
        senderNickname:
          type: string
          nullable: true
        senderAvatar:
          type: string
          nullable: true
    # ---- R17 契约对齐：WhisperController 各端点均返回 ApiResponse.ok(...) 统一信封
    # （WhisperController.java:34/45/55/68/75），原 yaml 把响应体建模为裸载荷；
    # 信封写法对齐 feedback-growth-and-auth.yaml 的 EmptyApiResponse /
    # UserDeviceSessionListApiResponse（ApiResponse.java:34：code/message/data/traceId）。
    # 客户端 services/http.ts 的信封解包拦截器以 code===0 判成功并解包 data。
    WhisperMessageViewApiResponse:
      type: object
      description: '`ApiResponse<WhisperMessageView>` 统一信封（send / {id}/read 端点）。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/WhisperMessageView'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    WhisperMessageListApiResponse:
      type: object
      description: '`ApiResponse<List<WhisperMessageView>>` 统一信封（inbox / sent 端点）。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          type: array
          items:
            $ref: '#/components/schemas/WhisperMessageView'
          description: 当前页列表；无数据时为空数组。
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    WhisperUnreadCountApiResponse:
      type: object
      description: '`ApiResponse<Long>` 统一信封（unread-count 端点）。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          type: integer
          format: int64
          description: 收件人未读悄悄话数。
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
