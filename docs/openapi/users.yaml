openapi: 3.0.3
info:
  title: Campus Love - Users API
  version: 1.0.0
  description: |
    User follow graph and online-status endpoints exposed by `UserController`
    (`/api/v1/users`). All endpoints require a valid JWT bearer token.
servers:
  - url: /api/v1
    description: Versioned API gateway prefix
tags:
  - name: users
    description: User follow relationships and online status
paths:
  /users/{id}/follow:
    post:
      tags: [users]
      summary: Follow a user
      description: |
        Authenticated user follows the target user. Idempotent — repeated
        calls produce the same follow relationship without creating duplicates.
      operationId: followUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Target user ID to follow (must be positive).
      responses:
        '200':
          description: Follow action successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowViewApiResponse'
              example:
                code: 0
                message: ok
                data:
                  success: true
                  userId: 1024
                  following: true
                  followerCount: 18
                  followingCount: 5
                traceId: 'e2f4a1b0-0000-4000-8000-000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [users]
      summary: Unfollow a user
      description: Removes the follow relationship between the current user and the target user. Idempotent.
      operationId: unfollowUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Target user ID to unfollow (must be positive).
      responses:
        '200':
          description: Unfollow action successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowViewApiResponse'
              example:
                code: 0
                message: ok
                data:
                  success: true
                  userId: 1024
                  following: false
                  followerCount: 17
                  followingCount: 4
                traceId: 'e2f4a1b0-0000-4000-8000-000000000002'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{id}/followers:
    get:
      tags: [users]
      summary: Get a user's follower list
      description: Returns the list of users following the specified user.
      operationId: getFollowers
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: User ID (must be positive).
        # ---- R17 契约对齐：后端加分页（UserController.java:87-93，R4-00302），
        # page 默认 0 / size 默认 20（@Max(200)）。
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number starting from 0.
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          description: Items per page (max 200).
      responses:
        '200':
          description: Follower list (current page)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUserViewListApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{id}/following:
    get:
      tags: [users]
      summary: Get a user's following list
      description: Returns the list of users that the specified user is following.
      operationId: getFollowing
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: User ID (must be positive).
        # ---- R17 契约对齐：后端加分页（UserController.java:104-110），口径同 followers。
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number starting from 0.
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          description: Items per page (max 200).
      responses:
        '200':
          description: Following list (current page)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUserViewListApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{id}/is-following:
    get:
      tags: [users]
      summary: Check if the current user follows the target user
      description: Returns a boolean indicating whether the authenticated user follows the target user.
      operationId: isFollowing
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Target user ID (must be positive).
      responses:
        '200':
          description: Follow status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsFollowingViewApiResponse'
              example:
                code: 0
                message: ok
                data:
                  isFollowing: true
                traceId: 'e2f4a1b0-0000-4000-8000-000000000003'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}/online-status:
    get:
      tags: [users]
      summary: Get a user's online status
      description: Returns whether the target user is currently online and the last active timestamp.
      operationId: getOnlineStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Target user ID (must be positive).
      responses:
        '200':
          description: Online status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineStatusViewApiResponse'
              example:
                code: 0
                message: ok
                data:
                  userId: 1024
                  status: online
                  lastHeartbeat: '2026-07-29T08:00:00Z'
                  deviceType: mini-program
                traceId: 'e2f4a1b0-0000-4000-8000-000000000004'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/online-status/batch:
    post:
      tags: [users]
      summary: Batch get online status for multiple users
      description: |
        Returns a map of user ID to online status. Limited to 500 user IDs
        per request.
      operationId: batchGetOnlineStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchOnlineStatusRequest'
            example:
              userIds: [1024, 1025, 1026]
      responses:
        '200':
          description: Map of user ID to online status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineStatusMapApiResponse'
              example:
                code: 0
                message: ok
                data:
                  '1024':
                    userId: 1024
                    status: online
                    lastHeartbeat: '2026-07-29T08:00:00Z'
                    deviceType: mini-program
                  '1025':
                    userId: 1025
                    status: offline
                    lastHeartbeat: '2026-07-28T22:30:00Z'
                    deviceType: web
                traceId: 'e2f4a1b0-0000-4000-8000-000000000005'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /search/users:
    get:
      summary: Search users by nickname / campus
      operationId: searchUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: keyword
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 20
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Search result page (Spring `Page<UserSearchView>` JSON inside ApiResponse envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchPageApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token issued by `/auth/wechat-login` or `/auth/refresh`.
  schemas:
    UserSearchView:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
        avatarUrl:
          type: string
        campusName:
          type: string
        bio:
          type: string
    # ---- R17 契约对齐：本文件各端点均为 UserController / UserSearchController 的
    # `ApiResponse.ok(...)` 统一信封（common/ApiResponse.java:34），原 yaml 把响应
    # 体建模为裸载荷。信封写法对齐 feedback-growth-and-auth.yaml 的
    # EmptyApiResponse / UserDeviceSessionListApiResponse。
    FollowViewApiResponse:
      type: object
      description: '`ApiResponse<FollowView>` 统一信封：`code` 为 0 表示成功。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/FollowView'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    FollowUserViewListApiResponse:
      type: object
      description: '`ApiResponse<List<FollowUserView>>` 统一信封：`data` 为当前页的粉丝/关注列表。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          type: array
          items:
            $ref: '#/components/schemas/FollowUserView'
          description: 当前页列表；无数据时为空数组。
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    IsFollowingViewApiResponse:
      type: object
      description: '`ApiResponse<IsFollowingView>` 统一信封。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/IsFollowingView'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    OnlineStatusViewApiResponse:
      type: object
      description: '`ApiResponse<OnlineStatusView>` 统一信封。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/OnlineStatusView'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    OnlineStatusMapApiResponse:
      type: object
      description: |
        `ApiResponse<Map<String, OnlineStatusView>>` 统一信封：`data` 以用户 ID
        字符串为键的在线状态映射。
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OnlineStatusView'
          description: 用户 ID → 在线状态映射。
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    UserSearchPage:
      type: object
      description: |
        Spring `Page<UserSearchView>` 的 JSON 形态（UserSearchController.java:51
        经 `ApiResponse.ok` 包信封后 `data` 的内层结构：content 数组 +
        totalElements/totalPages/number/size）。
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserSearchView'
          description: 当前页搜索结果。
        totalElements:
          type: integer
          format: int64
          description: 结果总数。
        totalPages:
          type: integer
          description: 总页数。
        number:
          type: integer
          description: 当前页码（从 0 开始）。
        size:
          type: integer
          description: 每页条数。
      required:
        - content
        - totalElements
        - totalPages
        - number
        - size
    UserSearchPageApiResponse:
      type: object
      description: '`ApiResponse<Page<UserSearchView>>` 统一信封（UserSearchController.java:48-58）。'
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          $ref: '#/components/schemas/UserSearchPage'
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
    FollowView:
      type: object
      properties:
        success:
          type: boolean
        userId:
          type: integer
          format: int64
          description: Target user ID of the follow action.
        following:
          type: boolean
          description: Current follow status after the action.
        followerCount:
          type: integer
          minimum: 0
          description: Target user's follower count after the action.
        followingCount:
          type: integer
          minimum: 0
          description: Current user's following count after the action.
      required:
        - success
        - userId
        - following
        - followerCount
        - followingCount
    FollowUserView:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        followingCount:
          type: integer
          minimum: 0
        followersCount:
          type: integer
          minimum: 0
      required:
        - userId
        - nickname
        - followingCount
        - followersCount
    IsFollowingView:
      type: object
      properties:
        isFollowing:
          type: boolean
          description: Whether the current user follows the target user.
      required:
        - isFollowing
    OnlineStatusView:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        status:
          type: string
          enum: [online, offline, away]
          description: User's current online status.
        lastHeartbeat:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the user's last heartbeat (null if never active).
        deviceType:
          type: string
          nullable: true
          description: Device type reported by the client (e.g., web, h5, mini-program).
      required:
        - userId
        - status
    BatchOnlineStatusRequest:
      type: object
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer
            format: int64
            minimum: 1
          description: List of user IDs to query (1-500 per request).
      required:
        - userIds
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
      required:
        - error
        - message
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: BAD_REQUEST
            message: 'User ID must be positive.'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: UNAUTHORIZED
            message: 'Missing or invalid bearer token.'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: NOT_FOUND
            message: 'Target user not found.'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: INTERNAL_ERROR
            message: 'Unexpected server error.'
