components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token issued by `/auth/wechat-login` or `/auth/refresh`.
  schemas:
    LoginHeroConfig:
      type: object
      properties:
        heroMode:
          type: string
          enum: [animation, video]
        heroVideoUrl:
          type: string
          nullable: true
        heroPosterUrl:
          type: string
          nullable: true
        heroAnimationTheme:
          type: string
        heroTitle:
          type: string
        heroSubtitle:
          type: string
        videoFallbackToAnimation:
          type: boolean
      required:
        - heroMode
        - heroAnimationTheme
        - heroTitle
        - heroSubtitle
        - videoFallbackToAnimation
    UserSession:
      type: object
      properties:
        userId:
          type: string
        loggedIn:
          type: boolean
        loginMethod:
          type: string
          enum: [wechat, phone, admin]
        displayName:
          type: string
        phoneBound:
          type: boolean
        profileCompleted:
          type: boolean
        campusVerified:
          type: boolean
        scheduleCompleted:
          type: boolean
        campusName:
          type: string
          nullable: true
        schoolBound:
          type: boolean
          description: 校园认证绑定（收尾轮：认证+一次性绑定后为 true，绑定锁定；前端 home 选择器消费）
        schoolId:
          type: string
          nullable: true
          description: 绑定学校 ID（= campusName，供首页选择器回显）
        featureFlags:
          type: object
          additionalProperties:
            type: boolean
      required:
        - userId
        - loggedIn
        - loginMethod
        - displayName
        - phoneBound
        - profileCompleted
        - campusVerified
        - scheduleCompleted
        - featureFlags
    UserSessionApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
