    # ===== Account security schemas (AccountSecurityController) =====
    ChangePasswordRequest:
      type: object
      description: |
        修改密码请求体，字段与 Bean Validation 注解逐一对应
        （`AccountSecurityController` 文件内 record `ChangePasswordRequest`）。
      properties:
        oldPassword:
          type: string
          minLength: 1
          maxLength: 128
          description: 旧密码（`@NotBlank` + `@Size(max = 128)`）。
        newPassword:
          type: string
          minLength: 6
          maxLength: 64
          description: 新密码（`@NotBlank` + `@Size(min = 6, max = 64)`，长度须为 6-64 位）。
      required:
        - oldPassword
        - newPassword
    ChangePhoneRequest:
      type: object
      description: |
        更换手机号请求体（record `ChangePhoneRequest`）。本期只消费 `password` + `newPhone`，
        `verificationCode` 为预留字段（无校验注解、服务端不读取）。
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 64
          description: 旧密码（`@NotBlank` + `@Size(max = 64)`）；本期「验旧密码」路径必填。
        verificationCode:
          type: string
          description: 短信验证码预留字段（无 `@NotBlank` / `@Size` / `@Pattern` 约束，可选）。
        newPhone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          description: 新手机号（`@NotBlank` + `@Pattern(regexp = '^1[3-9]\\d{9}$')`，1[3-9] 开头的 11 位号码）。
      required:
        - password
        - newPhone
    DeactivateRequest:
      type: object
      description: |
        注销账号请求体（record `DeactivateRequest`）。两个字段都只带 `@Size`、无 `@NotBlank`，
        必填性由服务端按账号是否有密码分叉校验：有密码账号必须传匹配的 `password`，
        无密码账号必须传非空 `confirmationText`。
      properties:
        password:
          type: string
          maxLength: 128
          description: 旧密码（`@Size(max = 128)`）；有密码账号必填，错误返回 403。
        confirmationText:
          type: string
          maxLength: 64
          description: |
            注销确认文本（`@Size(max = 64)`，注解复用了 `NICKNAME_LENGTH_INVALID` 的错误文案）；
            无密码账号（纯 wechat / apple 注册）必填，缺失返回 403 +「注销确认文本不能为空」。
    UserDeviceSessionView:
      type: object
      description: |
        登录设备会话视图（record `UserDeviceSessionView`，GET `/auth/devices` 响应项）。
        字段非空性取自实体 `UserDeviceSession` 的 `@Column(nullable = false)` 列。
      properties:
        id:
          type: integer
          format: int64
          description: 设备记录 ID（POST `/auth/devices/{id}/revoke` 的路径参数）。
        deviceId:
          type: string
          maxLength: 128
          description: 客户端设备标识（实体列 `device_id`，非空，长度 128）。
        platform:
          type: string
          maxLength: 32
          description: |
            登录平台：登录时写入 `wechat` / `phone` / `guest`（`RealAuthService`、`MockAuthService`）、
            `apple`（`ThirdPartyAuthService` 以 `provider.toLowerCase()` 写入）；
            传入空值时服务端兜底为 `unknown`（实体列默认值，非空，长度 32）。
        lastActiveAt:
          type: string
          format: date-time
          description: 最近活跃时间（实体列 `last_active_at` 非空）。
        revoked:
          type: boolean
          description: 是否已被吊销（实体列非空，默认 false；前端置灰展示）。
        createdAt:
          type: string
          format: date-time
          description: 首次登录时间（实体列 `created_at` 非空）。
      required:
        - id
        - deviceId
        - platform
        - lastActiveAt
        - revoked
        - createdAt
    EmptyApiResponse:
      type: object
      description: |
        `ApiResponse<Void>` 统一信封（`ApiResponse.empty()`）：`code` 为 0、`message` 为 `ok`、
        `data` 恒为 null、`traceId` 取自 MDC。客户端 `services/http.ts` 以 `code === 0` 判成功并解包 `data`。
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          type: object
          nullable: true
          description: 载荷为 null（泛型参数为 Void）。
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - traceId
    UserDeviceSessionListApiResponse:
      type: object
      description: |
        `ApiResponse<List<UserDeviceSessionView>>` 统一信封：`code` 为 0 表示成功，
        `data` 为当前用户的设备列表（按 `lastActiveAt` 倒序，含已吊销设备）。
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功（`ApiResponse.SUCCESS_CODE`）。
        message:
          type: string
          description: 人类可读消息，成功时为 `ok`（`ApiResponse.SUCCESS_MESSAGE`）。
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDeviceSessionView'
          description: 设备列表；无设备时为空数组。
        traceId:
          type: string
          description: 请求追踪 ID，与 `X-Trace-Id` 响应头一致；MDC 无值时为空字符串。
      required:
        - code
        - message
        - data
        - traceId
