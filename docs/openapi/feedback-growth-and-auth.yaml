openapi: 3.0.3
info:
  title: Campus Love - Auth / Profile / Home / Chat / Feedback API
  version: 1.0.0
  description: |
    Core authentication, profile editing, home dashboard, temporary chat
    sessions, feedback submissions, and admin feedback endpoints. Exposed by
    `AuthController`, `AccountSecurityController`, `ProfileController`, `HomeController`,
    `ChatController`, `TempChatController`, `RecommendationController` (discussion/activity),
    `FeedbackController`, and admin feedback controllers. All endpoints
    require a valid JWT bearer token unless explicitly marked anonymous.
servers:
  - url: /api/v1
    description: Versioned API gateway prefix
tags:
  - name: auth
    description: Authentication endpoints (WeChat login, refresh, logout, admin login, account security)
  - name: profile
    description: User profile editing (basic, campus, schedule, photos, video, etc.)
  - name: home
    description: Home dashboard payload
  - name: chat
    description: Chat overview and temporary chat sessions
  - name: recommendations
    description: Discussion and activity recommendations
  - name: feedback
    description: User feedback submissions and admin feedback operations
  - name: admin
    description: Admin-only feedback and proposal conversion operations
  - name: debug
    description: Local QA debug endpoints (mock match status and error simulation)
paths:
  /app-config/login-hero:
    get:
      tags: [home]
      summary: Get login hero configuration
      description: Returns the login page hero block configuration (animation or video mode, poster, theme, copy).
      operationId: getLoginHeroConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Login hero config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginHeroConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/me:
    get:
      tags: [auth]
      summary: Get current session
      description: Validates the Bearer token and returns the current user session view.
      operationId: getCurrentSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/wechat-login:
    post:
      tags: [auth]
      summary: Exchange a WeChat login code for a session
      description: |
        Receives the WeChat mini-program login code, calls `code2session` to
        resolve the openId, and issues a JWT. Rate-limited to 10 bucket
        capacity / 1 token every 10 seconds per IP.
      operationId: loginWithWechat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
            example:
              code: '0a1b2c3d4e5f'
      responses:
        '200':
          description: Logged-in session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh JWT token
      description: |
        Validates the existing Bearer token and returns a fresh JWT. Rate-limited
        to 20 bucket capacity / 1 token every 2 seconds per IP. Idempotent.
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Refreshed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      description: Adds the current Bearer token to a Redis blacklist so subsequent requests with the same token return 401.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/admin/login:
    post:
      tags: [auth]
      summary: Admin username/password login
      description: Authenticates an admin account and returns a JWT with the ADMIN role. Idempotent.
      operationId: loginAsAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
            example:
              username: 'admin'
              password: '********'
      responses:
        '200':
          description: Admin session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/admin/logout:
    post:
      tags: [auth]
      summary: Admin logout
      description: Same semantics as `/auth/logout`, with additional audit logging for admin sessions.
      operationId: logoutAsAdmin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/change-password:
    post:
      tags: [auth]
      summary: 修改密码
      description: |
        校验旧密码后更新密码，并吊销该用户全部 token 强制重新登录。

        需 `ROLE_USER`（`@PreAuthorize("hasRole('USER')")`）；userId 由服务端从 JWT 解析
        （`SecurityUtils.getCurrentUserId()`），不接受 query / body 传入。成功后当前请求携带的
        Bearer token 的 jti 一并写入 Redis 黑名单，调用方必须重新登录。
        无密码账号（纯 wechat / apple 注册）返回 403 + `PASSWORD_NOT_SET`；
        旧密码错误返回 403 + `OPERATION_FORBIDDEN`；用户不存在返回 404 + `RESOURCE_NOT_FOUND`。
      operationId: changePassword
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            幂等键（UUID 或业务唯一标识）。方法带 `@Idempotent` 且 `required` 默认 true，
            缺失时返回 422 + `INVALID_OPERATION`；服务端按 `idempotent:{key}:{userId}` 去重，
            TTL 4 小时，TTL 内重复提交同一 key 返回 409 + `IDEMPOTENT_CONFLICT`；
            业务失败（HTTP 状态 >= 400）时该 key 被释放，同 key 可立即重试。
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功（无数据载荷）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/change-phone:
    post:
      tags: [auth]
      summary: 更换手机号
      description: |
        验旧密码后更换手机号；新手机号被占用返回业务冲突错误。verificationCode 字段预留（后续短信验证）

        本期只走「验旧密码」路径（`password` 必填）：无密码账号 403 + `PASSWORD_NOT_SET`、
        旧密码错误 403 + `OPERATION_FORBIDDEN`、新手机号已被占用 409 + `RESOURCE_CONFLICT`、
        用户不存在 404 + `RESOURCE_NOT_FOUND`。成功仅更新手机号（加密存储）与 `openid` 派生键，
        不吊销 token。`verificationCode` 服务端当前不消费。
      operationId: changePhone
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            幂等键（UUID 或业务唯一标识）。方法带 `@Idempotent` 且 `required` 默认 true，
            缺失时返回 422 + `INVALID_OPERATION`；服务端按 `idempotent:{key}:{userId}` 去重，
            TTL 4 小时，TTL 内重复提交同一 key 返回 409 + `IDEMPOTENT_CONFLICT`；
            业务失败（HTTP 状态 >= 400）时该 key 被释放，同 key 可立即重试。
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePhoneRequest'
      responses:
        '200':
          description: 更换成功（无数据载荷）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/devices:
    get:
      tags: [auth]
      summary: 设备列表
      description: |
        返回当前用户的登录设备列表（含已吊销，前端置灰展示）

        需 `ROLE_USER`；userId 由服务端从 JWT 解析，不接受 query / 路径参数。
        列表按 `lastActiveAt` 倒序（`findByUserIdOrderByLastActiveAtDesc`），包含已吊销设备。
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeviceSessionListApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/devices/{id}/revoke:
    post:
      tags: [auth]
      summary: 吊销设备
      description: |
        吊销指定设备：校验属主、标记 revoked 并使该设备 token 立即失效

        需 `ROLE_USER`；只按路径 `id` 定位设备记录，属主校验在服务端完成。
        设备不存在返回 404 + `RESOURCE_NOT_FOUND`；设备不属于当前用户返回 403 + `OPERATION_FORBIDDEN`；
        已吊销设备重复吊销为幂等成功（200，不重复写黑名单）。成功时该设备最近签发 token 的
        jti 进入 Redis 黑名单（TTL = JWT 有效期上限）。
      operationId: revokeDevice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 设备记录 ID（来自 GET `/auth/devices` 的 `id`）
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            幂等键（UUID 或业务唯一标识）。方法带 `@Idempotent` 且 `required` 默认 true，
            缺失时返回 422 + `INVALID_OPERATION`；服务端按 `idempotent:{key}:{userId}` 去重，
            TTL 4 小时，TTL 内重复提交同一 key 返回 409 + `IDEMPOTENT_CONFLICT`；
            业务失败（HTTP 状态 >= 400）时该 key 被释放，同 key 可立即重试。
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: 吊销成功（无数据载荷）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/deactivate:
    post:
      tags: [auth]
      summary: 注销账号
      description: |
        校验凭据后注销账号并匿名化个人数据；幂等，已注销账号重复调用直接成功

        需 `ROLE_USER`；userId 由服务端从 JWT 解析。凭据校验按账号是否有密码分叉：
        有密码账号必须带 `password` 且需匹配，否则 403 + `OPERATION_FORBIDDEN`；
        无密码账号（纯 wechat / apple 注册）必须带非空 `confirmationText`，缺失 403 + `OPERATION_FORBIDDEN`。

        成功后的服务端后果（`RealAccountSecurityService.deactivateAccount`）：
        - `status` 置为 `deactivated`
        - 昵称改为「已注销用户」、头像 URL 置空、手机号替换为含用户 ID 的脱敏占位（不可再登录）
        - 该用户全部 token（含当前请求 token）进入 Redis 黑名单，客户端必须重新登录
        - 同步清除该用户的实名认证照片文件与引用（清除失败仅记日志，不阻断注销）

        幂等语义分两层：业务层已注销账号（`status=deactivated`）重复调用直接返回 200 且不重复处理；
        传输层由 `@Idempotent` 基于 `Idempotency-Key` 去重，TTL 内复用同一 key 返回 409 + `IDEMPOTENT_CONFLICT`。
      operationId: deactivateAccount
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            幂等键（UUID 或业务唯一标识）。方法带 `@Idempotent` 且 `required` 默认 true，
            缺失时返回 422 + `INVALID_OPERATION`；服务端按 `idempotent:{key}:{userId}` 去重，
            TTL 4 小时，TTL 内重复提交同一 key 返回 409 + `IDEMPOTENT_CONFLICT`；
            业务失败（HTTP 状态 >= 400）时该 key 被释放，同 key 可立即重试。
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateRequest'
      responses:
        '200':
          description: 注销成功（含已注销账号的幂等成功，无数据载荷）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/stats:
    get:
      tags: [profile]
      summary: Get profile statistics
      description: Returns profile completion, photo count, video count, etc., for the profile page header.
      operationId: getProfileStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileStatsView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/basic:
    get:
      tags: [profile]
      summary: Get the basic profile
      description: Returns the current user's basic profile (nickname, bio, photos, background, etc.).
      operationId: getBasicProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Basic profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [profile]
      summary: Save the basic profile
      description: |
        Updates nickname, gender, birthday, bio, and Phase B extended fields.
        Recomputes `profileCompletion` as a weighted average
        (displayName 10% + campus 10% + schedule 10% + profileCompleted 70%).
      operationId: saveBasicProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicProfileRequest'
            example:
              nickname: '小明'
              bio: '热爱生活的本科生'
              grade: 'sophomore'
              pronouns: 'he/him'
              height: 178
              educationLevel: 'bachelor'
              relationshipStatus: 'never'
              hometownProvince: 'Beijing'
              hometownCity: 'Beijing'
              futureCity: 'Shanghai'
              futurePlanTags: ['tech', 'travel']
      responses:
        '200':
          description: Saved basic profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/background:
    post:
      tags: [profile]
      summary: Upload profile background image
      description: Multipart upload of the profile page background image. Validates MIME and magic bytes.
      operationId: uploadProfileBackground
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: Updated basic profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/photos:
    post:
      tags: [profile]
      summary: Upload a photo wall image
      description: |
        Multipart upload of a photo wall image at the specified `index`
        (0-5). Index out of range returns 400.
      operationId: uploadProfilePhoto
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: index
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 5
          description: Photo wall slot index (0-5).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/photos/{index}:
    delete:
      tags: [profile]
      summary: Delete a photo wall image
      description: Deletes the photo wall image at the specified index (0-5).
      operationId: deleteProfilePhoto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: index
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 5
          description: Photo wall slot index (0-5).
      responses:
        '200':
          description: Deletion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/video:
    post:
      tags: [profile]
      summary: Upload personal video
      description: Multipart upload of a personal introduction video.
      operationId: uploadProfileVideo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/half-body:
    post:
      tags: [profile]
      summary: Upload half-body photo
      description: Multipart upload of a half-body photo used for verification.
      operationId: uploadProfileHalfBody
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /profile/campus:
    get:
      tags: [profile]
      summary: Get campus profile
      description: Returns the campus profile (city, campus name, department, verification status).
      operationId: getCampusProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Campus profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [profile]
      summary: Save campus profile
      description: Updates city, campus name, and department.
      operationId: saveCampusProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampusProfileRequest'
            example:
              city: 'Beijing'
