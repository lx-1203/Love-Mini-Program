      type: object
      properties:
        id:
          type: string
        title:
          type: string
        location:
          type: string
        scheduleText:
          type: string
      required:
        - id
        - title
        - location
        - scheduleText
    SubmissionType:
      type: string
      enum: [FEEDBACK, SUGGESTION, ACTIVITY_PROPOSAL]
    SubmissionRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 5000
        contactWechat:
          type: string
          nullable: true
          maxLength: 64
        attachments:
          type: array
          items:
            type: string
        expectedCity:
          type: string
          nullable: true
        expectedCampus:
          type: string
          nullable: true
      required:
        - title
        - content
    SubmissionRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/SubmissionType'
        title:
          type: string
        status:
          type: string
          enum: [submitted, processing, reviewed, planned, converted]
        latestReplySummary:
          type: string
        submittedAt:
          type: string
          format: date-time
        convertedActivityId:
          type: integer
          format: int64
          nullable: true
      required:
        - id
        - type
        - title
        - status
        - latestReplySummary
        - submittedAt
    SubmissionRecordApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/SubmissionRecord'
      required:
        - success
    SubmissionDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/SubmissionType'
        title:
          type: string
        content:
          type: string
        attachments:
          type: array
          items:
            type: string
        latestReplyContent:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - content
        - submittedAt
    UploadedImageResult:
      type: object
      properties:
        url:
          type: string
        size:
          type: integer
          format: int64
        contentType:
          type: string
      required:
        - url
        - size
        - contentType
    DebugNextMatchStatusResponse:
      type: object
      properties:
        nextQueueStatus:
          type: string
          enum: [queued, connected, expired]
      required:
        - nextQueueStatus
    DebugErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
      required:
        - error
        - message
    # ===== Match Schemas =====
    # 注意：以下 Match 相关 Schema 同样在 docs/openapi/likes.yaml 中以 *View 后缀定义。
    # 此处重复声明是为了让 apps/client 的 generate:openapi 脚本（仅处理本文件）
    # 能生成客户端代码引用的 Schemas["MatchFormConfig"] / Schemas["MatchResult"] /
    # Schemas["MatchRequest"] / Schemas["QuickMatchRequest"] 类型。
    # 字段定义与 likes.yaml 保持一致，避免契约漂移。
    MatchFormConfig:
      type: object
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/MatchFormSection'
      required:
        - sections
    MatchFormSection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/MatchFormField'
      required:
        - id
        - title
        - fields
    MatchFormField:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [single-select, multi-select, stepper]
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/MatchOption'
        min:
          type: integer
          nullable: true
        max:
          type: integer
          nullable: true
      required:
        - id
        - kind
        - label
        - options
    MatchOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id
        - label
    MatchRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: Ignored — authenticated user ID from JWT is always used.
        matchIntent:
          type: string
          maxLength: 64
        topicIds:
          type: array
          items:
            type: string
        timeWindow:
          type: string
          maxLength: 32
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
      required:
        - userId
        - matchIntent
        - timeWindow
        - durationMinutes
    QuickMatchRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: Ignored — authenticated user ID from JWT is always used.
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 180
      required:
        - userId
        - durationMinutes
    MatchResult:
      type: object
      properties:
        id:
          type: string
        queueStatus:
          type: string
          enum: [queued, connected, expired]
        topicLabel:
          type: string
        partnerHeadline:
          type: string
        countdownMinutes:
          type: integer
        recommendedPrompt:
          type: string
        tempChatSessionId:
          type: string
          nullable: true
      required:
        - id
        - queueStatus
        - topicLabel
        - partnerHeadline
        - countdownMinutes
        - recommendedPrompt
    UnifiedProfileView:
      type: object
      description: |
        Unified profile contract (`UserProfileDTO`). One shape serves both the self page
        and the "other user" page; viewer-relative members (`relation`, `distanceText`)
        are only populated for the latter.
      properties:
        id:
          type: integer
          format: int64
        basic:
          $ref: '#/components/schemas/UnifiedProfileBasic'
        identity:
          $ref: '#/components/schemas/UnifiedProfileIdentity'
        intro:
          $ref: '#/components/schemas/UnifiedProfileIntro'
        relationship:
          $ref: '#/components/schemas/UnifiedProfileRelationship'
        media:
          $ref: '#/components/schemas/UnifiedProfileMedia'
        socialProof:
          $ref: '#/components/schemas/UnifiedProfileSocialProof'
        relation:
          $ref: '#/components/schemas/UnifiedProfileRelation'
        posts:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedProfilePost'
        stories:
          type: array
          items:
            $ref: '#/components/schemas/UnifiedProfileStory'
        circles:
          type: array
          items: { type: string }
        state:
          type: string
          description: Profile quality gate derived from completion / photo count / campus verification.
          enum: [NEW, INCOMPLETE, NORMAL, HIGH_QUALITY, PRIVATE]
        distanceText:
          type: string
          nullable: true
          description: |
            Haversine distance between viewer and target, fuzzy-floored per ADR-16
            ("<1km" / "3km"). Source: `users.latitude`/`users.longitude` (gcj02, 271/292 populated).
            Null when either side has no stored coordinates, when both users share the same campus,
            or when the computed distance exceeds 300 km (treated as GPS drift).
        online:
          type: boolean
          nullable: true
          description: |
            Three-state presence flag. `true` = live session record (Redis `online:user:{userId}`,
            same source as the admin "在线用户" list) or a `user_online_status.last_heartbeat`
            within 5 minutes. `false` = the account has session/heartbeat rows but none is active.
            `null` = no presence evidence at all (unknown, rendered as an explicit placeholder).
      required: [id, basic, identity, intro, relationship, media, socialProof, relation, posts]
    UnifiedProfileBasic:
      type: object
      properties:
        name: { type: string }
        avatar: { type: string }
        age:
          type: integer
          nullable: true
          description: Derived from `user_basic_profile.birth_year`; null when absent.
        location: { type: string }
        gender:
          type: string
          nullable: true
      required: [name, avatar, location]
    UnifiedProfileIdentity:
      type: object
      properties:
        verified: { type: boolean }
        student: { type: boolean }
        mbti: { type: string }
        personality:
          type: array
          items: { type: string }
      required: [verified, student, mbti, personality]
    UnifiedProfileIntro:
      type: object
      properties:
        bio: { type: string }
        tags:
          type: array
          items: { type: string }
      required: [bio, tags]
    UnifiedProfileRelationship:
      type: object
      properties:
        goal: { type: string }
        expectation:
          type: array
          items: { type: string }
      required: [goal, expectation]
    UnifiedProfileMedia:
      type: object
      properties:
        cover: { type: string }
        photos:
          type: array
          items: { type: string }
        videos:
          type: array
          items: { type: string }
        voiceIntro: { type: string }
      required: [cover, photos, videos, voiceIntro]
    UnifiedProfileSocialProof:
      type: object
      description: Aggregated counters (single COUNT/SUM queries, see R16 performance note).
      properties:
        likedMeCount: { type: integer, format: int64 }
        likesCount: { type: integer, format: int64 }
        visitorCount: { type: integer, format: int64 }
        matchCount: { type: integer, format: int64 }
      required: [likedMeCount, likesCount, visitorCount, matchCount]
    UnifiedProfileRelation:
      type: object
      description: Viewer-to-target relation block; empty on the self view.
      properties:
        liked: { type: boolean }
        matched: { type: boolean }
        chatted: { type: boolean }
        blocked: { type: boolean }
        matchScore: { type: integer }
        matchReasons:
          type: array
          items: { type: string }
        commonInterests:
          type: array
          description: |
            Legacy flat word list, kept for existing consumers (client + admin).
            One entry per `commonPoints` item, equal order and equal length; the entry equals
            the point title. The historical "tag/subtitle" slash-encoding convention is NOT used
            by the real backend — read `commonPoints` instead.
          items: { type: string }
        commonPoints:
          type: array
          description: Structured "我们有 N 个共同点" cards (max 3).
          maxItems: 3
          items:
            $ref: '#/components/schemas/UnifiedProfileCommonPoint'
      required: [liked, matched, chatted, blocked, matchScore, matchReasons, commonInterests, commonPoints]
    UnifiedProfileCommonPoint:
      type: object
      description: |
        A single common point. Every member is persisted-data derived; `subtitle`/`icon`
        stay null whenever the backing column is empty (no client-side lookup tables).
      properties:
        title:
          type: string
          description: |
            Shared interest tag as stored in `user_basic_profile.interest_tags`,
            or a relation label (同校 / 同城 / 同龄) derived from
            `user_campus_profile.campus_name` / `city_name` / `user_basic_profile.birth_year`.
        subtitle:
          type: string
          nullable: true
          description: |
            Grey second line. Populated for relation points (campus name, city name, target age).
            For interest tags it comes from `interest_tag.category`, currently 0/8 rows populated,
            so real traffic returns null.
        icon:
          type: string
          nullable: true
          description: |
            Icon identifier from `interest_tag.icon`. Currently 0/8 rows populated ⇒ null;
            once the admin tag dictionary is filled this becomes real without a code change.
      required: [title]
    UnifiedProfilePost:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        images:
          type: array
          items: { type: string }
        likes: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
        createdAt: { type: string }
      required: [id, content, images, likes, comments, createdAt]
    UnifiedProfileStory:
      type: object
      properties:
        id: { type: string }
        cover: { type: string }
        title: { type: string }
        location: { type: string }
        dateText: { type: string }
      required: [id, cover, title, location, dateText]
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: BAD_REQUEST
            message: 'Invalid request body.'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: UNAUTHORIZED
            message: 'Missing or invalid bearer token.'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: FORBIDDEN
            message: 'User disabled or insufficient role.'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: NOT_FOUND
            message: 'Resource not found.'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: CONFLICT
            message: 'Resource already exists or optimistic lock conflict.'
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: INVALID_OPERATION
            message: '缺少 Idempotency-Key 请求头'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: RATE_LIMITED
            message: 'Rate limit exceeded.'
    PayloadTooLarge:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: PAYLOAD_TOO_LARGE
            message: 'File exceeds 5 MB limit.'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: INTERNAL_ERROR
            message: 'Unexpected server error.'
