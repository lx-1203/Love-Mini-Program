# ============================================================
# Campus Love docker-compose 编排（Task 8.1.3）
# ============================================================
# 服务清单：
#   1. mysql       — MySQL 8.0 数据库
#   2. redis       — Redis 7 缓存
#   3. api         — Spring Boot 后端 API
#   4. admin       — Vue3 管理后台（nginx 静态托管）
#   5. client      — uni-app 客户端 H5 预览
#   6. prometheus  — 指标采集
#   7. grafana     — 监控面板
#   8. alertmanager— 告警路由
#   9. node-exporter— 主机指标采集
#  10. backup      — MySQL 定时备份（cron sidecar）
#
# 启动顺序（depends_on）：
#   mysql/redis → api → admin/client → prometheus → grafana/alertmanager
#
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写真实值
#   2. docker compose up -d
#   3. 访问：
#      - API:        http://localhost:8080
#      - Admin:      http://localhost:5180
#      - Client H5:  http://localhost:5173
#      - Grafana:    http://localhost:3001
#      - Prometheus: http://localhost:9090
#      - Alertmanager: http://localhost:9093
#
# ⚠️ P1.19 安全提示（2026-07-28）：
#   - 所有密码字段（MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / REDIS_PASSWORD /
#     JWT_SECRET / GRAFANA_ADMIN_PASSWORD 等）必须通过 .env 文件注入
#   - .env.example 提供模板（<PLACEHOLDER> 占位），复制为 .env 后填写真实强密码
#   - docker-compose.yml 中所有密码字段使用 ${VAR:?error message} 形式，
#     未设置环境变量时 docker compose 启动会失败（强制注入，无弱默认值）
#   - 切勿将含真实凭据的 .env 文件提交到版本控制系统（.gitignore 已排除）
# ============================================================

version: "3.9"

# ---------- 网络定义 ----------
networks:
  campus-net:
    driver: bridge
    name: campus-love-net

# ---------- 数据卷定义 ----------
volumes:
  mysql-data:
    name: campus-mysql-data
  redis-data:
    name: campus-redis-data
  prometheus-data:
    name: campus-prometheus-data
  grafana-data:
    name: campus-grafana-data
  alertmanager-data:
    name: campus-alertmanager-data
  api-uploads:
    name: campus-api-uploads
  api-logs:
    name: campus-api-logs
  mysql-backup:
    name: campus-mysql-backup

services:

  # ---------- 数据库（MySQL 8.0）----------
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    restart: unless-stopped
    environment:
      # Task 22（FIN-00269/00270）：移除默认密码，强制通过环境变量注入
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_love}
      MYSQL_USER: ${MYSQL_USER:-campus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
      - --slow_query_log=1
      - --long_query_time=2
      - --slow_query_log_file=/var/lib/mysql/slow.log
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/flyway/sql:/docker-entrypoint-initdb.d:ro
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      # Task 22：healthcheck 同步移除默认值，引用上方已校验的环境变量
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net

  # ---------- 缓存（Redis 7）----------
  redis:
    image: redis:7-alpine
    container_name: campus-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # Task 22：healthcheck 同步移除默认值，引用上方已校验的环境变量
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net

  # ---------- 后端 API（Spring Boot）----------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: campus-love/api:${TAG:-latest}
    container_name: campus-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: real
      APP_PORT: 8080
      # ---------- 数据库 ----------
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campus_love}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-campus}
      # Task 22（FIN-00270）：移除默认密码，强制通过环境变量注入（与 mysql 服务一致）
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # ---------- Redis ----------
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Task 22（FIN-00271）：移除默认密码，强制通过环境变量注入（与 redis 服务一致）
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # ---------- JWT ----------
      # Task 22（FIN-00272）：移除默认 JWT 密钥，强制通过环境变量注入（>=48 字符）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>=48 chars)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # ---------- 微信小程序 ----------
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      # ---------- CORS ----------
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5180}
      # ---------- AI ----------
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_API_BASE: ${AGNES_API_BASE:-https://api.agnes-ai.com/api}
      AGNES_TIMEOUT_MS: ${AGNES_TIMEOUT_MS:-30000}
      # ---------- 管理员初始化 ----------
      ADMIN_OPENID: ${ADMIN_OPENID:-admin-default-openid-change-me}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-系统管理员}
      ADMIN_INITIAL_PASSWORD_HASH: ${ADMIN_INITIAL_PASSWORD_HASH:-}
      # ---------- Flyway ----------
      APP_FLYWAY_LOCATIONS: filesystem:/app/db/migration
      # ---------- 媒体存储 ----------
      APP_MEDIA_STORAGE_ROOT: /app/uploads
      # ---------- RabbitMQ（可选）----------
      RABBITMQ_HOST: ${RABBITMQ_HOST:-}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # ---------- JVM ----------
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=50.0
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heap-dump.hprof
        -Djava.security.egd=file:/dev/./urandom
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Shanghai
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-uploads:/app/uploads
      - api-logs:/app/logs
      - ./database/flyway/sql:/app/db/migration:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net

  # ---------- 管理后台（Vue3 + nginx）----------
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_VERSION: ${TAG:-0.1.0}
    image: campus-love/admin:${TAG:-latest}
    container_name: campus-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "${ADMIN_PORT:-5180}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net

  # ---------- 客户端 H5 预览（uni-app build → nginx 托管）----------
  # 注：mp-weixin 产物需在微信开发者工具中导入，不能用 nginx 托管
  client:
    image: nginx:1.27-alpine
    container_name: campus-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-5173}:80"
    volumes:
      - ./apps/client/dist/build/h5:/usr/share/nginx/html:ro
      - ./docker/client-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net
    profiles:
      - client-h5

  # ---------- Prometheus 指标采集 ----------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: campus-prometheus
    restart: unless-stopped
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
      - --web.external-url=http://localhost:9090
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net

  # ---------- Grafana 监控面板 ----------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: campus-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Task 22：移除 Grafana 默认密码，强制通过环境变量注入
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net

  # ---------- Alertmanager 告警路由 ----------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: campus-alertmanager
    restart: unless-stopped
    depends_on:
      - prometheus
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - alertmanager-data:/alertmanager
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net

  # ---------- node-exporter 主机指标采集 ----------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: campus-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      # Task 52：补充 node-exporter 健康检查
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - campus-net
    profiles:
      - monitoring

  # ---------- MySQL + Redis 定时备份（cron sidecar，P3-D.3 增强）----------
  backup:
    image: alpine:3.19
    container_name: campus-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # P3-D.3：Redis 备份依赖 redis 服务健康（仅当启用 Redis 备份时生效）
      redis:
        condition: service_healthy
    environment:
      # 任务 24.4 要求的 DB_* 变量
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      # Task 22：移除默认密码，回退到 MYSQL_ROOT_PASSWORD（已由 mysql 服务强制校验）
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-campus_love}}
      # 兼容 backup-mysql.sh 脚本的 MYSQL_* 变量（脚本内部读取）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      # Task 22：移除默认密码，引用上方已校验的 MYSQL_ROOT_PASSWORD
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_love}
      # P3-D.3：Redis 备份变量（REDIS_HOST 配置时启用 Redis 备份）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_RDB_PATH: /data/redis/dump.rdb
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/backup-mysql.sh:/backup.sh:ro
      - ./backups:/backups
      - ./docker/backup/crontab:/etc/crontabs/root:ro
      # P3-D.3：挂载 redis-data 卷（只读）以便复制 dump.rdb
      - redis-data:/data/redis:ro
    # P3-D.3：安装 redis 客户端用于 BGSAVE 触发；mysql-client/gzip/tini 已有
    command: /bin/sh -c "apk add --no-cache mysql-client redis gzip tini && chmod +x /backup.sh && crond -f -l 8"
    healthcheck:
      # Task 52：补充 backup 容器健康检查（验证 cron 进程存活）
      test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - campus-net
    profiles:
      - backup
