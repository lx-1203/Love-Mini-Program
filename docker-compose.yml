# ============================================================
# Campus Love docker-compose 编排（Task 8.1.3）
# ============================================================
# 服务清单：
#   1. mysql       — MySQL 8.0 数据库
#   2. redis       — Redis 7 缓存
#   3. migrate     — Flyway 一次性迁移（single writer，跑完即退出）
#   4. api         — Spring Boot 后端 API
#   5. admin       — Vue3 管理后台（nginx 静态托管）
#   6. client      — uni-app 客户端 H5 预览
#   7. prometheus  — 指标采集
#   8. grafana     — 监控面板
#   9. alertmanager— 告警路由
#  10. node-exporter— 主机指标采集
#  11. backup      — MySQL 定时备份（cron sidecar）
#
# 启动顺序（depends_on）：
#   mysql/redis → migrate（一次性，成功退出）→ api → admin/client → prometheus → grafana/alertmanager
#
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写真实值
#   2. docker compose up -d
#   3. 访问：
#      - API:        http://localhost:8080
#      - Admin:      http://localhost:5177
#      - Client H5:  http://localhost:5173
#      - Grafana:    http://localhost:3001
#      - Prometheus: http://localhost:9090
#      - Alertmanager: http://localhost:9093
#
# ⚠️ P1.19 安全提示（2026-07-28）：
#   - 所有密码字段（MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / REDIS_PASSWORD /
#     JWT_SECRET / GRAFANA_ADMIN_PASSWORD 等）必须通过 .env 文件注入
#   - .env.example 提供模板（<PLACEHOLDER> 占位），复制为 .env 后填写真实强密码
#   - docker-compose.yml 中所有密码字段使用 ${VAR:?error message} 形式，
#     未设置环境变量时 docker compose 启动会失败（强制注入，无弱默认值）
#   - 切勿将含真实凭据的 .env 文件提交到版本控制系统（.gitignore 已排除）
#
# 2026-08-05 Infra 加固（infra-review 45 条）：
#   - 所有对外端口仅绑定 127.0.0.1（数据库/Redis/监控/应用服务均不暴露公网，
#     与外层 Nginx 80/443 入网策略一致；Prometheus/Alertmanager 无认证，仅限本机访问）
#   - Flyway 迁移既不挂载到 MySQL initdb.d，也不再于 api 启动时执行（S3-2：
#     多副本并发启动会同时抢跑同一批 DDL）。改由一次性 `migrate` 服务运行官方 Flyway CLI
#     （本仓既有 CLI 方式，见 database/flyway/flyway.toml + scripts/launcher/run-flyway.ps1；
#     注意 apps/api/pom.xml 只有 flyway-core/flyway-mysql 依赖，无 flyway-maven-plugin，
#     故不存在 `./mvnw flyway:migrate`）。api 以 depends_on.condition:service_completed_successfully
#     等其成功退出后再启动。单容器开发可用 FLYWAY_ENABLED=true 重开 api 启动时迁移，届时
#     迁移目录仍以只读挂载 ./database/flyway/sql:/app/db/migration:ro 供该路径使用。
#   - 全部服务增加 deploy.resources.limits（防止 JVM/容器无限制占用宿主机资源）
#   - healthcheck 通过容器内环境变量（MYSQL_PWD / REDISCLI_AUTH）传递密码，
#     避免密码出现在进程参数中
#   - 移除未使用的 mysql-backup 死卷；备份目录与 backup-mysql.sh 的 BACKUP_DIR 对齐
#   - 网络按安全域拆分：data-net（mysql/redis/backup）与 app-net（其余服务），
#     api 同时接入两个网络（FIN-01328）
#   - TAG 默认值改为 dev（禁止 latest 默认上线，生产必须注入 ci-<sha> 或 release tag）
# ============================================================

version: "3.9"

# ---------- 网络定义（FIN-01328：按安全域拆分）----------
networks:
  data-net:
    driver: bridge
    name: campus-data-net
  app-net:
    driver: bridge
    name: campus-app-net

# ---------- 数据卷定义 ----------
volumes:
  mysql-data:
    name: campus-mysql-data
  redis-data:
    name: campus-redis-data
  prometheus-data:
    name: campus-prometheus-data
  grafana-data:
    name: campus-grafana-data
  alertmanager-data:
    name: campus-alertmanager-data
  api-uploads:
    name: campus-api-uploads
  api-logs:
    name: campus-api-logs

services:

  # ---------- 数据库（MySQL 8.0）----------
  mysql:
    image: mysql:8.0.39
    container_name: campus-mysql
    restart: unless-stopped
    environment:
      # Task 22（FIN-00269/00270）：移除默认密码，强制通过环境变量注入
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_love}
      MYSQL_USER: ${MYSQL_USER:-campus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      # FIN-00853：与项目标准排序规则对齐（MySQL 8 默认 utf8mb4_0900_ai_ci）
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
      - --slow_query_log=1
      - --long_query_time=2
      - --slow_query_log_file=/var/lib/mysql/slow.log
      # infra R2-00007：开启 binlog 支撑 DR 文档声明的 PITR（mysqlbinlog 增量恢复）
      - --log-bin=mysql-bin
      - --server-id=1
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=604800
    ports:
      # 仅绑定 127.0.0.1：数据库不对外（infra #1 / FIN-00854）
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅保留 CI 初始化脚本；Flyway 迁移目录不挂载到 initdb.d（infra #7：
      # 80+ 迁移脚本重复执行会损坏首次部署，且 ${admin_openid} 占位符会被原样写入）
      - ./database/init-mysql.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      # 密码通过容器环境变量 MYSQL_PWD 传递，不出现在进程参数（infra #3）
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - MKNOD
      - SYS_CHROOT

  # ---------- 缓存（Redis 7）----------
  redis:
    image: redis:7.2.5-alpine
    container_name: campus-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    environment:
      # 供 healthcheck 通过容器环境变量引用（避免进程参数明文，infra #3）
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      # 仅绑定 127.0.0.1：缓存不对外（infra #3 / FIN-00843）
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # REDISCLI_AUTH 从环境读取密码，redis-cli 进程参数无密码
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - MKNOD
      - SYS_CHROOT

  # ---------- Flyway 一次性迁移（S3-2：single writer）----------
  # 只跑一次、成功即退出；api 通过 depends_on.condition: service_completed_successfully
  # 等它跑完再启动，杜绝 N 个 api 副本并发抢跑同一批 DDL。
  # 用的是官方 Flyway CLI 镜像（本仓既有 CLI 方式：database/flyway/flyway.toml +
  # scripts/launcher/run-flyway.ps1 都指向 flyway CLI，而 apps/api/pom.xml 并无
  # flyway-maven-plugin——所以不能用 ./mvnw flyway:migrate）。
  # 版本对齐：pin 到 Spring Boot 3.3.1 托管的 Flyway 10.10.0（flyway-core 版本由
  # spring-boot-starter-parent BOM 决定）；如需精确小版本以 `mvn dependency:tree` 实测为准，
  # 本环境离线无法 docker pull 校验镜像 tag 存在性。
  migrate:
    image: flyway/flyway:10.10.0-alpine
    container_name: campus-flyway-migrate
    # 一次性任务绝不能重启：compose 默认 restart 即为 "no"，这里显式写出，防止被误改成
    # unless-stopped——那会让成功退出后的 migrate 反复重跑，并让 api 的
    # service_completed_successfully 依赖永远无法满足（容器被重启回 running）。
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 与 api 启动时迁移走同一套库账号（campus 用户，其 DDL 权限已在既有启动迁移中验证）。
      # 密码经 FLYWAY_PASSWORD 环境变量注入，不进命令行进程参数（infra #3 一致）。
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campus_love}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${MYSQL_USER:-campus}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # 迁移行为与 flyway.toml / application-real.yml 对齐（CLI 侧用环境变量覆盖）
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      # 占位符：CLI 路径与 Spring 路径必须注入【同一份值】（见 flyway.toml R4-00410 注释）。
      # ---- 2026-10-31 复审（P1）：凭据类占位符改为 ${VAR:?}，真正 fail-fast ----
      # 原写法 `${ADMIN_OPENID:-}` / `${ADMIN_INITIAL_PASSWORD_HASH:-}` 展开成【空字符串】，
      # 而空串对 Flyway 来说是"已配置的值"：迁移照常执行，插入一行 openid=''、password='' 的
      # ADMIN（users.openid/password 为 NOT NULL，'' 满足约束，见 V2026.05.18.0001:5）。
      # 也就是说 api 进程的 AdminOpenidValidator / AdminPasswordValidator 还没轮到跑，
      # 脏数据已经落库——本服务先于 api 完成，更没人拦得住。
      # `${VAR:?msg}` 在 VAR 未设置【或为空】时让 compose 直接中止，一行迁移都不会跑。
      # 注意 .env.example 里 ADMIN_OPENID= 是空值，复制后必须填写，否则 compose 报错即预期行为。
      FLYWAY_PLACEHOLDERS_ADMIN_OPENID: ${ADMIN_OPENID:?ADMIN_OPENID is required - no default, see .env.example}
      # 昵称是展示字段、不是凭据：保留与 application-real.yml 完全一致的非空默认值，
      # 避免两条路径给同一行写入不同昵称（独立 CLI 侧仍要求显式注入，见 flyway.toml）。
      FLYWAY_PLACEHOLDERS_ADMIN_NICKNAME: ${ADMIN_NICKNAME:-系统管理员}
      FLYWAY_PLACEHOLDERS_ADMIN_PASSWORD_HASH: ${ADMIN_INITIAL_PASSWORD_HASH:?ADMIN_INITIAL_PASSWORD_HASH is required - no default BCrypt hash, see .env.example}
      # DEMO_SEED=false 是 fail-closed 的安全侧（漏配即不灌演示数据），不属于"空默认值冒充已配置"。
      FLYWAY_PLACEHOLDERS_DEMO_SEED: ${DEMO_SEED:-false}
    volumes:
      - ./database/flyway/sql:/flyway/sql:ro
    # 镜像 ENTRYPOINT 即 flyway 可执行文件，command 传子命令；默认执行 migrate
    command: ["migrate"]
    networks:
      - data-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    security_opt:
      - no-new-privileges:true

  # ---------- 后端 API（Spring Boot）----------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-campus-love}/api:${TAG:-dev}
    container_name: campus-api
    restart: unless-stopped
    # S3-1（2026-10-30）优雅停机：Spring 侧 server.shutdown=graceful +
    # spring.lifecycle.timeout-per-shutdown-phase=30s 只是「愿意等」，容器必须真的等得到。
    # docker 默认 10s 就 SIGKILL，30 秒的收尾窗口会形同虚设，故这里给 45s（> 30s）。
    stop_grace_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # S3-2：等一次性 migrate 成功退出后再起 api（single writer，迁移不再在 boot 抢跑）
      migrate:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: real
      APP_PORT: 8080
      # ---------- 数据库 ----------
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campus_love}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      DB_USERNAME: ${MYSQL_USER:-campus}
      # Task 22（FIN-00270）：移除默认密码，强制通过环境变量注入（与 mysql 服务一致）
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # ---------- Redis ----------
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Task 22（FIN-00271）：移除默认密码，强制通过环境变量注入（与 redis 服务一致）
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # ---------- JWT ----------
      # Task 22（FIN-00272）：移除默认 JWT 密钥，强制通过环境变量注入（>=48 字符）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>=48 chars)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # ---------- 敏感数据加密 / WebSocket 来源 ----------
      # real profile 下两项均有启动 fail-fast（AesEncryptor / WebSocketConfig），
      # 必须经 Compose 显式注入，不能只在宿主 .env 中存在。
      APP_AES_SECRET: ${APP_AES_SECRET:?APP_AES_SECRET is required (>=32 chars)}
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:?WEBSOCKET_ALLOWED_ORIGIN_PATTERNS is required}
      # ---------- 微信小程序 ----------
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      # ---------- CORS ----------
      # 生产必须通过 .env 注入真实域名；默认值仅保留本地开发地址，
      # 不含示例生产域名，避免生产 .env 漏配时白名单混入无效 example.com 源（R4-00485/R4-02097）
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5177}
      # ---------- 监控抓取 ----------
      # Prometheus 的 campuslove-api job 不带凭据抓取 http://api:8080/actuator/prometheus，
      # 而 SecurityConfig 对 /actuator/** 要求 ROLE_ADMIN —— 不配白名单则抓取恒被拒，
      # 所有 API 指标（5xx/P99/JVM/HikariCP/登录/支付回调）无数据且 ApiDown 长期误报。
      # 默认放行 docker 私有网段（api 与 prometheus 同一 app-net）；留空即回到 fail-closed。
      # 宿主网段规划不同的，请在 .env 覆盖 METRICS_SCRAPE_ALLOWLIST。
      METRICS_SCRAPE_ALLOWLIST: ${METRICS_SCRAPE_ALLOWLIST:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # ---------- AI ----------
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_API_BASE: ${AGNES_API_BASE:-https://api.agnes-ai.com/api}
      AGNES_TIMEOUT_MS: ${AGNES_TIMEOUT_MS:-30000}
      # ---------- 管理员初始化 ----------
      # infra #8：移除公开默认值 admin-default-openid-change-me（可被冒充登录）。
      # ---- 2026-10-31 复审（P1）----
      # 这里原来是 `${ADMIN_OPENID:-}` / `${ADMIN_INITIAL_PASSWORD_HASH:-}`：注入空串。
      # application-real.yml 的 spring.flyway.placeholders 现在写成不带默认值的
      # ${ADMIN_OPENID} / ${ADMIN_INITIAL_PASSWORD_HASH}，而空串是"有值"——compose 若继续
      # 传空串，就会绕过 Spring 的占位符解析失败，把一行空凭据 ADMIN 直接种进库
      # （单容器开发 FLYWAY_ENABLED=true 时正是这条路径）。故与本文件 migrate 服务、
      # 以及 MYSQL_PASSWORD / JWT_SECRET / APP_AES_SECRET 同样改用 ${VAR:?}：未设置或为空即中止。
      ADMIN_OPENID: ${ADMIN_OPENID:?ADMIN_OPENID is required - no default, see .env.example}
      # 非凭据展示字段，与 migrate 服务、application-real.yml 共用同一个默认值，保证行内容一致。
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-系统管理员}
      ADMIN_INITIAL_PASSWORD_HASH: ${ADMIN_INITIAL_PASSWORD_HASH:?ADMIN_INITIAL_PASSWORD_HASH is required - no default BCrypt hash, see .env.example}
      # ---------- Flyway ----------
      # infra R2-00001:迁移目录已单源化(database/flyway/sql 含全部迁移,
      # 原 classpath 的 4 个 Phase A 迁移已并入主链重编号为 V2026.07.24.0001~0004,
      # 保证 media_asset 等表在后续迁移引用前创建)
      APP_FLYWAY_LOCATIONS: filesystem:/app/db/migration
      # S3-2（single writer）：compose 默认关闭 api 启动时迁移，改由一次性 `migrate`
      # 服务在 api 之前跑完（api depends_on migrate: service_completed_successfully）。
      # 多副本时只有 migrate 一个写入者，N 个 api 不再并发抢跑 DDL。
      # 单容器/本地开发想恢复「启动即迁移」：设 FLYWAY_ENABLED=true（在 .env 覆盖即可）。
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      # ---------- 媒体存储 ----------
      APP_MEDIA_STORAGE_ROOT: /app/uploads
      # ---------- RabbitMQ（可选）----------
      # 本编排未部署 rabbitmq 服务，应用在 MQ 不可用时自动降级（R4-02096）；
      # 故用户名/密码不再强制必填（避免不启用 MQ 也被阻塞）。若后续启用
      # RabbitMQ，必须在 .env 中配置强凭据，禁止使用默认 guest/guest 上线（infra #12/#13）
      RABBITMQ_HOST: ${RABBITMQ_HOST:-}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      # ---------- Swagger UI ----------
      # infra #11：生产默认关闭 Swagger UI / /v3/api-docs，可通过 .env 覆盖
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
      # ---------- JVM ----------
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=50.0
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heap-dump.hprof
        -Djava.security.egd=file:/dev/./urandom
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Shanghai
    ports:
      # 仅绑定 127.0.0.1：API 由外层 Nginx 反代对外（infra #4）
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - api-uploads:/app/uploads
      - api-logs:/app/logs
      - ./database/flyway/sql:/app/db/migration:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - data-net
      - app-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - MKNOD
      - SYS_CHROOT

  # ---------- 管理后台（Vue3 + nginx）----------
  admin:
    build:
      # 构建上下文为仓库根：apps/admin 无独立 lockfile，
      # Dockerfile 需从根目录 COPY pnpm-lock.yaml / pnpm-workspace.yaml（workspace 安装）
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_VERSION: ${TAG:-0.1.0}
    image: ${IMAGE_PREFIX:-campus-love}/admin:${TAG:-dev}
    container_name: campus-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 仅绑定 127.0.0.1：Admin 由外层 Nginx 反代对外（infra #4）
      - "127.0.0.1:${ADMIN_PORT:-5177}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    # 静态站点加固：只读根文件系统 + 丢弃全部 Linux capabilities（infra #14）
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------- 客户端 H5 预览（uni-app build → nginx 托管）----------
  # 注：mp-weixin 产物需在微信开发者工具中导入，不能用 nginx 托管
  client:
    image: nginx:1.27.3-alpine
    container_name: campus-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 仅绑定 127.0.0.1：H5 由外层 Nginx 反代对外（infra #4）
      - "127.0.0.1:${CLIENT_PORT:-5173}:80"
    volumes:
      - ./apps/client/dist/build/h5:/usr/share/nginx/html:ro
      - ./docker/client-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    # 官方 nginx 镜像 master 以 root 启动后需 setuid 降权 worker，
    # 因此保留 SETUID/SETGID，仅丢弃其余危险 cap
    cap_drop:
      - NET_RAW
      - MKNOD
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_ADMIN
    profiles:
      - client-h5

  # ---------- Prometheus 指标采集 ----------
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: campus-prometheus
    restart: unless-stopped
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
      # infra #30 / FIN-01329：external-url 与 environment 标签通过环境变量注入
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}
      - --web.external-labels=cluster=campus-love
      - --web.external-labels=environment=${PROMETHEUS_ENVIRONMENT:-production}
    ports:
      # 仅绑定 127.0.0.1（infra #4：9090 无认证，仅限本机访问）
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------- Grafana 监控面板 ----------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: campus-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Task 22：移除 Grafana 默认密码，强制通过环境变量注入
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
      # infra #30：root_url 通过环境变量注入
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3001}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      # 仅绑定 127.0.0.1（infra #4）
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------- Alertmanager 告警路由 ----------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: campus-alertmanager
    restart: unless-stopped
    depends_on:
      - prometheus
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # infra #30：external-url 通过环境变量注入
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    ports:
      # 仅绑定 127.0.0.1（infra #4：9093 无认证，仅限本机访问）
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - alertmanager-data:/alertmanager
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # FIN-00850：多环境部署时告警可区分来源
    labels:
      app: campus-love
      environment: ${DEPLOY_ENV:-production}

  # ---------- node-exporter 主机指标采集 ----------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: campus-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      # 仅绑定 127.0.0.1（infra #2：9100 无认证）
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - monitoring

  # ---------- MySQL + Redis 定时备份（cron sidecar，P3-D.3 增强）----------
  backup:
    image: alpine:3.19.4
    container_name: campus-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # P3-D.3：Redis 备份依赖 redis 服务健康（仅当启用 Redis 备份时生效）
      redis:
        condition: service_healthy
    environment:
      # 任务 24.4 要求的 DB_* 变量
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      # Task 22：移除默认密码，回退到 MYSQL_ROOT_PASSWORD（已由 mysql 服务强制校验）
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-campus_love}}
      # 兼容 backup-mysql.sh 脚本的 MYSQL_* 变量（脚本内部读取）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      # Task 22：移除默认密码，引用上方已校验的 MYSQL_ROOT_PASSWORD
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_love}
      # infra #16：备份目录与脚本 BACKUP_DIR 对齐（宿主 ./backups ↔ 容器 /backups）
      BACKUP_DIR: /backups
      # P3-D.3：Redis 备份变量（REDIS_HOST 配置时启用 Redis 备份）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_RDB_PATH: /data/redis/dump.rdb
      # S4-3：保留策略的唯一真相源在 scripts/backup-mysql.sh（窗口 BACKUP_RETENTION_DAYS、
      # 最少份数 BACKUP_KEEP_COUNT）。compose 只透传、不再自带 `:-7` 默认值，避免两处
      # magic number 打架；留空即由脚本内的默认值兜底。
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      BACKUP_KEEP_COUNT: ${BACKUP_KEEP_COUNT:-}
      # S4-3 加密（可选）：BACKUP_ENCRYPT=true 请求加密，密钥只能来自 BACKUP_ENCRYPTION_KEY
      # （compose 不给任何默认值；脚本在「请求加密但密钥缺失」时硬失败，绝不落明文）。
      # 切勿把真实密钥写进本文件或提交入库——只在部署机 .env / 密钥管理里注入。
      BACKUP_ENCRYPT: ${BACKUP_ENCRYPT:-false}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # S4-3 PITR：归档 binlog（mysql-bin.*）以便按时间点恢复；默认开。
      # 源目录 = 下面只读挂载的 mysql-data 卷里的 datadir。
      BACKUP_BINLOG_ARCHIVE: ${BACKUP_BINLOG_ARCHIVE:-true}
      MYSQL_BINLOG_DIR: /var/lib/mysql
      # infra #20：BACKUP_CRON 通过启动命令写入 crontab（不再硬编码 0 2 * * *）
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/backup-mysql.sh:/backup.sh:ro
      - ./backups:/backups
      # P3-D.3：挂载 redis-data 卷（只读）以便复制 dump.rdb
      - redis-data:/data/redis:ro
      # S4-3 PITR：只读挂载 mysql-data，以便归档 datadir 下的 mysql-bin.* 完成 binlog。
      # 注意：这会把整个数据目录（含表文件）以只读方式暴露给 backup 容器；backup 本就
      # 通过 mysqldump 能读到全库数据，暴露面一致。若不接受，可改用 mysqldump --master-data
      # 记录的坐标 + `mysqlbinlog --read-from-remote-server`（走网络、不挂卷）替代。
      - mysql-data:/var/lib/mysql:ro
    # infra #20 / FIN-00851：crontab 由启动命令根据 BACKUP_CRON 生成，
    # 以非 root 用户 backup 运行 crond（避免定时任务以 root 运行）
    # apk 包锁主版本（infra #28）：alpine 3.19 仓库中 mysql-client=10.11.x、redis=7.2.x
    # S4-3：补 bash —— backup-mysql.sh 用 `#!/usr/bin/env bash` 且依赖数组/进程替换等
    #   bash-ism，alpine 基础镜像默认只有 busybox sh，缺 bash 会让脚本根本无法执行；
    #   补 openssl —— 供 BACKUP_ENCRYPT=true 时的 AES-256 加解密（openssl 为 alpine 仓库包，
    #   非浮点 latest，随 alpine 3.19.4 基镜像版本走）。
    command: >
      /bin/sh -c "apk add --no-cache bash openssl mysql-client~10.11 redis~7.2 gzip tini &&
      adduser -D -H -s /sbin/nologin backup &&
      mkdir -p /etc/crontabs /backup &&
      chown -R backup:backup /etc/crontabs /backup /backups &&
      printf '%s /backup.sh >> /backup/cron.log 2>&1\n' \"$${BACKUP_CRON:-0 2 * * *}\" > /etc/crontabs/backup &&
      exec su backup -s /bin/sh -c 'crond -f -l 8 -c /etc/crontabs'"
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    security_opt:
      - no-new-privileges:true
    # 保留 SETUID/SETGID 供 su 降权使用，其余危险 cap 全部丢弃
    cap_drop:
      - NET_RAW
      - MKNOD
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_ADMIN
    profiles:
      - backup
